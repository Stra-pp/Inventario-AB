/* ===== Plazo de las 10am para cerrar/aprobar el inventario del día anterior =====
   Cocina/Bar tiene hasta las 10:00 (hora Ecuador) del día siguiente para
   guardar Y cerrar el inventario de un día; el Jefe de Operaciones (hoy
   Antonio Puga) tiene ese mismo plazo para aprobarlo una vez cerrado. Pasada
   esa hora nadie vuelve a poder tocar ese registro — ni cocina/bar seguir
   guardando o cerrando, ni el Jefe de Operaciones ajustar o aprobar — y se
   deja una nota explicando en qué quedó:
     - guardado pero nunca cerrado  → "se quedó guardado por <responsable>
       pero nunca se envió para aprobación".
     - cerrado pero nunca aprobado → "no fue revisado por la jefatura del
       área".
   Si nunca se abrió ni un registro ese día no hay nada que anotar: eso ya
   significa, por sí solo, que no hubo toma de inventario ese día. */
function invHoraECActual(){
  try{ return Number(new Date().toLocaleString("en-US",{timeZone:TZ_EC,hour:"2-digit",hour12:false})); }
  catch(e){ return (new Date().getUTCHours()+19)%24; } // fallback: UTC-5
}
function invLimite10amPasado(){ return invHoraECActual()>=10; }
/* Vencido = ya pasó el día de la fecha del registro Y (o pasó de largo un
   día completo, o es "mañana" pero ya dieron las 10am hora Ecuador). */
function invPlazoVencido(fechaRegistro){
  const hoy = hoyISO();
  if(fechaRegistro>=hoy) return false;
  const limite = sumaDiasYMD(fechaRegistro,1);
  return hoy>limite || (hoy===limite && invLimite10amPasado());
}
/* Anota (una sola vez, no repite si ya tiene nota) los registros de una
   bodega cuyo plazo de las 10am ya venció y quedaron sin cerrar o sin
   aprobar. Nunca los cierra ni los aprueba por su cuenta — solo deja
   constancia de qué faltó, para que Historial/Aprobación lo muestren. */
async function invAnotarVencidos(regs){
  for(const r of regs){
    if(r.notaLimite) continue;
    if(r.ingresoRetroactivo) continue; // lo ingresó/corrigió el Desarrollador o el Jefe de Operaciones a propósito
    if(!(!r.cerrado || (r.cerrado && r.aprobado===false))) continue;
    if(!invPlazoVencido(r.fecha)) continue;
    const nota = !r.cerrado
      ? `El inventario se quedó guardado por ${r.responsable||"—"} pero nunca se envió para aprobación.`
      : `El inventario no fue revisado por la jefatura del área.`;
    try{
      await Store.writeOne("Inventario", {...r, notaLimite:nota, bloqueadoPorLimite:true});
      r.notaLimite=nota; r.bloqueadoPorLimite=true;
    }catch(e){ /* si falla, se reintenta la próxima vez que alguien abra esta bodega */ }
  }
  return regs;
}
/* Si por el problema anterior quedaron dos registros del mismo día, toda la app
   usa uno solo: el cerrado, o el que tiene más datos, o el editado más reciente.
   El otro queda en SharePoint sin tocar, pero no se muestra ni se usa. */
function invPesoRegistro(r){
  const datos=(r.items||[]).filter(i=>!invFinalVacio(i)||(+i.inicial||0)||(+i.tp||0)||(+i.tn||0)||(+i.merma||0)).length;
  return (r.cerrado?1e9:0) + datos*1000 + (r.servicios||[]).length*10;
}
function invSinDuplicados(regs){
  const porDia=new Map();
  for(const r of regs){ const k=r.bodega+"|"+r.fecha; const a=porDia.get(k);
    if(!a || invPesoRegistro(r)>invPesoRegistro(a) || (invPesoRegistro(r)===invPesoRegistro(a) && (r.editadoEn||r.creadoEn||"")>(a.editadoEn||a.creadoEn||""))) porDia.set(k,r); }
  return regs.filter(r=>porDia.get(r.bodega+"|"+r.fecha)===r);
}
/* Guardado sin pisar a otros: si mientras alguien tenía abierto un día otra
   persona guardó cambios (PAX, conteo, traslados, aprobación), al guardar se
   vuelve a leer el registro y solo se aplica lo que ESTA persona cambió,
   conservando lo que guardaron los demás. Antes ganaba el último en guardar y
   se perdía lo del otro, por eso no todos veían lo mismo. */
const INV_CAMPOS_ITEM = ["inicial","tp","tn","merma","final"];
const invIgual = (a,b) => JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
function invFusionar(orig, mio, ultimo){
  if(!ultimo || !orig) return mio;
  const out = {...ultimo};
  for(const k of new Set([...Object.keys(mio), ...Object.keys(orig)])){
    if(["items","servicios","ajustes","trasladosAplicados"].includes(k)) continue;
    if(!invIgual(mio[k], orig[k])) out[k] = mio[k];
  }
  const items = (ultimo.items||[]).map(u=>{ const o=invBuscarItem(orig.items,u), m=invBuscarItem(mio.items,u);
    if(!m) return u; if(!o) return {...u, ...Object.fromEntries(INV_CAMPOS_ITEM.map(c=>[c, m[c]]))};
    const r={...u}; for(const c of INV_CAMPOS_ITEM) if(!invIgual(m[c], o[c])) r[c]=m[c]; return r; });
  for(const m of (mio.items||[])) if(!invBuscarItem(ultimo.items,m) && !invBuscarItem(orig.items,m)) items.push(m);
  out.items = items;
  const idsO = new Set((orig.servicios||[]).map(x=>x.id)), idsM = new Set((mio.servicios||[]).map(x=>x.id));
  const quitados = [...idsO].filter(id=>!idsM.has(id));
  const agregados = (mio.servicios||[]).filter(x=>!idsO.has(x.id));
  out.servicios = [...(ultimo.servicios||[]).filter(x=>!quitados.includes(x.id)),
                   ...agregados.filter(x=>!(ultimo.servicios||[]).some(y=>y.id===x.id))];
  out.ajustes = [...(ultimo.ajustes||[]), ...(mio.ajustes||[]).slice((orig.ajustes||[]).length)];
  if(ultimo.cerrado && !mio.cerrado && !orig.cerrado) out.cerrado = true; // si otro ya lo cerró, sigue cerrado
  return out;
}
async function invGuardarFusionado(orig, mio){
  let ultimo = null;
  try{ ultimo = (await Store.read("Inventario",{noCache:true})).find(x=>x.id===mio.id) || null; }catch(e){}
  const fin = invFusionar(orig, mio, ultimo);
  await Store.writeOne("Inventario", fin);
  return fin;
}
async function invRegistrosDe(codigo){
  // Siempre la versión vigente de SharePoint: así todos ven lo mismo que se guardó.
  const all = invSinDuplicados(await Store.read("Inventario",{noCache:true}));
  const regs = all.filter(r=>r.bodega===codigo).sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
  await invAnotarVencidos(regs);
  return regs;
}
/* Si a un registro TODAVÍA ABIERTO (sin cerrar) le agregaron productos nuevos
   al catálogo de su bodega después de haberse creado (por Configurar, o
   automáticamente por un traslado Zeus de un código que no existía),
   ese registro se queda con la lista vieja para siempre — invAbrirHoy sólo
   arma la lista completa una vez, al crear. Esto los pone al día agregando,
   sin tocar lo ya contado, los productos del catálogo que todavía no estén
   en items (inicial 0, sin traslados/merma, final vacío) y guarda el
   resultado para que quede así para todos, no sólo en esta sesión. */
function invClaveProducto(p){
  return p && p.codigo ? ("C:"+String(p.codigo).trim().toUpperCase()) : ("N:"+String((p&&p.nombre)||"").trim().toUpperCase());
}
async function invSincronizarItems(rec, regs){
  const bod = invBodega(rec.bodega);
  const catalogo = (bod && bod.productos) || [];
  /* Nunca se sincroniza contra un catálogo vacío o que no se pudo confirmar con
     SharePoint (sin conexión, lectura fallida): eso borraba los productos del día. */
  if(!catalogo.length || (MODE==="graph" && INV_CFG_REV_BASE===null)) return rec;
  const restantes = (rec.items||[]).filter(it=>!it.soloDia);
  const anterior = (regs||[]).filter(r=>r.fecha<rec.fecha).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];
  let cambios = false;
  const itemsFinales = catalogo.map(p=>{
    const existente = invBuscarItem(restantes, p);
    if(existente){ restantes.splice(restantes.indexOf(existente),1);
      if(existente.codigo!==p.codigo || existente.nombre!==p.nombre){ cambios=true; return {...existente, codigo:p.codigo, nombre:p.nombre}; }
      return existente; }
    cambios = true;
    // Producto agregado al catálogo después de crear el día: arrastra el final del día anterior.
    const prev = anterior && invBuscarItem(anterior.items, p);
    return {codigo:p.codigo, nombre:p.nombre, unidad:p.unidad||"", inicial: prev ? Math.round(invFinalVista(prev)*1000)/1000 : 0, tp:0, tn:0, merma:0, final:null};
  });
  // Los ítems creados por un traslado solo para ese día ("item nuevo") se conservan.
  const soloDelDia = (rec.items||[]).filter(it=>it.soloDia);
  if(restantes.length) cambios = true; // había items que ya no están en el catálogo: se eliminan
  if(!cambios) return rec;
  const toSave = {...rec, items:[...itemsFinales, ...soloDelDia]};
  try{ await Store.writeOne("Inventario", toSave); }catch(e){ /* si falla el guardado, se reintenta la próxima vez que se abra */ }
  return toSave;
}
/* Crea desde cero el registro de una fecha puntual para una bodega, llevando
   el "Cantidad final" del último día CERRADO (anterior a esa fecha) como
   "Inicial" de cada producto — la misma regla que ya usan en la Bitácora de
   Excel: el inventario final de un día es el inicial (el real consumido)
   del día siguiente. Compartida por invAbrirHoy tanto para abrir hoy como
   para el registro de ayer que el usuario elige abrir explícitamente. */
/* Busca en una lista de ítems el mismo producto: primero por código+nombre
   (hay productos sin código, p.ej. ARROZ y UÑA DE CANGREJO, y códigos
   repetidos, p.ej. las dos presentaciones de WAHOO con 103093); si no, por
   código solo cuando ese código es único. Antes se buscaba solo por código y
   los productos sin código se mezclaban entre sí al arrastrar el inicial. */
function invBuscarItem(items, p){
  items = items||[];
  const exacto = items.find(x=>(x.codigo||"")===(p.codigo||"") && x.nombre===p.nombre);
  if(exacto) return exacto;
  /* Mismo nombre (único) antes que mismo código: si se corrige o intercambia el
     código de un producto en el catálogo, el Inicial se sigue arrastrando del
     producto correcto y no del que tenía ese código antes. */
  const mismoNombre = items.filter(x=>x.nombre===p.nombre && !x.soloDia);
  if(mismoNombre.length===1) return mismoNombre[0];
  if(!p.codigo) return null;
  const mismos = items.filter(x=>x.codigo===p.codigo && !x.soloDia);
  return mismos.length===1 ? mismos[0] : null;
}
/* Cadena de inventario: el Inicial de cada día es la Cantidad final del día
   anterior (o lo disponible si ese día todavía no tiene final). Cuando se
   guarda o se cierra un día —o le entra un traslado, o Antonio lo ajusta— se
   recalcula el Inicial de TODOS los días siguientes que sigan abiertos, en
   orden, hasta topar con un día cerrado. Así no queda ningún día "cortado"
   aunque el día siguiente ya se hubiera creado antes (p.ej. por el traslado
   automático de las 8am). Los días cerrados no se tocan solos: si el cambio
   los afecta se devuelve en "cerradoAfectado" para que el Desarrollador
   decida (ver guardar() en InventarioCierre). */
async function invPropagarInicial(codigo, desde, opts){
  opts = opts||{};
  const r3 = v => Math.round(v*1000)/1000;
  const regs = invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.bodega===codigo))
    .sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  let prev = desde; const cambiados=[]; let cerradoAfectado=null;
  for(const r of regs){
    if(r.fecha<=desde.fecha) continue;
    let cambio=false;
    const items=(r.items||[]).map(it=>{ if(it.soloDia) return it;
      const e=invBuscarItem(prev.items,it); if(!e) return it;
      const v=r3(invFinalVista(e)); if((+it.inicial||0)!==v){ cambio=true; return {...it, inicial:v}; } return it; });
    if(r.cerrado && !opts.incluirCerrados){ if(cambio) cerradoAfectado=r.fecha; break; }
    const nuevo={...r, items};
    if(cambio){ await Store.writeOne("Inventario", opts.quien ? {...nuevo, editadoPor:opts.quien, editadoEn:nowISO()} : nuevo); cambiados.push(r.fecha); }
    prev=nuevo;
    if(r.cerrado) break; // con incluirCerrados solo se corrige ese primer día cerrado
  }
  return {cambiados, cerradoAfectado};
}
/* Lista legible de lo que cambió entre dos versiones de un día (para la nota
   de ajuste que queda visible cuando alguien distinto del Desarrollador
   modifica un inventario). */
function invDetalleCambios(antes, despues){
  const out=[]; const campos=[["inicial","Inicial"],["tp","Trasl.+"],["tn","Trasl.−"],["merma","Merma"],["final","Final"]];
  for(const it of (despues.items||[])){ const a=invBuscarItem((antes&&antes.items)||[], it); if(!a) continue;
    for(const [k,lab] of campos){ const va=a[k]===null||a[k]===undefined||a[k]===""?null:+a[k], vd=it[k]===null||it[k]===undefined||it[k]===""?null:+it[k];
      if(va!==vd) out.push(`${it.nombre}: ${lab} ${va===null?"—":va} → ${vd===null?"—":vd}`); } }
  const pa=invTotalPax(antes||{}), pd=invTotalPax(despues);
  if(pa!==pd) out.push(`PAX ${pa} → ${pd}`);
  return out;
}
/* Dos llamadas casi simultáneas para el mismo día (p.ej. al cambiar de bodega
   con una fecha elegida en el selector se disparan dos cargas a la vez)
   creaban DOS registros del mismo día. Se comparte la misma creación en curso. */
const INV_CREANDO = new Map();
function invCrearRegistroPara(codigo, user, fecha, regs){
  const k = codigo+"|"+fecha;
  if(INV_CREANDO.has(k)) return INV_CREANDO.get(k);
  const p = invCrearRegistroPara_(codigo, user, fecha, regs).finally(()=>INV_CREANDO.delete(k));
  INV_CREANDO.set(k, p); return p;
}
async function invCrearRegistroPara_(codigo, user, fecha, regs){
  const bod = invBodega(codigo);
  /* Antes de crear, se vuelve a leer SIN caché: si otro dispositivo ya creó
     ese mismo día hace unos segundos se usa ese (así no quedan dos registros
     del mismo día, como pasó con el 29 de PLAZA PARAÍSO). */
  const yaExiste = invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.bodega===codigo && r.fecha===fecha))[0];
  if(yaExiste) return yaExiste;
  /* El inicial sale del día ANTERIOR más reciente, esté cerrado o no (si no
     tiene cantidad final escrita, se toma lo disponible, igual que al
     cerrarlo). Antes solo se miraba el último día CERRADO, así que si había
     días intermedios abiertos el inicial salía de un día viejo. */
  const anterior = regs.filter(r=>r.fecha<fecha).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];
  const base = (bod && bod.productos) || [];
  const items = base.map(p=>{
    const prev = anterior && invBuscarItem(anterior.items, p);
    return {codigo:p.codigo, nombre:p.nombre, unidad:p.unidad||"", inicial: prev ? Math.round(invFinalVista(prev)*1000)/1000 : 0, tp:0, tn:0, merma:0, final:null};
  });
  /* El responsable se asigna al GUARDAR el conteo (InventarioCierre), no al
     abrir: abrir el día para mirarlo o para registrar PAX no es contar. */
  const rec = {id:gid(), bodega:codigo, bodegaNombre:bod?bod.nombre:codigo, fecha, responsable:"",
    items, servicios:[], cerrado:false, creadoPor:user.nombre, creadoEn:nowISO()};
  await Store.writeOne("Inventario", rec);
  return rec;
}
/* Antes de las 10am, dice si tiene sentido ofrecerle al usuario la opción de
   registrar el día ANTERIOR en vez de hoy: solo cuando ese día de ayer
   todavía no tiene ningún registro (ni abierto ni cerrado) — si ya existe
   uno sin cerrar, invAbrirHoy ya lo entrega directo, sin necesidad de elegir. */
function invPuedeElegirAyer(regs){
  if(invLimite10amPasado()) return false;
  const ayer = sumaDiasYMD(hoyISO(),-1);
  return !regs.find(r=>r.fecha===ayer);
}
/* Abre (o recupera) el registro del día operativo para una bodega.
   Plazo de las 10am: si todavía no dan las 10am (hora Ecuador) y el
   registro de AYER quedó sin cerrar, se sigue entregando ese registro de
   ayer (para que cocina/bar lo termine y cierre) en vez de abrir uno nuevo
   de hoy. Si en cambio ayer nunca se llegó ni a abrir, y el usuario elige
   explícitamente registrar el de ayer (fechaDeseada:"ayer") — p.ej. porque
   se les pasó por alto —, se le crea ese registro con fecha de ayer; esa
   opción deja de estar disponible en cuanto dan las 10am (invPuedeElegirAyer).
   En cualquier otro caso se abre/crea el de hoy. En cuanto cierran el de
   ayer, o pasan las 10am, se pasa a hoy normalmente y el de ayer queda como
   quedó (ver invAnotarVencidos). */
async function invAbrirHoy(codigo, user, fechaDeseada){
  await invCfgRefrescar();
  const hoy = hoyISO();
  const regs = await invRegistrosDe(codigo);
  const ayer = sumaDiasYMD(hoy,-1);
  if(!invLimite10amPasado()){
    const deAyer = regs.find(r=>r.fecha===ayer);
    if(deAyer && !deAyer.cerrado) return await invSincronizarItems(deAyer, regs);
    if(fechaDeseada==="ayer" && !deAyer) return await invCrearRegistroPara(codigo, user, ayer, regs);
  }
  const deHoy = regs.find(r=>r.fecha===hoy);
  if(deHoy) return deHoy.cerrado ? deHoy : await invSincronizarItems(deHoy, regs);
  return await invCrearRegistroPara(codigo, user, hoy, regs);
}

/* Abre (o crea) el registro de una fecha cualquiera, sin la limitación de
   "solo hoy o ayer" de invAbrirHoy. Pensada para que el Jefe de Operaciones
   (hoy Antonio Puga, esJefeOperaciones) y el Desarrollador puedan ingresar
   retroactivamente el inventario de un día anterior que se pasó por alto
   (o, en el caso del Desarrollador, para pruebas/soporte), sin importar
   cuánto tiempo atrás — ver el selector de fecha en InventarioCierre, que
   solo se muestra a quien tenga esJefeOperaciones(user) o esDev(user). Si
   esa fecha ya tiene
   registro (abierto o cerrado) lo entrega tal cual — un cerrado queda de
   solo lectura, igual que en cualquier otra pantalla —; si no existe, lo
   crea llevando el "Cantidad final" del último día cerrado anterior como
   "Inicial", igual que invCrearRegistroPara. */
async function invAbrirFecha(codigo, user, fecha){
  await invCfgRefrescar();
  const regs = await invRegistrosDe(codigo);
  const existente = regs.find(r=>r.fecha===fecha);
  if(existente) return existente.cerrado ? existente : await invSincronizarItems(existente, regs);
  return await invCrearRegistroPara(codigo, user, fecha, regs);
}

/* ===== Traslados automáticos (Zeus) =====
   La tarea programada de las 8am lee los PDF de "Traslados" del día anterior
   y llama a invAplicarTraslado por cada línea que toque una bodega de A&B.
   Bodega DESTINO del traslado → Traslados (+) [entra]. Bodega ORIGEN → Traslados (−)
   [sale]. Coincide con la fórmula: consumo = inicial + (+) − (−) − merma − final.
   Si el código de producto no existe en el catálogo de esa bodega, se agrega
   solo en el registro de ese día, marcado "(item nuevo)" — el catálogo no cambia.
   Escribe directamente aunque el día ya esté cerrado (es un ajuste autorizado
   del sistema, no una edición manual) y si el registro del día no existe
   todavía lo crea, para no perder el movimiento. */
const INV_BODEGAS_CENTRALES = ["BEBIDAS","SUMINISTROS","ALIMENTOS","GENERAL","CENTRAL","PRINCIPAL"];
function invMatchBodegaZeus(nombreZeus){
  if(!nombreZeus) return null;
  const norm = s => s.toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quita tildes
    .replace(/^BODEGA\s+(DE\s+)?/,"").replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
  /* Zeus no siempre nombra la bodega igual que nuestro cat\u00e1logo:
     - orden distinto (PDF dice "BODEGA COCINA CHIRINGUITO", nuestra bodega 07
       se llama "CHIRINGUITO COCINA") \u2192 se compara tambi\u00e9n por CONJUNTO de
       palabras (orden no importa).
     - nombre incompleto (PDF dice "BODEGA ALMEJA PLAYERA", nuestra bodega 06
       se llama "ALMEJA PLAYERA COCINA") \u2192 tambi\u00e9n hace match si el conjunto
       de palabras de un lado es subconjunto del otro, para no depender de que
       alguien cargue un alias exacto por cada bodega. */
  const tokens = s => norm(s).split(" ").filter(Boolean);
  const tokenSet = s => tokens(s).sort().join(" ");
  const isSubset = (a,b) => a.length>0 && a.every(t=>b.includes(t));
  const n = norm(nombreZeus), nt = tokenSet(nombreZeus), ntoks = tokens(nombreZeus);
  /* Bodegas CENTRALES de Zeus (no se controlan en esta app). Antes "BODEGA BEBIDAS"
     se confundía con SUNSET BAR BEBIDAS y "BODEGA DE SUMINISTROS" con SUNSET BAR
     SUMINISTROS (una sola palabra contenida en el nombre), y cada despacho de la
     central a cualquier área se restaba de las bodegas Sunset. Nunca coinciden. */
  if(INV_BODEGAS_CENTRALES.includes(n)) return null;
  // El subconjunto solo vale si el lado más corto tiene 2+ palabras (p.ej. "ALMEJA PLAYERA").
  const subOk = (a,b) => a.length>=2 && isSubset(a,b);
  const bod = (INV_CFG.bodegas||[]).find(b=>{
    if(norm(b.nombre)===n || norm(b.zeusNombre||"")===n) return true;
    if(tokenSet(b.nombre)===nt || (b.zeusNombre && tokenSet(b.zeusNombre)===nt)) return true;
    const btoks = tokens(b.nombre);
    if(subOk(ntoks,btoks) || subOk(btoks,ntoks)) return true;
    if(b.zeusNombre){ const zt=tokens(b.zeusNombre); if(subOk(ntoks,zt)||subOk(zt,ntoks)) return true; }
    return false;
  });
  return bod ? bod.codigo : null;
}
async function invAplicarTraslado({codigoBodega, fecha, codigo, nombre, unidad, cantidad, signo, trasladoN}){
  const bod = invBodega(codigoBodega); if(!bod) return {ok:false, motivo:"bodega A&B no encontrada: "+codigoBodega};
  if(!codigo) return {ok:false, motivo:"traslado sin código de producto (se registra siempre por código, nunca por nombre)"};
  const regs = await invRegistrosDe(codigoBodega);
  let rec = regs.find(r=>r.fecha===fecha);
  let registroNuevo=false;
  if(!rec){
    const base=(bod.productos||[]);
    // Igual que invCrearRegistroPara: el inicial se arrastra del día anterior más reciente.
    const anterior = regs.filter(r=>r.fecha<fecha).sort((a,b)=>a.fecha<b.fecha?1:-1)[0];
    const items=base.map(p=>{ const prev = anterior && invBuscarItem(anterior.items, p);
      return {codigo:p.codigo,nombre:p.nombre,unidad:p.unidad||"",inicial: prev ? Math.round(invFinalVista(prev)*1000)/1000 : 0,tp:0,tn:0,merma:0,final:null}; });
    rec = {id:gid(), bodega:codigoBodega, bodegaNombre:bod.nombre, fecha, responsable:"",
      items, servicios:[], cerrado:false, creadoPor:"Traslados (auto)", creadoEn:nowISO()};
    registroNuevo=true;
  }
  /* Un mismo traslado nunca se suma dos veces: cada línea aplicada queda anotada
     en el registro del día (N° traslado | código | signo | cantidad). Antes, si el
     lote se corría 2 o 3 veces, las cantidades se duplicaban o triplicaban. */
  const aplicados = Array.isArray(rec.trasladosAplicados) ? rec.trasladosAplicados.slice() : [];
  const clave = trasladoN ? [trasladoN, codigo, signo>0?"+":"-", Math.round((+cantidad||0)*1000)/1000].join("|") : null;
  if(clave && aplicados.includes(clave)) return {ok:true, registroNuevo:false, yaAplicado:true};
  if(clave) aplicados.push(clave);
  const items = rec.items.slice();
  let i = items.findIndex(x=>x.codigo===codigo);
  /* Si el producto no está en el catálogo de la bodega, se agrega SOLO en el
     registro de ese día, marcado "(item nuevo)", para no perder el movimiento.
     No se toca el catálogo: el día siguiente no lo arrastra. */
  if(i<0){ items.push({codigo, nombre: (nombre||codigo)+" (item nuevo)", unidad: unidad||"", inicial:0, tp:0, tn:0, merma:0, final:null, nuevo:true, soloDia:true}); i=items.length-1; }
  const it = {...items[i]};
  const cant = Math.round((+cantidad||0)*1000)/1000;
  if(signo>0) it.tp = Math.round(((+it.tp||0)+cant)*1000)/1000;
  else it.tn = Math.round(((+it.tn||0)+cant)*1000)/1000;
  items[i] = it;
  const toSave = {...rec, items, trasladosAplicados: aplicados};
  await Store.writeOne("Inventario", toSave);
  return {ok:true, registroNuevo};
}
/* Aplica un lote de traslados ya extraídos de los PDF de Zeus (uno por línea
   x lado, ya separados en entradas/salidas por invClasificarTraslado más abajo).
   Devuelve un resumen para mandarle a la usuaria (aplicados, nuevos productos,
   fuera de alcance). */
async function invAplicarLoteTraslados(lote){
  const resumen = {aplicados:[], nuevosProductos:[], fueraDeAlcance:[], errores:[]};
  const tocados = new Set();
  for(const t of lote){
    if(!t.codigoBodega){ resumen.fueraDeAlcance.push(t); continue; }
    const bod = invBodega(t.codigoBodega);
    const yaExistia = bod && (bod.productos||[]).some(p=>p.codigo===t.codigo);
    try{
      const r = await invAplicarTraslado(t);
      if(r.ok && r.yaAplicado){ (resumen.yaAplicados=resumen.yaAplicados||[]).push(t); continue; }
      if(r.ok) tocados.add(t.codigoBodega+"|"+t.fecha);
      if(r.ok){
        resumen.aplicados.push({...t, registroNuevo:r.registroNuevo});
        if(!yaExistia) resumen.nuevosProductos.push({bodega:t.codigoBodega, codigo:t.codigo, nombre:t.nombre});
      } else resumen.errores.push({...t, motivo:r.motivo});
    }catch(e){ resumen.errores.push({...t, motivo:e.message||String(e)}); }
  }
  // Un traslado cambia lo disponible de ese día: se pasa al Inicial de los días siguientes abiertos.
  for(const k of tocados){ const [cb,f]=k.split("|");
    try{ const rec=invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.bodega===cb && r.fecha===f))[0];
      if(rec) await invPropagarInicial(cb, rec); }catch(e){} }
  return resumen;
}
/* Recibe las filas crudas ya extraídas de los PDF de Zeus (una por línea de
   traslado; cantidad siempre positiva, con nombres de bodega tal cual salen
   del PDF) y las convierte en líneas con signo para invAplicarLoteTraslados:
   bodega DESTINO → (+), bodega ORIGEN → (−). Las bodegas centrales que no se
   controlan en esta app (Bodega de Alimentos, Bodega Bebidas, etc.) no
   coinciden con ninguna de las 8 bodegas configuradas → simplemente no se
   genera esa línea (no es un error). Si NINGÚN lado coincide, la fila entera
   se reporta como fuera de alcance para que la tarea programada la muestre
   en su resumen (nunca se adivina una bodega ambigua). */
function invClasificarTraslado(row){
  const codDestino = invMatchBodegaZeus(row.bodegaDestino);
  const codOrigen = invMatchBodegaZeus(row.bodegaOrigen);
  const lineas = [];
  if(codDestino) lineas.push({codigoBodega:codDestino, fecha:row.fecha, codigo:row.codigo, nombre:row.nombre,
    unidad:row.unidad, cantidad:row.cantidad, signo:1, trasladoN:row.trasladoN, origen:row.bodegaOrigen, destino:row.bodegaDestino});
  if(codOrigen) lineas.push({codigoBodega:codOrigen, fecha:row.fecha, codigo:row.codigo, nombre:row.nombre,
    unidad:row.unidad, cantidad:row.cantidad, signo:-1, trasladoN:row.trasladoN, origen:row.bodegaOrigen, destino:row.bodegaDestino});
  return {lineas, fueraDeAlcance: !codDestino && !codOrigen};
}
async function invAplicarLoteZeus(rows){
  const lote = [], sinMatch = [];
  for(const row of rows){
    if(!row.codigo){ sinMatch.push({...row, motivo:"sin código de producto (se ignora — nunca se registra por nombre)"}); continue; }
    const {lineas, fueraDeAlcance} = invClasificarTraslado(row);
    if(fueraDeAlcance){ sinMatch.push({...row, motivo:`ninguna bodega A&B coincide (origen: "${row.bodegaOrigen}", destino: "${row.bodegaDestino}")`}); continue; }
    lote.push(...lineas);
  }
  const resumen = await invAplicarLoteTraslados(lote);
  resumen.sinMatch = sinMatch;
  return resumen;
}

/* ===== Pantalla: Cierre del día =====
   modo "completo": vista de siempre (Gerencia/Desarrollador) — todas las
     columnas editables + panel de PAX, para supervisión/pruebas.
   modo "cocina": vista de cocina/bar — sólo Inventario inicial (fijo) e
     Inventario final (lo único que llenan), ordenado con lo que tiene
     inventario arriba y lo que está en cero abajo. Sin merma, sin traslados
     (eso ya lo llena solo la tarea de las 8am), sin panel de PAX (eso es de
     servicio). */
function InventarioCierre({user,toast,modo}){
  const completo = modo!=="cocina";
  /* Antonio Puga (u otro colaborador con merma:true, sin ser Gerencia/
     Desarrollador) entra en modo "completo" solo para poder ver y llenar
     Merma; Traslados los deja de solo lectura porque ya los llena la
     automatización de Zeus. */
  const soloMerma = completo && !esGD(user);
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [rec,setRec]=useState(null);
  const [cargando,setCargando]=useState(true);
  const [q,setQ]=useState("");
  const [guardando,setGuardando]=useState(false);
  const [servNombre,setServNombre]=useState("Almuerzo");
  const [servAd,setServAd]=useState(""); const [servNi,setServNi]=useState("");
  // Elección, antes de las 10am, entre registrar hoy o el día de ayer (que
  // todavía no se abrió). Ver invPuedeElegirAyer/invAbrirHoy.
  const [fechaElegida,setFechaElegida]=useState("hoy");
  const [opcionAyer,setOpcionAyer]=useState(null); // null=todavía no se sabe, ""=no aplica, "YYYY-MM-DD"=fecha de ayer disponible
  /* Sólo el Jefe de Operaciones (hoy Antonio Puga, esJefeOperaciones) y el
     Desarrollador pueden ingresar el inventario de CUALQUIER día anterior,
     no solo ayer — ver invAbrirFecha. fechaLibre vacío = se sigue usando
     hoy/ayer normalmente. El Desarrollador la necesita para pruebas y
     soporte (ej. reconstruir un cierre puntual); el resto de roles sigue
     limitado a hoy/ayer como siempre. */
  const puedeFechaLibre = esJefeOperaciones(user) || esDev(user);
  /* Esos mismos roles pueden además escribir el "Inicial" (p.ej. para cargar
     el inventario inicial al arrancar de cero) y reabrir un día ya cerrado
     para corregirlo. El resto de usuarios sigue igual que siempre. */
  const puedeEditarTodo = puedeFechaLibre;
  /* Solo el Desarrollador modifica directamente. Si quien corrige es el Jefe
     de Operaciones (Antonio), el cambio se guarda pero queda una nota visible
     en el día ("Ajustado por …", con el detalle de lo que cambió). */
  const dejaNotaAjuste = puedeEditarTodo && !esDev(user);
  const [fechaLibre,setFechaLibre]=useState("");
  const [editando,setEditando]=useState(false);
  const originalRec = useRef(null);
  /* Lo que otros guardan se ve aquí sin tener que salir y entrar: al volver a
     la pestaña, y cada minuto, se recarga el día abierto — solo si esta persona
     no tiene cambios sin guardar (para no borrarle lo que está escribiendo). */
  const recRef = useRef(null); recRef.current = rec;
  const guardandoRef = useRef(false); guardandoRef.current = guardando;
  useEffect(()=>{
    async function recargar(){
      const r = recRef.current; if(!r || guardandoRef.current || document.hidden) return;
      if(!invIgual(r, originalRec.current)) return;
      try{ const f = invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(x=>x.bodega===r.bodega && x.fecha===r.fecha))[0];
        if(f && !invIgual(f, recRef.current) && invIgual(recRef.current, originalRec.current)){
          setRec(JSON.parse(JSON.stringify(f))); originalRec.current = JSON.parse(JSON.stringify(f)); }
      }catch(e){}
    }
    const t = setInterval(recargar, 60000);
    const onVis = ()=>{ if(!document.hidden) recargar(); };
    document.addEventListener("visibilitychange", onVis);
    return ()=>{ clearInterval(t); document.removeEventListener("visibilitychange", onVis); };
  },[]);
  useEffect(()=>{ setEditando(false); originalRec.current = rec ? JSON.parse(JSON.stringify(rec)) : null; },[rec && rec.id]);
  useEffect(()=>{ if(!codigo){ setCargando(false); return; }
    setCargando(true); setFechaElegida("hoy"); setFechaLibre("");
    invRegistrosDe(codigo).then(regs=>{
      setOpcionAyer(invPuedeElegirAyer(regs) ? sumaDiasYMD(hoyISO(),-1) : "");
      return invAbrirHoy(codigo,user);
    }).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario de hoy: "+(e.message||e)); setCargando(false); });
  },[codigo]);
  // Cuando el usuario cambia explícitamente la elección hoy/ayer, se
  // recarga el registro correspondiente (no en la primera carga: esa ya la
  // hace el efecto de arriba con fechaElegida="hoy" por defecto).
  const primeraCargaCierre = useRef(true);
  useEffect(()=>{ if(primeraCargaCierre.current){ primeraCargaCierre.current=false; return; }
    if(!codigo || fechaLibre) return;
    setCargando(true);
    invAbrirHoy(codigo,user,fechaElegida).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario: "+(e.message||e)); setCargando(false); });
  },[fechaElegida]);
  // Selector de "cualquier día anterior" (solo Jefe de Operaciones). Elegir
  // una fecha carga (o crea) ese registro puntual; volver a vaciar el campo
  // regresa a hoy/ayer con invAbrirHoy normalmente.
  const primeraCargaFechaLibre = useRef(true);
  useEffect(()=>{ if(primeraCargaFechaLibre.current){ primeraCargaFechaLibre.current=false; return; }
    if(!codigo || !puedeFechaLibre) return;
    setCargando(true);
    const abrir = fechaLibre ? invAbrirFecha(codigo,user,fechaLibre) : invAbrirHoy(codigo,user,fechaElegida);
    abrir.then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario de esa fecha: "+(e.message||e)); setCargando(false); });
  },[fechaLibre]);
  if(!bodegas.length) return <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
    Todavía no tienes bodegas asignadas para el inventario.<br/>Pide al Desarrollador que te las asigne en Inventario · Configurar.</div>;
  if(cargando) return <div className="empty">Cargando…</div>;
  if(!rec) return null;
  const bodegaObj = invBodega(codigo);
  const esBar = invEsBebidas(bodegaObj);
  const editable = !rec.cerrado || editando;
  const editaInicial = completo && puedeEditarTodo && editable;
  function setItem(i,patch){ setRec(r=>{ const items=r.items.slice(); items[i]={...items[i],...patch}; return {...r,items}; }); }
  function agregarServicio(){ const ad=+servAd||0, ni=esBar?0:(+servNi||0);
    if(!ad&&!ni){ toast(esBar?"Ingresa la cantidad de adultos.":"Ingresa al menos adultos o niños."); return; }
    setRec(r=>({...r, servicios:[...(r.servicios||[]), {id:gid(), nombre:invServicioValido(bodegaObj,servNombre), adultos:ad, ninos:ni, registradoPor:user.nombre, registradoEn:nowISO()}]}));
    setServAd(""); setServNi(""); }
  function quitarServicio(id){ setRec(r=>({...r, servicios:(r.servicios||[]).filter(s=>s.id!==id)})); }
  const pax = invTotalPax(rec);
  const filtrados = rec.items.map((it,i)=>({it,i})).filter(({it})=> !q.trim() ||
    (it.nombre+" "+it.codigo).toLowerCase().indexOf(q.trim().toLowerCase())>-1);
  /* Mismo listado y MISMO ORDEN para todos (cocina/bar, Antonio, Gerencia):
     el orden de la lista de la bodega en Configurar. Antes la vista de cocina
     subía arriba lo que tenía inicial y por eso cada uno veía otro orden. */
  const listados = invOrdenCatalogo(rec.bodega, filtrados, x=>x.it);
  async function guardar(cerrar){
    const faltantes = rec.items.filter(it=>it.final===null||it.final==="").length;
    if(cerrar && faltantes>0){ if(!window.confirm(`${faltantes} producto(s) sin "Cantidad final". Se guardará como cantidad final lo disponible (inicial + traslados − merma), es decir, consumo 0. ¿Cerrar de todas formas?`)) return; }
    setGuardando(true);
    try{
      // El responsable del conteo es quien está registrando ahora mismo — no
      // se pide como campo aparte, se toma directo de la sesión.
      /* Al cerrar por primera vez, el día queda "pendiente de aprobación" del
         Jefe de Operaciones (Antonio) — Gerencia General no lo ve todavía en
         el Resumen hasta que él le dé OK o lo ajuste (ver InventarioAprobacion
         y el filtro por r.aprobado en InventarioResumen/Desviaciones). */
      const esPasado = rec.fecha < hoyISO();
      const recBase = cerrar ? {...rec, items: rec.items.map(it=> invFinalVacio(it) ? {...it, final: Math.round(invDisponible(it)*1000)/1000} : it)} : rec;
      /* Responsable del conteo = quien llenó el inventario (cocina/bar). Si
         después guarda el Desarrollador o el Jefe de Operaciones, NO se le
         reemplaza el nombre: eso queda como ajuste/edición aparte. */
      const supervisa = esDev(user) || esJefeOperaciones(user);
      const responsable = (!rec.responsable || !supervisa) ? user.nombre : rec.responsable;
      let toSave = {...recBase, responsable, cerrado: cerrar?true:rec.cerrado, cerradoPor: cerrar?user.nombre:rec.cerradoPor, cerradoEn: cerrar?nowISO():rec.cerradoEn,
        aprobado: cerrar?false:rec.aprobado};
      if(editando){ toSave = {...toSave, editadoPor:user.nombre, editadoEn:nowISO()}; }
      if(dejaNotaAjuste && (editando || esPasado)){
        const detalle = invDetalleCambios(originalRec.current, toSave).filter(d=>!/: Merma /.test(d));
        if(detalle.length) toSave = {...toSave, ajustes:[...(rec.ajustes||[]), {por:user.nombre, en:nowISO(), detalle}]};
      }
      /* Carga/corrección retroactiva (Desarrollador o Jefe de Operaciones en un
         día anterior): no se le aplica el plazo de las 10am y, como quien lo
         ingresa es quien aprueba, queda aprobado directamente al cerrarlo. */
      if(puedeEditarTodo && esPasado){
        toSave = {...toSave, ingresoRetroactivo:true, notaLimite:undefined, bloqueadoPorLimite:false};
        if(cerrar) toSave = {...toSave, aprobado:true, aprobadoPor:user.nombre, aprobadoEn:nowISO()};
      }
      if(cerrar){
        // Al cerrar: se detectan desviaciones contra el historial real de la
        // bodega y, si hay alguna, se guardan en el propio registro (para que
        // Historial las muestre después) y se avisa a Gerencia General por
        // correo (si está configurado y activo en Inventario · Configurar).
        const historial = (await invRegistrosDe(codigo)).filter(r=>r.cerrado && r.id!==toSave.id);
        const desv = invDetectarDesviaciones(toSave, historial, INV_CFG.alertas);
        toSave = {...toSave, desviaciones: desv};
        // Días anteriores cargados a mano: se guardan las desviaciones, pero no se manda correo.
        // Ya no se envía aviso inmediato a Gerencia General: los consumos negativos van en el correo de las 10:30.
      }
      toSave = {...toSave, servicios: invNormServicios(bodegaObj, toSave.servicios)};
      toSave = await invGuardarFusionado(originalRec.current, toSave);
      /* Cadena: el Inicial de los días siguientes abiertos se recalcula solo.
         Si el siguiente día ya está cerrado, solo el Desarrollador/Jefe de
         Operaciones puede decidir actualizarlo (y queda anotado). */
      let prop = await invPropagarInicial(codigo, toSave);
      if(prop.cerradoAfectado && puedeEditarTodo &&
         window.confirm(`El ${prop.cerradoAfectado} ya está cerrado. ¿Actualizar también su "Inicial" con las cantidades finales de este día?`)){
        await invPropagarInicial(codigo, toSave, {incluirCerrados:true, quien:user.nombre});
        const cerr = invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.bodega===codigo && r.fecha===prop.cerradoAfectado))[0];
        if(cerr) await invPropagarInicial(codigo, cerr);
      }
      setRec(toSave); setEditando(false); originalRec.current = JSON.parse(JSON.stringify(toSave));
      toast(cerrar?"Inventario del día cerrado.":(editando?"Cambios guardados.":"Guardado."));
    }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    setGuardando(false);
  }
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    {opcionAyer && <div className="banner" style={{background:"#fff3d6",borderColor:"#e8d9ae",color:"#8a6512",marginBottom:12,flexDirection:"column",alignItems:"stretch",gap:6}}>
      <div><Icon name="alert" size={15}/> El inventario de <b>{opcionAyer}</b> (ayer) nunca se abrió. Hasta las <b>10:00am de hoy</b> puedes elegir registrarlo en vez del de hoy.</div>
      <div style={{display:"flex",gap:8}}>
        <button className={"btn"+(fechaElegida==="hoy"?" primary":" ghost")} onClick={()=>setFechaElegida("hoy")}>Hoy ({hoyISO()})</button>
        <button className={"btn"+(fechaElegida==="ayer"?" primary":" ghost")} onClick={()=>setFechaElegida("ayer")}>Ayer ({opcionAyer})</button>
      </div>
    </div>}
    {puedeFechaLibre && <div className="banner" style={{background:"#eef4f1",borderColor:"#cfe3da",color:"#2f5d4c",marginBottom:12,flexDirection:"column",alignItems:"stretch",gap:6}}>
      <div><Icon name="calendar" size={15}/> {esDev(user) ? "Como Desarrollador puedes" : "Como Jefe de Operaciones puedes"} ingresar o corregir el inventario de cualquier día anterior, incluido el Inicial.</div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <input className="inp" type="date" style={{width:170}} max={hoyISO()} value={fechaLibre} onChange={e=>setFechaLibre(e.target.value)}/>
        {fechaLibre && <button className="btn ghost" onClick={()=>setFechaLibre("")}>Cancelar</button>}
      </div>
    </div>}
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div><b>{rec.bodegaNombre}</b><div className="meta">{fmtDT(rec.fecha+"T00:00:00")==="—"?rec.fecha:rec.fecha}</div></div>
        {rec.cerrado
          ? <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}><Icon name="lock" size={13} style={{marginRight:4}}/>Cerrado por {rec.cerradoPor}</span>
          : <span className="pill" style={{background:"#fff3d6",color:"#8a6512"}}>Sin cerrar</span>}
        {rec.cerrado && rec.aprobado===false &&
          <span className="pill" style={{background:"#fff3d6",color:"#8a6512"}}><Icon name="clock" size={13} style={{marginRight:4}}/>Pendiente de aprobación</span>}
        {rec.cerrado && rec.aprobado===true &&
          <span className="pill" style={{background:"#e6f2f3",color:"var(--ocean-d)"}}>Aprobado por {rec.aprobadoPor}</span>}
      </div>
    </div>
    {!rec.cerrado && rec.fecha!==hoyISO() && !puedeEditarTodo
      && <div className="banner" style={{background:"#fdeceb",borderColor:"#e8b4ae",color:"#9a3324",marginBottom:12}}>
        <Icon name="alert" size={15}/> Este es el inventario de <b>{rec.fecha}</b>, que quedó sin cerrar. Tienes hasta las <b>10:00am de hoy</b> para terminarlo y cerrarlo — pasada esa hora quedará registrado tal cual está y ya no se podrá editar.</div>}
    {puedeEditarTodo && rec.cerrado && !editando &&
      <div style={{marginBottom:12}}><button className="btn ghost" onClick={()=>setEditando(true)}>
        <Icon name="edit" size={15} style={{marginRight:6}}/>Editar este día (ya cerrado)</button></div>}
    {editando && <div className="banner" style={{background:"#eef4f1",borderColor:"#cfe3da",color:"#2f5d4c",marginBottom:12}}>
      <Icon name="edit" size={15}/> Estás corrigiendo un día ya cerrado. Sigue cerrado; al guardar quedará registrado quién lo editó.</div>}
    {rec.cerrado && !editando && rec.aprobado===false
      && <div className="hint" style={{marginBottom:12}}>Ya cerraste el inventario de hoy de esta bodega — queda pendiente de aprobación del Jefe de Operaciones antes de que Gerencia General lo vea. El de mañana se abrirá solo, llevando estas cantidades finales como inicial.</div>}
    {rec.cerrado && !editando && rec.aprobado!==false
      && <div className="hint" style={{marginBottom:12}}>Ya cerraste el inventario de hoy de esta bodega. Puedes verlo en la pestaña Historial. El de mañana se abrirá solo, llevando estas cantidades finales como inicial.</div>}
    {invDesviacionesDe(rec).length>0 &&
      <div className="banner" style={{background:INV_COLOR_NEG.bg,borderColor:"#f1a9a4",color:INV_COLOR_NEG.fg,flexDirection:"column",alignItems:"stretch",gap:6}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}><Icon name="alert" size={15}/><b>{invDesviacionesDe(rec).length} producto(s) con consumo negativo — revisar el conteo o los traslados (marcados en rojo abajo).</b></div>
        {invDesviacionesDe(rec).map(d=><div key={d.codigo+"|"+d.nombre} style={{fontSize:12.5,paddingLeft:21}}><b>{d.nombre}</b> (#{d.codigo}): {d.detalle}</div>)}
      </div>}
    {completo && <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
      <div style={{fontWeight:700,fontSize:13.5,marginBottom:2}}>PAX por servicio</div>
      <div className="hint" style={{marginBottom:10}}>{esBar?"Adultos atendidos hoy en esta bodega.":"Adultos y niños atendidos hoy en esta bodega."} Se usa para calcular el consumo promedio por persona.</div>
      {(rec.servicios||[]).length===0 && <div className="hint" style={{marginBottom:8}}>Aún no se ha registrado ningún servicio hoy.</div>}
      {(rec.servicios||[]).map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,background:"#f3efe6",borderRadius:10,padding:"7px 10px",marginBottom:6,fontSize:13}}>
        <div style={{fontWeight:700,flex:"1 1 auto"}}>{invNombreServicio(bodegaObj, s.nombre)}</div>
        <div>{s.adultos} adultos</div>{!esBar && <div>{s.ninos} niños</div>}
        {editable && <button className="btn ghost" style={{padding:"3px 8px",fontSize:12}} onClick={()=>quitarServicio(s.id)}>✕</button>}
      </div>)}
      {editable && <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
        <select className="inp" style={{width:150}} value={servNombre} onChange={e=>setServNombre(e.target.value)}>
          {invServiciosDisponibles(bodegaObj).map(s=><option key={s} value={s}>{s}</option>)}</select>
        <input className="inp" type="number" min="0" placeholder="Adultos" style={{width:90}} value={servAd} onChange={e=>setServAd(e.target.value)}/>
        {!esBar && <input className="inp" type="number" min="0" placeholder="Niños" style={{width:90}} value={servNi} onChange={e=>setServNi(e.target.value)}/>}
        <button className="btn ghost" onClick={agregarServicio}>Agregar</button>
      </div>}
      <div className="hint" style={{marginTop:10}}>Total PAX hoy: <b style={{color:"var(--ink)"}}>{pax}</b></div>
    </div>}
    <div style={{maxWidth:340,marginBottom:10}}><input type="text" className="inp" placeholder="Buscar producto o código…"
      value={q} onChange={e=>setQ(e.target.value)}/></div>
    <div style={{display:"flex",alignItems:"center",fontSize:11.5,fontWeight:700,color:"var(--muted)",padding:"0 10px",gap:6,marginBottom:4}}>
      <div style={{flex:"1 1 auto",minWidth:0}}>Producto</div>
      <div style={{width:56,textAlign:"right"}}>Inicial</div>
      {completo && <>
        <div style={{width:56,textAlign:"right"}}>Trasl.+</div>
        <div style={{width:56,textAlign:"right"}}>Trasl.−</div>
        <div style={{width:56,textAlign:"right"}}>Merma</div>
      </>}
      <div style={{width:64,textAlign:"right"}}>Cant. final</div>
      {completo && <>
        <div style={{width:64,textAlign:"right"}}>Consumo</div>
        <div style={{width:60,textAlign:"right"}}>Promedio</div>
      </>}
    </div>
    {listados.map(({it,i})=>{ const cons=invConsumoVista(it); const prom=invComputePromedio(cons,pax);
      const neg = cons < -0.001;
      return <div key={it.codigo+"|"+it.nombre} className="item" style={{display:"flex",alignItems:"center",padding:"9px 10px",gap:6,...(neg?{background:INV_COLOR_NEG.bg,borderColor:"#f1a9a4"}:{})}}>
        <div style={{flex:"1 1 auto",minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.nombre}<InvUnidad it={it} bodega={rec.bodega}/>{it.nuevo && <span className="pill" style={{marginLeft:6,background:"#fbe6e6",color:"#a83232",fontSize:10.5,padding:"1px 6px"}}>NUEVO</span>}</div>
          <div className="meta">#{it.codigo}</div>
        </div>
        {editaInicial
          ? <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
              value={it.inicial||""} onChange={e=>setItem(i,{inicial:e.target.value===""?0:+e.target.value})}/>
          : <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.inicial)}</div>}
        {completo && (!editable ? <>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.tp)}</div>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.tn)}</div>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.merma)}</div>
        </> : <>
          {soloMerma
            ? <div style={{width:56,textAlign:"right",fontSize:13}} title="Los traslados los llena automáticamente Zeus.">{invFmt(it.tp)}</div>
            : <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
                value={it.tp||""} onChange={e=>setItem(i,{tp:e.target.value===""?0:+e.target.value})}/>}
          {soloMerma
            ? <div style={{width:56,textAlign:"right",fontSize:13}} title="Los traslados los llena automáticamente Zeus.">{invFmt(it.tn)}</div>
            : <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
                value={it.tn||""} onChange={e=>setItem(i,{tn:e.target.value===""?0:+e.target.value})}/>}
          <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
            value={it.merma||""} onChange={e=>setItem(i,{merma:e.target.value===""?0:+e.target.value})}/>
        </>)}
        {!editable ? <div style={{width:64,textAlign:"right",fontSize:13,fontWeight:700}}>{invFmt(invFinalVista(it))}</div>
          : <input className="inp" type="number" inputMode="decimal" style={{width:64,textAlign:"right",padding:"5px 6px",fontWeight:700}}
              placeholder={invFmt(invDisponible(it))}
              value={it.final===null?"":it.final} onChange={e=>setItem(i,{final:e.target.value===""?null:+e.target.value})}/>}
        {completo && <>
          <div style={{width:64,textAlign:"right",fontSize:13,fontWeight:700,color:neg?INV_COLOR_NEG.fg:"var(--ocean-d)"}}>{invFmt(cons)}</div>
          <div style={{width:60,textAlign:"right",fontSize:12.5,color:"var(--muted)"}}>{prom===null?"—":invFmt(prom)}</div>
        </>}
      </div>; })}
    {!listados.length && <div className="empty">Ningún producto coincide con la búsqueda.</div>}
    {!rec.cerrado && <div className="row" style={{marginTop:14,gap:10}}>
      <button className="btn ghost block" disabled={guardando} onClick={()=>guardar(false)}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar avance</button>
      <button className="btn primary block" disabled={guardando} onClick={()=>guardar(true)}><Icon name="lock" size={15} style={{marginRight:6}}/>Cerrar inventario del día</button>
    </div>}
    {rec.cerrado && editando && <div className="row" style={{marginTop:14,gap:10}}>
      <button className="btn ghost block" disabled={guardando} onClick={()=>{ if(originalRec.current) setRec(JSON.parse(JSON.stringify(originalRec.current))); setEditando(false); }}>Cancelar</button>
      <button className="btn primary block" disabled={guardando} onClick={()=>guardar(false)}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar cambios</button>
    </div>}
  </div>;
}

/* ===== Pantalla: Servicio (PAX por comida) =====
   Para meseros/personal de servicio: sólo registran cuántos adultos y niños
   atendieron por Desayuno/Almuerzo/Cena — nunca ven ni tocan el conteo de
   inventario. No depende de si cocina ya cerró el día: el PAX se puede
   seguir registrando aunque el inventario de esa bodega ya esté cerrado. */
function InventarioServicio({user,toast}){
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasServicioDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [rec,setRec]=useState(null);
  const [cargando,setCargando]=useState(true);
  const [guardando,setGuardando]=useState(false);
  const bodegaObj = invBodega(codigo);
  const esBar = invEsBebidas(bodegaObj);
  const opciones = invServiciosDisponibles(bodegaObj);
  const [servNombre,setServNombre]=useState(opciones[0]);
  const [servAd,setServAd]=useState(""); const [servNi,setServNi]=useState("");
  // Elección, antes de las 10am, entre registrar hoy o el día de ayer (que
  // todavía no se abrió). Ver invPuedeElegirAyer/invAbrirHoy.
  const [fechaElegida,setFechaElegida]=useState("hoy");
  const [opcionAyer,setOpcionAyer]=useState(null);
  useEffect(()=>{ if(!codigo){ setCargando(false); return; }
    setCargando(true); setFechaElegida("hoy");
    invRegistrosDe(codigo).then(regs=>{
      setOpcionAyer(invPuedeElegirAyer(regs) ? sumaDiasYMD(hoyISO(),-1) : "");
      return invAbrirHoy(codigo,user);
    }).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario de hoy: "+(e.message||e)); setCargando(false); });
  },[codigo]);
  useEffect(()=>{ setServNombre(opciones[0]); },[codigo]);
  const primeraCargaServicio = useRef(true);
  useEffect(()=>{ if(primeraCargaServicio.current){ primeraCargaServicio.current=false; return; }
    if(!codigo) return;
    setCargando(true);
    invAbrirHoy(codigo,user,fechaElegida).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario: "+(e.message||e)); setCargando(false); });
  },[fechaElegida]);
  if(!bodegas.length) return <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
    Todavía no tienes bodegas asignadas para registrar PAX.<br/>Pide al Desarrollador que te las asigne en Inventario · Configurar.</div>;
  if(cargando) return <div className="empty">Cargando…</div>;
  if(!rec) return null;
  async function guardarServicios(servicios){
    setGuardando(true);
    try{
      let toSave = {...rec, servicios: invNormServicios(bodegaObj, servicios)};
      toSave = await invGuardarFusionado(rec, toSave);
      setRec(toSave);
      toast("PAX guardado.");
    }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    setGuardando(false);
  }
  function agregarServicio(){ const ad=+servAd||0, ni=esBar?0:(+servNi||0);
    if(!ad&&!ni){ toast(esBar?"Ingresa la cantidad de adultos.":"Ingresa al menos adultos o niños."); return; }
    guardarServicios([...(rec.servicios||[]), {id:gid(), nombre:invServicioValido(bodegaObj,servNombre), adultos:ad, ninos:ni, registradoPor:user.nombre, registradoEn:nowISO()}]);
    setServAd(""); setServNi(""); }
  function quitarServicio(id){ guardarServicios((rec.servicios||[]).filter(s=>s.id!==id)); }
  const pax = invTotalPax(rec);
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    {opcionAyer && <div className="banner" style={{background:"#fff3d6",borderColor:"#e8d9ae",color:"#8a6512",marginBottom:12,flexDirection:"column",alignItems:"stretch",gap:6}}>
      <div><Icon name="alert" size={15}/> El PAX de <b>{opcionAyer}</b> (ayer) nunca se abrió. Hasta las <b>10:00am de hoy</b> puedes elegir registrarlo en vez del de hoy.</div>
      <div style={{display:"flex",gap:8}}>
        <button className={"btn"+(fechaElegida==="hoy"?" primary":" ghost")} onClick={()=>setFechaElegida("hoy")}>Hoy ({hoyISO()})</button>
        <button className={"btn"+(fechaElegida==="ayer"?" primary":" ghost")} onClick={()=>setFechaElegida("ayer")}>Ayer ({opcionAyer})</button>
      </div>
    </div>}
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div><b>{rec.bodegaNombre}</b><div className="meta">{rec.fecha}</div></div>
        {rec.cerrado && <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}><Icon name="lock" size={13} style={{marginRight:4}}/>Inventario cerrado</span>}
      </div>
    </div>
    {!rec.cerrado && rec.fecha!==hoyISO()
      && <div className="banner" style={{background:"#fdeceb",borderColor:"#e8b4ae",color:"#9a3324",marginBottom:12}}>
        <Icon name="alert" size={15}/> Esto es PAX del <b>{rec.fecha}</b>, que quedó sin cerrar. Hay hasta las <b>10:00am de hoy</b> para registrarlo — pasada esa hora ya no se podrá editar.</div>}
    <div className="card" style={{padding:"12px 14px"}}>
      <div style={{fontWeight:700,fontSize:13.5,marginBottom:2}}>PAX por servicio</div>
      <div className="hint" style={{marginBottom:10}}>{esBar?"Adultos atendidos hoy en esta bodega":"Adultos y niños atendidos hoy en esta bodega"}{invSoloAlmuerzoCena(bodegaObj)?" (Almuerzo y Cena)":" (Desayuno, Almuerzo y Cena)"}.</div>
      {(rec.servicios||[]).length===0 && <div className="hint" style={{marginBottom:8}}>Aún no se ha registrado ningún servicio hoy.</div>}
      {(rec.servicios||[]).map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,background:"#f3efe6",borderRadius:10,padding:"7px 10px",marginBottom:6,fontSize:13}}>
        <div style={{fontWeight:700,flex:"1 1 auto"}}>{invNombreServicio(bodegaObj, s.nombre)}</div>
        <div>{s.adultos} adultos</div>{!esBar && <div>{s.ninos} niños</div>}
        <button className="btn ghost" disabled={guardando} style={{padding:"3px 8px",fontSize:12}} onClick={()=>quitarServicio(s.id)}>✕</button>
      </div>)}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
        <select className="inp" style={{width:150}} value={servNombre} onChange={e=>setServNombre(e.target.value)}>
          {opciones.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <input className="inp" type="number" min="0" placeholder="Adultos" style={{width:90}} value={servAd} onChange={e=>setServAd(e.target.value)}/>
        {!esBar && <input className="inp" type="number" min="0" placeholder="Niños" style={{width:90}} value={servNi} onChange={e=>setServNi(e.target.value)}/>}
        <button className="btn primary" disabled={guardando} onClick={agregarServicio}>Agregar</button>
      </div>
      <div className="hint" style={{marginTop:10}}>Total PAX hoy: <b style={{color:"var(--ink)"}}>{pax}</b></div>
    </div>
  </div>;
}

/* ===== Pantalla: Historial ===== */
function InventarioHistorial({user,toast}){
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [regs,setRegs]=useState([]);
  const [ver,setVer]=useState(null);
  const [cargando,setCargando]=useState(true);
  function recargar(){ if(!codigo){ setCargando(false); return; } setCargando(true);
    invRegistrosDe(codigo).then(r=>{ setRegs(r.filter(x=>x.cerrado || x.bloqueadoPorLimite)); setCargando(false); }).catch(()=>setCargando(false)); }
  useEffect(recargar,[codigo]);
  if(!bodegas.length) return <div className="empty">No tienes bodegas asignadas.</div>;
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    {cargando && <div className="empty">Cargando…</div>}
    {!cargando && !regs.length && <div className="empty"><div className="e"><Icon name="calendar" size={44}/></div>Aún no hay días cerrados para esta bodega.</div>}
    {regs.map(r=><div key={r.id} className="item" style={{cursor:"pointer"}} onClick={()=>setVer(r)}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8}}><b>{r.fecha}</b>
        <div style={{display:"flex",gap:6}}>
          {invDesviacionesDe(r).length>0 &&
            <span className="pill" style={{background:INV_COLOR_NEG.bg,color:INV_COLOR_NEG.fg}}><Icon name="alert" size={12} style={{marginRight:3}}/>{invDesviacionesDe(r).length} consumo(s) negativo(s)</span>}
          {r.cerrado
            ? <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}>Cerrado</span>
            : <span className="pill" style={{background:"#fdeceb",color:"#9a3324"}}><Icon name="alert" size={12} style={{marginRight:3}}/>Vencido sin cerrar</span>}
        </div>
      </div>
      <div className="meta">Responsable: {r.responsable||"—"} · {r.cerrado?`cerrado por ${r.cerradoPor} · ${fmtDT(r.cerradoEn)}`:"nunca se cerró"}{r.aprobado===true?` · aprobado por ${r.aprobadoPor}`:(r.cerrado?" · pendiente de aprobación":"")}{(r.ajustes||[]).length?` · ajustado por ${[...new Set(r.ajustes.map(a=>a.por))].join(", ")}`:""}</div>
      {r.notaLimite && <div className="meta" style={{color:"#9a3324"}}>{r.notaLimite}</div>}
    </div>)}
    {ver && <Modal title={`${ver.bodegaNombre} · ${ver.fecha}`} onClose={()=>setVer(null)} wide>
      <InventarioDetalle r={ver} user={user} toast={toast} onEliminado={()=>{setVer(null);recargar();}}/></Modal>}
  </div>;
}
/* Detalle de un día cerrado. Para Gerencia/Desarrollador/Aprobador (jefaturas
   con acceso de supervisión — "completo") muestra el reporte estructurado
   completo: traslados, merma, consumo y promedio por producto, PAX por
   servicio, filtro "solo con movimiento" (traslados/merma/consumo ≠ 0 ese
   día) e impresión/PDF vía el diálogo de impresión del navegador. Para
   colaboradores de cocina (viendo su propio historial) se mantiene la vista
   simple de siempre: sólo producto y cantidad final, sin cifras de consumo,
   igual que en la pantalla de cierre del día. */
function InventarioDetalle({r,user,toast,onEliminado}){
  const [q,setQ]=useState("");
  const [soloMov,setSoloMov]=useState(false);
  const [borrando,setBorrando]=useState(false);
  /* Eliminar un registro es un borrado permanente en SharePoint — sólo
     Gerencia/Desarrollador lo pueden hacer, y sólo desde aquí (el detalle
     de un día concreto), nunca en lote. Pide confirmación explícita con el
     mismo patrón (window.confirm) que ya se usa para borrar una bodega en
     Configurar. */
  async function eliminar(){
    if(!window.confirm(`¿Eliminar definitivamente el registro de ${r.bodegaNombre||r.bodega} del ${r.fecha}? Esta acción no se puede deshacer.`)) return;
    setBorrando(true);
    try{ await Store.remove("Inventario", r.id);
      toast&&toast("Registro eliminado.");
      onEliminado&&onEliminado(r);
    }catch(e){ toast&&toast("No se pudo eliminar: "+(e.message||e)); }
    finally{ setBorrando(false); }
  }
  /* Cualquiera que pueda abrir el Resumen Gerencial —sea porque está en
     accesosReporte (jefatura puntual, ej. Antonio Puga) o porque se le dio
     el permiso "resumen" desde Configurar → "Qué puede ver cada uno"— ve
     exactamente el mismo detalle completo: traslados, merma, consumo,
     promedio, PAX, el filtro "solo con movimiento" y la exportación a PDF.
     Antes dependían de mecanismos distintos y algunos veían una versión
     recortada; ahora es una sola forma de visualización para todos.
     El Jefe de Operaciones (esMerma/esJefeOperaciones — hoy Antonio Puga) ya
     ve todas las bodegas y aprueba/ajusta cada cierre, así que también ve
     siempre el detalle completo aquí, sin depender de que quede marcado en
     Configurar → accesosReporte. */
  const completo = esGD(user) || esMerma(user) || esReportero(user) || tienePermiso(user,'resumen');
  const esBar = invEsBebidas(invBodega(r.bodega));
  const pax = invTotalPax(r);
  const tieneMovimiento = it=>{ if((+it.tp||0)!==0||(+it.tn||0)!==0||(+it.merma||0)!==0) return true;
    const c=invComputeConsumo(it); return c!==null && c!==0; };
  const base=(r.items||[]).filter(it=>!q.trim()||(it.nombre+" "+it.codigo).toLowerCase().indexOf(q.trim().toLowerCase())>-1);
  const items = invOrdenCatalogo(r.bodega, (completo && soloMov) ? base.filter(tieneMovimiento) : base);
  return <div className="inv-print">
    {completo && <div className="inv-noprint" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      <button className={"btn ghost"+(soloMov?" on":"")} onClick={()=>setSoloMov(s=>!s)}>
        {soloMov?"Ver reporte completo":"Ver solo con movimiento"}</button>
      <button className="btn ghost" onClick={()=>window.print()}><Icon name="download" size={15} style={{marginRight:6}}/>Imprimir / Guardar PDF</button>
    </div>}
    <div style={{marginBottom:10}}>
      <div style={{fontWeight:800,fontSize:16}}>{r.bodegaNombre} <span style={{fontWeight:400,color:"var(--muted)",fontSize:13}}>#{r.bodega}</span></div>
      <div className="meta">Fecha: <b>{r.fecha}</b></div>
      <div className="meta">Responsable del conteo: <b>{r.responsable||"—"}</b></div>
      {r.cerrado
        ? <div className="meta">Cerrado por <b>{r.cerradoPor||"—"}</b> el {fmtDT(r.cerradoEn)}</div>
        : <div className="meta">Nunca se cerró.</div>}
      <div className="meta">PAX registrado por: <b>{[...new Set((r.servicios||[]).map(s=>s.registradoPor).filter(Boolean))].join(", ")||"—"}</b></div>
      <div className="meta">Aprobado por: <b>{r.aprobado===true ? `${r.aprobadoPor||"—"} el ${fmtDT(r.aprobadoEn)}` : (r.cerrado ? "pendiente de aprobación" : "—")}</b></div>
      {r.editadoPor && <div className="meta">Última edición: <b>{r.editadoPor}</b> el {fmtDT(r.editadoEn)}</div>}
      {(r.ajustes||[]).map((a,i)=><div key={"aj"+i} className="banner" style={{background:"#fff3d6",borderColor:"#e8d9ae",color:"#8a6512",marginTop:6,flexDirection:"column",alignItems:"stretch",gap:2}}>
        <div><b>Ajustado por {a.por}</b> el {fmtDT(a.en)}</div>
        {(a.detalle||[]).slice(0,40).map((d,j)=><div key={j} style={{fontSize:12}}>{d}</div>)}
        {(a.detalle||[]).length>40 && <div style={{fontSize:12}}>… y {(a.detalle||[]).length-40} cambio(s) más.</div>}
      </div>)}
      {r.notaLimite && <div className="banner" style={{background:"#fdeceb",borderColor:"#e8b4ae",color:"#9a3324",marginTop:8}}>
        <Icon name="alert" size={15}/> {r.notaLimite}</div>}
    </div>
    {completo && <div className="card" style={{marginBottom:12,padding:"10px 14px"}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>PAX por servicio — total del día: {pax}</div>
      {(r.servicios||[]).length===0 && <div className="hint">Sin registros de PAX ese día.</div>}
      {(r.servicios||[]).map(s=><div key={s.id} style={{display:"flex",gap:10,fontSize:13,padding:"2px 0"}}>
        <div style={{flex:"1 1 auto",fontWeight:700}}>{invNombreServicio(invBodega(r.bodega), s.nombre)}</div>
        <div>{s.adultos} adultos</div>{!esBar && <div>{s.ninos} niños</div>}
        <div className="meta" style={{minWidth:120,textAlign:"right"}}>{s.registradoPor||""}</div>
      </div>)}
    </div>}
    <input type="text" className="inp inv-noprint" placeholder="Buscar producto o código…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
    {completo && soloMov && <div className="hint" style={{marginBottom:8}}>Mostrando sólo productos con traslados, merma o consumo distinto de cero ese día.</div>}
    <div style={{display:"flex",fontSize:11,fontWeight:700,color:"var(--muted)",padding:"0 2px",marginBottom:4,borderBottom:"1px solid var(--line)"}}>
      <div style={{flex:"1 1 auto"}}>Producto</div>
      <div style={{width:56,textAlign:"right"}}>Inicial</div>
      {completo && <>
        <div style={{width:56,textAlign:"right"}}>Trasl.+</div>
        <div style={{width:56,textAlign:"right"}}>Trasl.−</div>
        <div style={{width:56,textAlign:"right"}}>Merma</div>
      </>}
      <div style={{width:56,textAlign:"right"}}>Final</div>
      {completo && <>
        <div style={{width:64,textAlign:"right"}}>Consumo</div>
        <div style={{width:60,textAlign:"right"}}>Promedio</div>
      </>}
    </div>
    <div style={{maxHeight:completo?"none":420,overflowY:completo?"visible":"auto"}}>
      {items.map(it=>{ const cons=invConsumoVista(it); const prom=invComputePromedio(cons,pax);
        const neg = cons < -0.001;
        return <div key={it.codigo+"|"+it.nombre} style={{display:"flex",alignItems:"center",padding:"6px 2px",borderBottom:"1px solid var(--line)",fontSize:12.5,...(neg?{background:INV_COLOR_NEG.bg,color:INV_COLOR_NEG.fg}:{})}}>
          <div style={{flex:"1 1 auto",minWidth:0}}>
            <div style={{fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.nombre}<InvUnidad it={it} bodega={r.bodega}/>{it.nuevo && <span className="pill" style={{marginLeft:6,background:"#fbe6e6",color:"#a83232",fontSize:9.5,padding:"1px 5px"}}>NUEVO</span>}</div>
            <div className="meta" style={{fontSize:10.5}}>#{it.codigo}</div>
          </div>
          <div style={{width:56,textAlign:"right"}}>{invFmt(it.inicial)}</div>
          {completo && <>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.tp)}</div>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.tn)}</div>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.merma)}</div>
          </>}
          <div style={{width:56,textAlign:"right",fontWeight:700}}>{invFmt(invFinalVista(it))}</div>
          {completo && <>
            <div style={{width:64,textAlign:"right",fontWeight:700,color:neg?INV_COLOR_NEG.fg:"var(--ocean-d)"}}>{invFmt(cons)}</div>
            <div style={{width:60,textAlign:"right",color:"var(--muted)"}}>{prom===null?"—":invFmt(prom)}</div>
          </>}
        </div>; })}
      {!items.length && <div className="empty">{(completo&&soloMov)?"Ningún producto tuvo movimiento ese día.":"Ningún producto coincide."}</div>}
    </div>
    {completo && r.cerrado && <div className="inv-noprint" style={{marginTop:14,paddingTop:10,borderTop:"1px solid var(--line)"}}>
      {r.aprobado===false && <div className="pill" style={{background:"#fff3d6",color:"#8a6512"}}><Icon name="clock" size={13} style={{marginRight:4}}/>Pendiente de aprobación del Jefe de Operaciones</div>}
      {r.aprobado===true && <div className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}>Aprobado por {r.aprobadoPor} el {fmtDT(r.aprobadoEn)}</div>}
    </div>}
    {esGD(user) && <div className="inv-noprint" style={{marginTop:14,paddingTop:10,borderTop:"1px solid var(--line)"}}>
      <button className="btn ghost" style={{color:"#a83232",borderColor:"#e8b4ae"}} disabled={borrando} onClick={eliminar}>
        <Icon name="trash" size={15} style={{marginRight:6}}/>{borrando?"Eliminando…":"Eliminar este registro"}</button>
      <div className="hint" style={{marginTop:4}}>Borra permanentemente este cierre de inventario. No se puede deshacer.</div>
    </div>}
  </div>;
}
/* ===== Pantalla: Aprobación de cierres (Jefe de Operaciones — Antonio) =====
   Todo cierre nuevo queda "pendiente" hasta que Antonio lo revise: OK lo deja
   tal cual y lo habilita para Gerencia General; Ajustar le permite corregir
   Cantidad final y PAX antes de aprobarlo, dejando constancia del ajuste. */
function InventarioAprobacion({user,toast}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const [filas,setFilas]=useState(null);
  const [ajustando,setAjustando]=useState(null);
  const [viendo,setViendo]=useState(null);
  async function cargar(){
    const bodegas=INV_CFG.bodegas||[];
    const out=[];
    for(const b of bodegas){
      const regs=await invRegistrosDe(b.codigo);
      for(const r of regs){ if(r.cerrado && r.aprobado===false) out.push(r); }
    }
    out.sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
    setFilas(out);
  }
  useEffect(()=>{ cargar(); },[]);
  async function aprobar(r){
    if(r.bloqueadoPorLimite){ toast("Ya venció el plazo de las 10am para este cierre — quedó registrado tal cual."); return; }
    try{
      const toSave={...r, aprobado:true, aprobadoPor:user.nombre, aprobadoEn:nowISO()};
      await invGuardarFusionado(r, toSave);
      toast("Aprobado — ya está disponible para Gerencia General.");
      cargar();
    }catch(e){ toast("No se pudo aprobar: "+(e.message||e)); }
  }
  if(!filas) return <div className="empty">Cargando…</div>;
  return <div>
    <p className="sub">Cierres del día ya con inventario final y merma, esperando tu revisión. Mientras no des OK o ajustes, Gerencia General no los ve. Tienes hasta las 10:00am del día siguiente al cierre para revisarlo — pasada esa hora queda registrado tal cual y ya no se puede ajustar ni aprobar. Puedes abrir "Ver inventario" en cualquier momento para revisar el detalle completo antes de decidir.</p>
    {!filas.length && <div className="empty"><div className="e"><Icon name="check" size={44}/></div>No hay cierres pendientes de aprobación.</div>}
    {filas.map(r=><div key={r.id} className="item">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
        <div><b>{r.bodegaNombre}</b><div className="meta">{r.fecha} · responsable {r.responsable||"—"} · cerrado por {r.cerradoPor} el {fmtDT(r.cerradoEn)}</div>
          {r.bloqueadoPorLimite && <div className="meta" style={{color:"#9a3324"}}>{r.notaLimite}</div>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn ghost" onClick={()=>setViendo(r)}><Icon name="filetext" size={15} style={{marginRight:6}}/>Ver inventario</button>
          {r.bloqueadoPorLimite
            ? <span className="pill" style={{background:"#fdeceb",color:"#9a3324"}}><Icon name="alert" size={12} style={{marginRight:3}}/>Plazo vencido</span>
            : <>
                <button className="btn ghost" onClick={()=>setAjustando(r)}>Ajustar</button>
                <button className="btn primary" onClick={()=>aprobar(r)}><Icon name="check" size={15} style={{marginRight:6}}/>OK</button>
              </>}
        </div>
      </div>
    </div>)}
    {viendo && <Modal title={`${viendo.bodegaNombre} · ${viendo.fecha}`} onClose={()=>setViendo(null)} wide>
      <InventarioDetalle r={viendo} user={user} toast={toast} onEliminado={()=>{setViendo(null);cargar();}}/>
    </Modal>}
    {ajustando && <Modal title={`Ajustar · ${ajustando.bodegaNombre} · ${ajustando.fecha}`} onClose={()=>setAjustando(null)}>
      <InventarioAjuste r={ajustando} user={user} toast={toast} onDone={()=>{ setAjustando(null); cargar(); }}/>
    </Modal>}
  </div>;
}
/* Editor de ajuste: el Jefe de Operaciones corrige Cantidad final y PAX de un
   cierre ya hecho por cocina/servicio, antes de aprobarlo. Al guardar se
   marca aprobado automáticamente y queda el registro "Ajuste realizado por
   el Jefe de Operaciones" visible al pie del detalle (InventarioDetalle). */
function InventarioAjuste({r,user,toast,onDone}){
  const [items,setItems]=useState(()=>JSON.parse(JSON.stringify(r.items||[])));
  const [servicios,setServicios]=useState(()=>invNormServicios(invBodega(r.bodega), JSON.parse(JSON.stringify(r.servicios||[]))));
  const [guardando,setGuardando]=useState(false);
  const bodegaObj = invBodega(r.bodega);
  const esBar = invEsBebidas(bodegaObj);
  const [servNombre,setServNombre]=useState(invServiciosDisponibles(bodegaObj)[0]);
  const [servAd,setServAd]=useState(""); const [servNi,setServNi]=useState("");
  function setFinal(i,v){ setItems(arr=>{ const a=arr.slice(); a[i]={...a[i],final:v===""?null:+v}; return a; }); }
  function agregarServicio(){ const ad=+servAd||0, ni=esBar?0:(+servNi||0);
    if(!ad&&!ni){ toast(esBar?"Ingresa la cantidad de adultos.":"Ingresa al menos adultos o niños."); return; }
    setServicios(s=>[...s,{id:gid(),nombre:invServicioValido(bodegaObj,servNombre),adultos:ad,ninos:ni,registradoPor:user.nombre,registradoEn:nowISO()}]); setServAd(""); setServNi(""); }
  function quitarServicio(id){ setServicios(s=>s.filter(x=>x.id!==id)); }
  async function guardar(){
    if(r.bloqueadoPorLimite){ toast("Ya venció el plazo de las 10am para este cierre — quedó registrado tal cual."); return; }
    setGuardando(true);
    try{
      const nuevo = {...r, items, servicios};
      let toSave = {...nuevo, aprobado:true, aprobadoPor:user.nombre, aprobadoEn:nowISO(),
        ajustes:[...(r.ajustes||[]), {por:user.nombre, en:nowISO(), detalle:invDetalleCambios(r, nuevo)}]};
      toSave = await invGuardarFusionado(r, toSave);
      await invPropagarInicial(r.bodega, toSave);
      toast("Ajuste guardado y aprobado — ya está disponible para Gerencia General.");
      onDone();
    }catch(e){ toast("No se pudo guardar el ajuste: "+(e.message||e)); }
    setGuardando(false);
  }
  return <div>
    <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
      <div style={{fontWeight:700,fontSize:13.5,marginBottom:2}}>PAX por servicio</div>
      {servicios.length===0 && <div className="hint" style={{marginBottom:8}}>Sin registros de PAX ese día.</div>}
      {servicios.map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,background:"#f3efe6",borderRadius:10,padding:"7px 10px",marginBottom:6,fontSize:13}}>
        <div style={{fontWeight:700,flex:"1 1 auto"}}>{invNombreServicio(bodegaObj, s.nombre)}</div>
        <div>{s.adultos} adultos</div>{!esBar && <div>{s.ninos} niños</div>}
        <button className="btn ghost" style={{padding:"3px 8px",fontSize:12}} onClick={()=>quitarServicio(s.id)}>✕</button>
      </div>)}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
        <select className="inp" style={{width:150}} value={servNombre} onChange={e=>setServNombre(e.target.value)}>
          {invServiciosDisponibles(bodegaObj).map(s=><option key={s} value={s}>{s}</option>)}</select>
        <input className="inp" type="number" min="0" placeholder="Adultos" style={{width:90}} value={servAd} onChange={e=>setServAd(e.target.value)}/>
        {!esBar && <input className="inp" type="number" min="0" placeholder="Niños" style={{width:90}} value={servNi} onChange={e=>setServNi(e.target.value)}/>}
        <button className="btn ghost" onClick={agregarServicio}>Agregar</button>
      </div>
    </div>
