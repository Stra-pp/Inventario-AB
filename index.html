/* ===== Pantalla: Resumen Gerencial (solo Gerencia/Desarrollador) =====
   Responde directamente a "cómo quedó el inventario del día anterior":
   una fila por bodega con el último cierre, quién lo hizo y cuándo. */
function InventarioResumen({user,toast}){
  const [filas,setFilas]=useState(null);
  const [ver,setVer]=useState(null);
  const [selFecha,setSelFecha]=useState({}); // bodega.codigo -> fecha elegida en el filtro
  async function cargar(){
    const bodegas=INV_CFG.bodegas||[];
    const out=[];
    for(const b of bodegas){
      /* Un cierre nuevo queda con aprobado:false hasta que el Jefe de
         Operaciones le da OK o lo ajusta (ver InventarioAprobacion) — hasta
         entonces no aparece aquí. Los registros viejos sin ese campo
         (aprobado===undefined) se consideran ya aprobados, para no ocultar
         retroactivamente el histórico. */
      const regs=(await invRegistrosDe(b.codigo)).filter(r=>r.aprobado!==false); // todos los días de esta bodega, más reciente primero
      const ultimo=regs.find(r=>r.cerrado)||null;
      const hoy=regs.find(r=>r.fecha===hoyISO());
      out.push({bodega:b, regs, ultimo, hoy, cerradoHoy: !!(hoy&&hoy.cerrado)});
    }
    setFilas(out);
  }
  useEffect(()=>{ cargar(); },[]);
  if(!filas) return <div className="empty">Cargando…</div>;
  if(!filas.length) return <div className="empty">Todavía no hay bodegas configuradas. Ve a Inventario · Configurar.</div>;
  return <div>
    <p className="sub">Último cierre registrado por bodega. Usa "Ver otro día" para revisar días anteriores, o abre el de hoy aunque todavía no esté concluido.</p>
    {filas.map(f=>{ const fechaSel = selFecha[f.bodega.codigo]||"";
      const regSel = fechaSel ? f.regs.find(r=>r.fecha===fechaSel) : null;
      return <div key={f.bodega.codigo} className="item">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
          <b>{f.bodega.nombre}</b>
          {f.cerradoHoy && <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}>Hoy ya cerró</span>}
          {!f.cerradoHoy && f.ultimo && <span className="pill" style={{background:"#fff3d6",color:"#8a6512"}}>Hoy: pendiente</span>}
          {!f.ultimo && <span className="pill" style={{background:"#fbe6e6",color:"#a83232"}}>Sin registros aún</span>}
        </div>
        {f.ultimo ? <div className="meta" style={{marginTop:4}}>
            Último cierre: <b>{f.ultimo.fecha}</b> · responsable {f.ultimo.responsable||"—"} · {fmtDT(f.ultimo.cerradoEn)}
            {" "}· <span style={{cursor:"pointer",color:"var(--ocean-d)",fontWeight:700}} onClick={()=>setVer(f.ultimo)}>ver detalle</span>
          </div>
          : <div className="meta" style={{marginTop:4}}>Nadie ha cerrado un inventario todavía en esta bodega.</div>}
        {f.hoy && !f.cerradoHoy && <div className="meta" style={{marginTop:4}}>
            Hoy ({f.hoy.fecha}) todavía sin cerrar
            {" "}· <span style={{cursor:"pointer",color:"var(--ocean-d)",fontWeight:700}} onClick={()=>setVer(f.hoy)}>ver cómo va hoy</span>
          </div>}
        {!!f.regs.length && <div style={{marginTop:6,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <select className="inp" style={{width:190}} value={fechaSel} onChange={e=>setSelFecha(s=>({...s,[f.bodega.codigo]:e.target.value}))}>
            <option value="">Ver otro día…</option>
            {f.regs.map(r=><option key={r.fecha} value={r.fecha}>{r.fecha}{r.cerrado?"":" (sin cerrar)"}</option>)}
          </select>
          {regSel && <button className="btn ghost" style={{padding:"4px 10px",fontSize:12.5}} onClick={()=>setVer(regSel)}>Ver</button>}
        </div>}
      </div>; })}
    {ver && <Modal title={`${ver.bodegaNombre} · ${ver.fecha}`} onClose={()=>setVer(null)} wide>
      <InventarioDetalle r={ver} user={user} toast={toast} onEliminado={()=>{setVer(null);cargar();}}/></Modal>}
  </div>;
}

['6658','06',[[102072,'COSTILLA DE CERDO 180G',5],[103033,'PULPA DE CANGREJO',1]]]];
async function invPlanCorreccion25(){
  const all = await Store.read("Inventario",{noCache:true}); const plan=[];
  for(const b of ['08','16','10','15','06']){
    const rec0 = invSinDuplicados(all.filter(r=>r.bodega===b&&r.fecha===INV_CORR_FECHA))[0];
    if(!rec0){ plan.push({b, falta:true, cambios:[]}); continue; }
    const exp={}, keys=[];
    for(const [n,bb,lines] of INV_CORR_DOCS) if(bb===b) for(const [c,nom,q] of lines){ const k=String(c);
      exp[k]=exp[k]||{nom,q:0}; exp[k].q=Math.round((exp[k].q+q)*1000)/1000; keys.push([n,k,'+',q].join('|')); }
    const cat=new Set(((invBodega(b)||{}).productos||[]).map(p=>p.codigo));
    const corrige=['08','16','10'].includes(b); let items=(rec0.items||[]).map(i=>({...i})); const cambios=[];
    if(corrige){
      const visto=new Set();
      for(const i of items){ const e=exp[i.codigo]; let ntp=e?e.q:0; if(e&&visto.has(i.codigo)) ntp=0; if(e) visto.add(i.codigo);
        if((+i.tp||0)!==ntp||(+i.tn||0)!==0){ cambios.push(`${i.nombre}: Traslados (+) ${i.tp||0} → ${ntp}, (−) ${i.tn||0} → 0`); i.tp=ntp; i.tn=0; } }
      items=items.filter(i=>{ const vacia=!(+i.tp)&&!(+i.tn)&&!(+i.merma)&&!(+i.inicial)&&(i.final==null||i.final===''||+i.final===0);
        if(!cat.has(i.codigo)&&vacia){ cambios.push(`Se quita la línea ${i.nombre}`); return false; } return true; });
    }
    for(const [k,e] of Object.entries(exp)) if(!items.some(i=>i.codigo===k)){
      items.push({codigo:k,nombre:e.nom+' (item nuevo)',unidad:'',inicial:0,tp:e.q,tn:0,merma:0,final:rec0.cerrado?e.q:null,nuevo:true,soloDia:true});
      cambios.push(`Se agrega ${e.nom} (item nuevo): Traslados (+) ${e.q}`); }
    plan.push({b, nombre:rec0.bodegaNombre, rec0, items, keys, cambios});
  }
  return plan;
}
async function invAplicarCorreccion25(plan, quien){
  const en=nowISO(), log=[];
  for(const p of plan){ if(p.falta) continue;
    const rec={...p.rec0, items:p.items, trasladosAplicados:[...new Set([...(p.rec0.trasladosAplicados||[]),...p.keys])]};
    if(p.cambios.length){ rec.ajustes=[...(p.rec0.ajustes||[]),{por:quien,en,detalle:'Traslados del 25/09 corregidos según documentos Zeus 6648–6658:\n'+p.cambios.join('\n')}]; rec.editadoPor=quien; rec.editadoEn=en; }
    await Store.writeOne("Inventario", rec); log.push(`${p.nombre}: ${p.cambios.length} cambio(s)`); }
  for(const b of ['08','16','10']){ try{
    const rec=invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.bodega===b&&r.fecha===INV_CORR_FECHA))[0];
    if(!rec) continue; const r=await invPropagarInicial(b, rec, {quien});
    log.push(`${(invBodega(b)||{}).nombre||b}: Inicial actualizado en ${(r.cambiados||[]).map(f=>f.slice(8)+'/'+f.slice(5,7)).join(', ')||'—'}${r.cerradoAfectado?' (se detuvo en el día cerrado '+r.cerradoAfectado.slice(8)+'/'+r.cerradoAfectado.slice(5,7)+')':''}`);
  }catch(e){ log.push(b+': error al pasar el Inicial — '+(e.message||e)); } }
  return log;
}
function InventarioCorreccion25({user,toast}){
  const [plan,setPlan]=useState(null); const [cargando,setCargando]=useState(false); const [log,setLog]=useState(null);
  async function revisar(){ setCargando(true); try{ setPlan(await invPlanCorreccion25()); setLog(null);}catch(e){toast("No se pudo revisar: "+(e.message||e));} finally{setCargando(false);} }

    {log && <div style={{marginTop:10,fontSize:13,whiteSpace:"pre-wrap",background:"#e6f2f3",padding:10,borderRadius:8}}>{log.join("\n")}</div>}
  </div>;
}
/* Accesos por persona: en vez de repetir a todo el personal debajo de cada
   bodega, se busca a la persona y se marcan sus bodegas en una sola tabla
   (Cuenta inventario / Registra PAX). Por defecto solo se muestra a quienes ya
   tienen algún acceso; el buscador trae a cualquiera del personal. Usa los

               (c.length||p.length) ? [c.length?("Cuenta: "+c.map(nb).join(", ")):null, p.length?("PAX: "+p.map(nb).join(", ")):null].filter(Boolean).join(" · ") : "Entra a la app, sin bodegas asignadas"}

        </div>
        {open && <div style={{marginTop:10}} onClick={e=>e.stopPropagation()}>

/* Configurar → Costos: fecha del listado vigente, subir un nuevo listado de
   Zeus (PDF "Listado de precios compra y costo") y poner a mano el costo de
   los productos que no están en ese listado (porciones, preparados). */
async function invLeerPdfCostos(file){
  if(!window.pdfjsLib){ await new Promise((ok,ko)=>{ const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload=ok; sc.onerror=()=>ko(new Error("No se pudo cargar el lector de PDF")); document.head.appendChild(sc); });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  const pdf = await window.pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const mapa={}, unidades={}; let fechaImp="";
  for(let n=1;n<=pdf.numPages;n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    const filas = {};
    for(const it of tc.items){ const y=Math.round(it.transform[5]/2)*2; (filas[y]=filas[y]||[]).push({x:it.transform[4], t:it.str}); }
    for(const y of Object.keys(filas)){ const linea = filas[y].sort((a,b)=>a.x-b.x).map(o=>o.t).join(" ").replace(/\s+/g," ").trim();
      const m = linea.match(/^(\d{5,9}) .*? ([\d]+\.\d+) ([\d]+\.\d+)$/); if(m) mapa[m[1]] = Math.round(parseFloat(m[3])*10000)/10000;
      const mu = linea.match(/^(\d{5,9}) .* (UNIDADES|UNIDAD|KILOS|LITROS|PAQUETES|PAQUETE|CAJA|GALON|SACO|PARES|METROS|[A-Z]+) [\d]+\.\d+ [\d]+\.\d+$/); if(mu) unidades[mu[1]] = mu[2];
      const f = linea.match(/(\d{4})\/(\d{2})\/(\d{2})/); if(!fechaImp && f) fechaImp=`${f[1]}-${f[2]}-${f[3]}`; }
  }
  return {mapa, unidades, fecha: fechaImp || hoyISO()};
}

/* Cambia el código de un producto del catálogo también en los días ABIERTOS de
   esa bodega (los cerrados no se tocan). Si el código nuevo ya lo tenía otro
   producto, se intercambian. Los traslados (+)/(−) se registran por código de
   Zeus, así que en un intercambio se quedan con su código; inicial, merma y
   final se quedan con el producto (su nombre). Luego se recalcula el Inicial. */
async function invCambiarCodigoEnAbiertos(bodega, nombre, viejo, nuevo, otroNombre, quien){
  const regs = (await invRegistrosDe(bodega)).filter(r=>!r.cerrado);
  const tocados=[];
  for(const r of regs){
    const items=(r.items||[]).map(x=>({...x}));
    const ia = items.findIndex(x=>x.nombre===nombre && (x.codigo||"")===(viejo||""));
    const ib = otroNombre!=null ? items.findIndex(x=>x.nombre===otroNombre && (x.codigo||"")===(nuevo||"")) : -1;
    if(ia<0 && ib<0) continue;
    if(ia>=0 && ib>=0){ const A=items[ia], B=items[ib];
      items[ia]={...A, codigo:nuevo, tp:B.tp, tn:B.tn}; items[ib]={...B, codigo:viejo, tp:A.tp, tn:A.tn}; }
    else if(ia>=0) items[ia]={...items[ia], codigo:nuevo};
    else items[ib]={...items[ib], codigo:viejo};
    const rec={...r, items, ajustes:[...(r.ajustes||[]),{por:quien,en:nowISO(),detalle:`Código de ${nombre}: ${viejo||"(sin código)"} → ${nuevo||"(sin código)"}`+(otroNombre!=null?` (intercambiado con ${otroNombre})`:"")}]};
    await Store.writeOne("Inventario", rec); tocados.push(rec);
  }
  tocados.sort((x,y)=>x.fecha<y.fecha?-1:1);
  if(tocados[0]){ try{ await invPropagarInicial(bodega, tocados[0], {quien}); }catch(e){} }
  return tocados.map(r=>r.fecha);
}
function InventarioConfigBodega({b,user,toast,onSave,onDel,onChange}){
  const [cod,setCod]=useState(""); const [nom,setNom]=useState(""); const [abierto,setAbierto]=useState(false);
  const [q,setQ]=useState(""); const [edit,setEdit]=useState(null); // {idx, codigo, nombre}
  function addProd(){ const c=cod.trim(), n=nom.trim(); if(!c||!n){ toast("Falta código o nombre del producto."); return; }
    if((b.productos||[]).some(p=>p.codigo===c)){ toast("Ya existe un producto con ese código en esta bodega."); return; }
    b.productos=[...(b.productos||[]),{codigo:c,nombre:n,unidad:""}]; setCod(""); setNom(""); onChange(); onSave(); }
  /* Se borra por posición: puede haber productos sin código o con el mismo código
     (p.ej. dos presentaciones de WAHOO), y borrar por código se llevaría a ambos. */
  function delProd(idx){ const p=(b.productos||[])[idx];
    if(!window.confirm(`¿Quitar ${p?p.nombre:"este producto"} de la lista de esta bodega?`)) return;
    b.productos=(b.productos||[]).filter((p,j)=>j!==idx); onChange(); onSave(); }
  async function guardarEdicion(){
    const prods=(b.productos||[]).slice(); const p=prods[edit.idx]; if(!p){ setEdit(null); return; }
    const c=edit.codigo.trim(), n=edit.nombre.trim(), u=(edit.unidad||"").trim().toUpperCase(); if(!n){ toast("El nombre no puede quedar vacío."); return; }
    const cambiaCod = c!==(p.codigo||""), cambiaNom = n!==p.nombre, cambiaUni = u!==(p.unidad||"");
    if(!cambiaCod && !cambiaNom && !cambiaUni){ setEdit(null); return; }
    const jOtro = cambiaCod && c ? prods.findIndex((x,j)=>j!==edit.idx && x.codigo===c) : -1;
    const otro = jOtro>=0 ? prods[jOtro] : null;
    if(otro && !window.confirm(`El código ${c} ya lo tiene "${otro.nombre}". ¿Intercambiar los códigos? (${p.nombre} queda con ${c} y ${otro.nombre} con ${p.codigo||"(sin código)"})`)) return;
    const viejo=p.codigo||"", nombreViejo=p.nombre;
    prods[edit.idx]={...p, codigo:c, nombre:n, unidad:u};
    if(otro) prods[jOtro]={...otro, codigo:viejo};
    b.productos=prods; setEdit(null); onChange();
    if(!(await onSave())) return;
    if(cambiaCod){
      try{ const dias = await invCambiarCodigoEnAbiertos(b.codigo, nombreViejo, viejo, c, otro?otro.nombre:null, (user&&user.nombre)||"Desarrollador");
        if(dias.length) toast(`Código actualizado también en ${dias.length} día(s) abierto(s).`); }
      catch(e){ toast("El catálogo se guardó, pero no se pudo actualizar los días abiertos: "+(e.message||e)); }
    }
    if(cambiaNom) toast("Nombre actualizado en la lista. Los días ya creados conservan el nombre anterior.");
  }
  const lista=(b.productos||[]).map((p,idx)=>({p,idx}));
  const qq=q.trim().toUpperCase();
  const filtrada = qq ? lista.filter(({p})=>(p.nombre||"").toUpperCase().includes(qq) || (p.codigo||"").includes(qq)) : lista;
  return <div className="card" style={{marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setAbierto(!abierto)}>
      <div><b>{b.nombre}</b> <span className="meta">#{b.codigo} · {(b.productos||[]).length} producto(s)</span></div>
      <div style={{display:"flex",gap:6}}>
        <button className="iconbtn" style={{background:"#fbe6e6",color:"#a83232"}} onClick={e=>{e.stopPropagation();onDel();}}><Icon name="trash" size={15}/></button>
        <Icon name={abierto?"chevronUp":"chevronDown"} size={18}/>
      </div>
    </div>
    {abierto && <div style={{marginTop:10}}>
      <div className="row" style={{gap:8,marginBottom:8}}>
        <input className="inp" style={{maxWidth:110}} placeholder="Código" value={cod} onChange={e=>setCod(e.target.value)}/>
        <input className="inp" placeholder="Nombre del producto" value={nom} onChange={e=>setNom(e.target.value)}/>
        <button className="btn primary" onClick={addProd}><Icon name="plus" size={15}/></button>
      </div>
      <input className="inp" style={{marginBottom:8}} placeholder="Buscar por nombre o código…" value={q} onChange={e=>setQ(e.target.value)}/>
      <datalist id="inv-unidades">{["KILOS","UNIDAD","LITROS","PAQUETE","CAJA","GALON","PORCION","BOTELLA"].map(u=><option key={u} value={u}/>)}</datalist>
      <div className="hint" style={{marginBottom:6}}>La unidad sale del listado de Zeus por el código. Si un producto se cuenta distinto (por ejemplo, porciones), pulsa Editar y pon su unidad.</div>
      <div style={{maxHeight:360,overflowY:"auto"}}>
        {filtrada.map(({p,idx})=> edit && edit.idx===idx
          ? <div key={idx} style={{display:"flex",gap:6,alignItems:"center",padding:"6px 2px",borderBottom:"1px solid var(--line)"}}>
              <input className="inp" style={{maxWidth:110}} value={edit.codigo} onChange={e=>setEdit({...edit,codigo:e.target.value})} placeholder="Código"/>
              <input className="inp" value={edit.nombre} onChange={e=>setEdit({...edit,nombre:e.target.value})}/>
              <input className="inp" list="inv-unidades" style={{maxWidth:110}} placeholder={invUnidad({codigo:edit.codigo})||"Unidad"} value={edit.unidad} onChange={e=>setEdit({...edit,unidad:e.target.value})}/>
              <button className="btn primary" style={{padding:"6px 10px"}} onClick={guardarEdicion}>Guardar</button>
              <button className="btn ghost" style={{padding:"6px 10px"}} onClick={()=>setEdit(null)}>✕</button>
            </div>
          : <div key={idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 2px",borderBottom:"1px solid var(--line)",fontSize:13}}>
              <div>{p.nombre}<InvUnidad it={p} bodega={b.codigo}/> <span className="meta">#{p.codigo||"sin código"}</span></div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn ghost" style={{padding:"5px 10px",fontSize:12.5,background:"#e6f2f3",color:"var(--ocean-d)",borderColor:"#bcdfe2"}} title="Editar código o nombre" onClick={()=>setEdit({idx,codigo:p.codigo||"",nombre:p.nombre,unidad:p.unidad||""})}><Icon name="edit" size={13} style={{marginRight:4}}/>Editar</button>
                <button className="iconbtn" style={{background:"#fbe6e6",color:"#a83232"}} onClick={()=>delProd(idx)}><Icon name="trash" size={13}/></button>
              </div>
            </div>)}
        {!(b.productos||[]).length && <div className="empty">Sin productos todavía.</div>}
        {!!(b.productos||[]).length && !filtrada.length && <div className="hint">Ningún producto coincide con "{q}".</div>}
      </div>
    </div>}
  </div>;
}

/* ===== Módulo Inventario: contenedor con pestañas ===== */
function Inventario({user,toast}){
  const esGer = user.rol==='gerencia';
  const propias = inventarioBodegasDe(user);
  const propiasServicio = inventarioBodegasServicioDe(user);
  const modoCierre = (esGD(user) || esMerma(user)) ? "completo" : "cocina";
  const showCierre = !esGer && propias.length>0;
  const showServicio = !esGer && propiasServicio.length>0 && !esGD(user); // GD ya ve todo en modo completo
  const showHistorial = !esGer && propias.length>0;
  /* Resumen Gerencial también se abre para quien esté en INV_CFG.accesosReporte
     (jefaturas puntuales, ej. Antonio Puga): necesitan ver cómo cerró
     el día cada bodega sin poder editar nada — mismo reporte de sólo lectura
     que ve Gerencia, pero explícitamente concedido por Desarrollador en
     Configurar, no a cualquier cuenta de jefatura del hotel. */
  const showResumen = tienePermiso(user,'resumen') || tienePermiso(user,'desviaciones') || tienePermiso(user,'costos');
  /* Gerencia General, por defecto, SOLO ve la pestaña de Desviaciones — no el
     detalle operativo (Cierre/Servicio/Historial/Resumen) ni Configurar. El
     Desarrollador sigue viendo todo. Ambos pueden ajustar aquí el correo y
     los umbrales de alerta. Cualquier excepción puntual (por ejemplo, que
     Gerencia también vea el Resumen) se da desde Configurar → "Qué puede ver
     cada uno", no cambiando este valor por defecto. */
  const showDesviaciones = tienePermiso(user,'desviaciones');
  const showCostos = tienePermiso(user,'costos');
  const showConf = tienePermiso(user,'configurar');
  /* Aprobación: solo el Jefe de Operaciones (merma:true, hoy Antonio Puga) y
     el Desarrollador (para soporte) revisan los cierres pendientes antes de
     que Gerencia General pueda verlos en el Resumen. */
  const showAprobacion = esJefeOperaciones(user) || esDev(user);
  const [tab,setTab]=useState(showCierre?"cierre":showServicio?"servicio":showAprobacion?"aprobacion":showResumen?"resumen":showHistorial?"historial":showDesviaciones?"desviaciones":showCostos?"costos":"conf");
  const sinNada = !showCierre && !showServicio && !showHistorial && !showResumen && !showDesviaciones && !showCostos && !showConf && !showAprobacion;
  return <div>
    <h1 className="h1">Inventario A&B</h1>
    <p className="sub">Cierre diario de bodegas y consumo real.</p>
    {sinNada && <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
      Todavía no tienes ninguna bodega asignada.<br/>Pide al Desarrollador que entre con PIN 9999 → Inventario → Configurar, y te asigne una bodega ahí.</div>}
    {!sinNada && <div className="seg">
      {showCierre && <button className={tab==="cierre"?"on":""} onClick={()=>setTab("cierre")}>Cierre del día</button>}
      {showServicio && <button className={tab==="servicio"?"on":""} onClick={()=>setTab("servicio")}>PAX / Servicio</button>}
      {showAprobacion && <button className={tab==="aprobacion"?"on":""} onClick={()=>setTab("aprobacion")}><Icon name="check" size={15} style={{marginRight:6}}/>Aprobación</button>}
      {showHistorial && <button className={tab==="historial"?"on":""} onClick={()=>setTab("historial")}>Historial</button>}
      {showResumen && <button className={tab==="resumen"?"on":""} onClick={()=>setTab("resumen")}><Icon name="trendup" size={15} style={{marginRight:6}}/>Resumen Gerencial</button>}
      {showConf && <button className={tab==="conf"?"on":""} onClick={()=>setTab("conf")}>Configurar</button>}
    </div>}
    {tab==="cierre" && showCierre && <InventarioCierre user={user} toast={toast} modo={modoCierre}/>}
    {tab==="servicio" && showServicio && <InventarioServicio user={user} toast={toast}/>}
    {tab==="aprobacion" && showAprobacion && <InventarioAprobacion user={user} toast={toast}/>}
    {tab==="historial" && showHistorial && <InventarioHistorial user={user} toast={toast}/>}
    {tab==="resumen" && showResumen && <div><InventarioCostos user={user} toast={toast}/>{tienePermiso(user,'configurar') && <InventarioCorreos user={user} toast={toast}/>}</div>}
    {tab==="conf" && showConf && <InventarioConfig user={user} toast={toast}/>}
  </div>;
}

/* Versión de la app. Si alguien tiene abierta una versión anterior (la página
   quedó abierta desde antes de publicar un cambio), se le avisa para recargar:
   así todos usan las mismas reglas de cálculo y la misma lista. */
const APP_BUILD = "2026-10-14b";
function useVersionNueva(){
  const [nueva,setNueva]=useState(false);
  useEffect(()=>{ if(typeof location==="undefined" || location.protocol==="file:") return;
    async function revisar(){ try{ const t = await (await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text();
      const m = t.match(/const APP_BUILD = "([^"]+)"/); if(m && m[1]!==APP_BUILD) setNueva(true); }catch(e){} }
    const t=setInterval(revisar, 10*60*1000); const onVis=()=>{ if(!document.hidden) revisar(); };
    document.addEventListener("visibilitychange", onVis); revisar();
    return ()=>{ clearInterval(t); document.removeEventListener("visibilitychange", onVis); };
  },[]);
  return nueva;
}
function App(){
  const versionNueva = useVersionNueva();
  const [user,setUser]=useState(()=>{ try{return JSON.parse(sessionStorage.getItem("pp_inv_user"))}catch{return null} });
  const [toastMsg,setToastMsg]=useState("");
  const [connected,setConnected]=useState(MODE!=="graph");

  const [cfgVer,setCfgVer]=useState(0);
  const toast=m=>{ setToastMsg(m); const dur=/no se pudo|error|❌|403|falló/i.test(m)?8000:2600; setTimeout(()=>setToastMsg(""),dur); };
  useEffect(()=>{ (async()=>{
    if(MODE==="graph"){ const ok=await msEnsure(); setConnected(ok);
      if(ok){ try{ const cfgLeida = await invCfgRead();
          applyInvConfig(cfgLeida);
          /* El catálogo de ejemplo se carga SOLO si el archivo de configuración
             no existe. Si la lectura falla, no se toca nada (ver invCfgRead). */
          if(cfgLeida===null){ // el archivo de configuración no existe: primera vez
            INV_CFG.bodegas=INV_SEED_BODEGAS; INV_CFG_REV_BASE=0; await invCfgSave(); }
          invEnviarCorreosAutomaticos().catch(()=>{});
        }catch(e){ toast("No se pudo leer la configuración de Inventario ("+(e.message||e)+"). Recarga la página; no se cambió nada."); }
        setCfgVer(v=>v+1);
      }
    }
    setChecking(false);
  })(); },[]);
  useEffect(()=>{ if(MODE!=="graph") return;
    const t=setInterval(async()=>{ const ok=await refreshToken(); if(ok){ setConnected(true); invEnviarCorreosAutomaticos().catch(()=>{}); } }, 5*60*1000);
    return ()=>clearInterval(t);
  },[]);
  function onLogin(u){ sessionStorage.setItem("pp_inv_user",JSON.stringify(u)); setUser(u); }
  function logout(){ sessionStorage.removeItem("pp_inv_user"); setUser(null); }
  const isFileProtocol = typeof window!=="undefined" && window.location && window.location.protocol==="file:";
  if(MODE==="graph" && isFileProtocol) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag">Este archivo se abrió directamente desde tu computadora (no desde internet).</div>
    <div className="lerr" style={{marginTop:4,whiteSpace:"normal"}}>El inicio de sesión con Microsoft no puede completarse así — necesita que el archivo esté publicado en una dirección web (https://...), no abierto como archivo descargado.</div>
    <div className="hint" style={{marginTop:14}}>Solución: sube este archivo a GitHub Pages (como se explicó en las instrucciones de instalación) y ábrelo desde esa dirección web, por ejemplo <b>https://stra-pp.github.io/...</b>. Una vez publicado ahí, el botón de "Iniciar sesión con Microsoft" funcionará normalmente.</div>
  </div></div>;
  if(MODE==="graph" && checking) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag" style={{marginBottom:0}}>Conectando con SharePoint…</div></div></div>;
  if(MODE==="graph" && !connected) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag">Inicia sesión con tu cuenta Microsoft para usar la app. Los datos se guardan en SharePoint (Prueba7).</div>
    <button className="btn ocean block" onClick={()=>msSignIn()}><Icon name="link" size={15} style={{marginRight:6}}/>Iniciar sesión con Microsoft</button>
    {msErr && <div className="lerr" style={{marginTop:12,whiteSpace:"normal"}}>{msErr}</div>}
    <div className="hint" style={{marginTop:14,wordBreak:"break-all"}}>Si el login da error de "redirect_uri", registra esta URL exacta en Azure (App registrations · Authentication · Single-page application):<br/><b>{APP.ms.redirectUri}</b></div>
  </div></div>;
  if(!user) return <Login onLogin={onLogin}/>;
  return <div className="app">
    <TopBar user={user} onLogout={logout}/>

      <span>Hay una versión nueva de la app. Guarda lo que estés haciendo y recarga.</span>
      <button className="btn" style={{background:"#fff",color:"#1f4e5a"}} onClick={()=>location.reload()}>Recargar</button></div>}
    {toastMsg && <div className="toast">{toastMsg}</div>}
  </div>;
}

<script>
(function(){
  function show(msg){ var r=document.getElementById("root"); if(r&&r.children.length>0)return;
    r.innerHTML='<div style="max-width:560px;margin:40px auto;padding:20px;font-family:Inter,system-ui,sans-serif;color:#1f2a2c">'+
      '<h2 style="color:#0d6e75">Inventario A&amp;B no pudo cargar</h2><p style="color:#6c7a7c">'+msg+'</p>'+
      '<p style="color:#6c7a7c;font-size:13px">Si lo ves en la vista previa, descarga el archivo y ábrelo en tu navegador o súbelo a GitHub Pages.</p></div>'; }
  window.addEventListener("error",function(e){ show("Detalle: "+(e.message||"error al cargar un recurso")); });
  window.addEventListener("load",function(){ setTimeout(function(){
    if(typeof React==="undefined") return show("No se cargó React (la red bloqueó la CDN).");
    show("La aplicación no se inició. Abre la consola (F12) para más detalle."); },1800); });
})();
</script>
</body>
</html>
