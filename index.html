<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d6e75" />
<title>Inventario A&amp;B · Playa Paraíso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js" onerror="window.__noMsal=true"></script>
<script>if(typeof msal==="undefined"){var _m=document.createElement("script");_m.src="https://alcdn.msftauth.net/browser/2.38.0/js/msal-browser.min.js";document.head.appendChild(_m);}</script>
<style>
:root{
  --ocean:#0d6e75; --ocean-d:#0a565c; --ocean-l:#e6f2f3;
  --sand:#f7f4ee; --surface:#ffffff; --line:#e7e2d8;
  --ink:#1f2a2c; --muted:#6c7a7c;
  --coral:#e8663d; --coral-d:#cf5530;
  --green:#1f9d6b; --amber:#e0a32e; --red:#d34c4c; --blue:#3a78c2; --gray:#9aa6a7; --purple:#7e57c2;
  --shadow:0 1px 2px rgba(16,40,42,.06),0 8px 24px rgba(16,40,42,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px}
.app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--ocean);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top))}
.topbar .brand{font-weight:800;letter-spacing:.2px;font-size:18px;display:flex;align-items:center;gap:9px}
.topbar .logobox{background:#fff;border-radius:9px;padding:5px 11px;display:inline-flex;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.topbar .logobox img{height:26px;display:block}
.loginlogo{display:flex;justify-content:center;margin:2px 0 14px}
.loginlogo img{height:62px;max-width:80%;object-fit:contain}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(232,102,61,.25)}
.topbar .sp{flex:1}
.topbar .who{font-size:13px;opacity:.95;text-align:right;line-height:1.2}
.iconbtn{color:#fff;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}
.iconbtn:active{transform:scale(.96)}
.content{flex:1;padding:16px;padding-bottom:46px}
.backrow{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
.backbtn{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.h1{font-size:22px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;transition:transform .08s}
.tile:active{transform:translateY(1px) scale(.995)}
.tile .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;color:#fff}
.tile .t{font-weight:700;font-size:16px}
.tile .d{color:var(--muted);font-size:12.5px;line-height:1.35}
.tile .badge{align-self:flex-start;background:var(--ocean-l);color:var(--ocean-d);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px}
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.field .req{color:var(--coral)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink)}
.inp:focus,textarea.inp:focus,select.inp:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px var(--ocean-l)}
textarea.inp{min-height:88px;resize:vertical}
.hint{color:var(--muted);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:13px;padding:13px 18px;font-size:15px}
.btn.primary{background:var(--coral);color:#fff}
.btn.primary:active{background:var(--coral-d)}
.btn.ocean{background:var(--ocean);color:#fff}
.btn.ocean:active{background:var(--ocean-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.green{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11.5px;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill .pdot{width:7px;height:7px;border-radius:50%}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);margin-bottom:11px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .code{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.item .ttl{font-weight:700;font-size:15px;margin:3px 0 2px;line-height:1.3}
.item .meta{font-size:12.5px;color:var(--muted)}
.item .acts{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:46px 16px}
.empty .e{font-size:40px}
.seg{display:flex;background:#eee9df;border-radius:13px;padding:4px;gap:4px;margin-bottom:14px;overflow:auto}
.seg button{flex:1;white-space:nowrap;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ocean-d);box-shadow:var(--shadow)}
/* checklist ILD */
.crow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:#fff;cursor:pointer}
.crow.on{border-color:var(--green);background:#f1faf5}
.cbox{width:26px;height:26px;border-radius:8px;border:2px solid #cdd5d4;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.crow.on .cbox{background:var(--green);border-color:var(--green)}
.ctext{font-size:14px;font-weight:500}
.qcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:#fff}
.qcard .qt{font-weight:600;font-size:13.5px;margin-bottom:9px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:84px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:9px 8px;font-weight:700;font-size:13px;color:var(--muted)}
.opt.on{border-color:var(--ocean);background:var(--ocean-l);color:var(--ocean-d)}
.opt.si.on{border-color:var(--green);background:#e9f7f0;color:var(--green)}
.opt.no.on{border-color:var(--red);background:#fdeeee;color:var(--red)}
.pbar{height:8px;background:#e8e2d6;border-radius:6px;overflow:hidden;margin:8px 0 14px}
.pbar i{display:block;height:100%;background:var(--ocean);transition:width .25s}
.fgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fthumb{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fdel{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px}
.fnum{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:10px;padding:0 5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv b{color:var(--muted);font-weight:600}
.note{border-radius:12px;padding:12px 13px;margin:10px 0;font-size:13.5px}
.note.obs{background:#fff8e1;border:1px solid #ffe0a3}
.note.jef{background:#f3eafc;border:1px solid #d9c2f0}
.note.ger{background:#e9f7f0;border:1px solid #aedcc6}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.kpi .kn{font-size:22px;font-weight:800}
.kpi .kl{font-size:11px;color:var(--muted);margin-top:2px}
.barline{margin-bottom:11px}
.barline .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.barwrap{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eee7da}
.stars{display:flex;gap:4px;font-size:24px}
.stars span{cursor:pointer;color:#d8d2c5}
.stars span.on{color:var(--amber)}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{flex:0 0 80%;max-width:300px;background:#efe9de;border-radius:16px;padding:11px}
@media(min-width:760px){.kcol{flex:0 0 250px}}
.kcol h4{margin:2px 4px 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.kcol h4 .cnt{background:#fff;border-radius:999px;font-size:12px;padding:1px 9px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:var(--shadow)}
.kcol.over{outline:2px dashed var(--ocean);outline-offset:-4px}
.kchip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef3f6;color:#3c5b66}
.kchip.urg{background:#fbe6e6;color:#a83232}
.kcol h4 .dotc{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.kfilters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kfilters select{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.kcount{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.dgrp{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.dgrp .ghead{background:var(--ocean);color:#fff;font-weight:800;font-size:13px;letter-spacing:.4px;padding:11px 14px;display:flex;align-items:center;gap:8px}
.dscroll{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;min-width:560px}
.dtable th{background:#f6f2ea;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:9px 8px;text-align:center;white-space:nowrap}
.dtable th:first-child{text-align:left;padding-left:14px}
.dtable td{padding:11px 8px;text-align:center;border-top:1px solid #f0ebe1;font-size:13.5px;white-space:nowrap}
.dtable td:first-child{text-align:left;padding-left:14px;font-weight:700}
.dnum{display:inline-block;min-width:34px;border:1px solid var(--line);border-radius:9px;padding:3px 6px;font-weight:700;background:#fff}
.dnum.g{color:var(--green);border-color:#bfe6d3}
.dnum.p{color:var(--purple);border-color:#ddccf0}
.dcirc{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;font-weight:800;font-size:12px;border:2.5px solid}
.ddias{font-size:11px;color:var(--muted)}
.dild{font-weight:800;font-size:13.5px;color:var(--ink);line-height:1.25}
.dtable td:first-child .dsub{font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:10.5px;margin-top:2px;color:var(--muted)}
.dtable td:first-child .dmix{font-size:10.5px;margin-top:2px;color:var(--muted);font-weight:600}
.apitem{display:grid;grid-template-columns:1fr 90px 40px;grid-template-areas:"n b c" "m m m";align-items:center;gap:8px;padding:7px 0;border-top:1px solid #f4f0e7}
.apitem:first-child{border-top:0}
.apname{grid-area:n;font-size:12.5px;font-weight:700}
.apbar{grid-area:b;height:7px;border-radius:6px;background:#efe9de;overflow:hidden}
.apbar span{display:block;height:100%;border-radius:6px}
.apnum{grid-area:c;text-align:right;font-size:13px}
.apmeta{grid-area:m;font-size:10.5px;color:var(--muted);margin-top:-2px}
.kcard .kc{font-size:11px;color:var(--muted);font-weight:700}
.kcard .kt{font-weight:600;font-size:13.5px;margin:3px 0;line-height:1.3}
.kcard .km{font-size:11.5px;color:var(--muted)}
.kcard select{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12.5px}
.ovl{position:fixed;inset:0;background:rgba(16,30,32,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.ovl{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:620px){.modal{border-radius:20px}}
.modal.wide{max-width:600px}
@media(min-width:900px){.modal.wide{max-width:860px}}
@media(min-width:1200px){.modal.wide{max-width:1120px}}
.modal h3{margin:0 0 12px;font-size:18px}
@media print{
  body *{visibility:hidden}
  .inv-print,.inv-print *{visibility:visible}
  .inv-print{position:absolute;left:0;top:0;width:100%}
  .ovl{position:static!important;background:none!important;padding:0!important;display:block!important}
  .modal{position:static!important;max-height:none!important;overflow:visible!important;width:auto!important;max-width:none!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
  .inv-noprint{display:none!important}
}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:13px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:90%;text-align:center}
.banner{background:#fff7e8;border:1px solid #f0d9a0;color:#8a6512;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.ver{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 8px}
.fotomodal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.fotomodal img{max-width:96vw;max-height:90vh;border-radius:10px;object-fit:contain}
.fotomodal .x{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
/* ===== LOGIN (rediseñado) ===== */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 50% -10%, #14808a 0%, var(--ocean) 42%, var(--ocean-d) 78%, #073e43 100%)}
.login .sun{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,196,140,.45) 0%, rgba(232,102,61,.12) 55%, transparent 70%);pointer-events:none}
.login .wave{position:absolute;bottom:0;left:0;right:0;height:120px;background:
  radial-gradient(120% 100% at 50% 120%, rgba(255,255,255,.10), transparent 60%);pointer-events:none}
.lcard{position:relative;z-index:2;background:rgba(255,255,255,.97);border-radius:24px;padding:26px 22px;width:100%;max-width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);text-align:center}
.lbrand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;color:var(--ocean-d)}
.lbrand .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(232,102,61,.18)}
.ltag{color:var(--muted);font-size:13px;margin:4px 0 20px}
.lchoice{display:flex;flex-direction:column;gap:11px}
.lbig{display:flex;align-items:center;gap:13px;text-align:left;border:1.5px solid var(--line);border-radius:15px;padding:15px;background:#fff;transition:.12s}
.lbig:active{transform:scale(.99)}
.lbig.pri{border-color:var(--ocean);background:var(--ocean-l)}
.lbig .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;flex:0 0 auto}
.lbig .tt{font-weight:700;font-size:15px;color:var(--ink)}
.lbig .dd{font-size:12px;color:var(--muted);margin-top:1px}
.lsel{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px;font-size:15px;background:#fff;margin-bottom:14px}
.ldots{display:flex;gap:13px;justify-content:center;margin:4px 0 18px;height:16px}
.ldots i{width:14px;height:14px;border-radius:50%;background:#e2ddd2;transition:.15s}
.ldots i.f{background:var(--coral);transform:scale(1.05)}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lpad button{height:58px;border-radius:14px;background:#f3efe6;color:var(--ink);font-size:22px;font-weight:600;border:1px solid var(--line)}
.lpad button:active{background:var(--ocean-l)}
.lpad button.fn{font-size:14px;font-weight:700;color:var(--muted);background:#fff}
.lback{margin-top:16px;color:var(--ocean-d);font-weight:700;font-size:14px;background:none}
.lerr{color:var(--red);font-weight:600;font-size:13px;min-height:18px;margin-top:8px}
.lfoot{position:relative;z-index:2;color:rgba(255,255,255,.8);font-size:11px;margin-top:18px}

/* ===== Pulido visual (Fase 1) ===== */
svg{display:inline-block;vertical-align:middle}
.h1{letter-spacing:-.3px}
.tile{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
.tile .ico{transition:transform .12s ease}
.card{transition:box-shadow .14s ease}
.item{transition:box-shadow .12s ease, transform .08s ease}
.iconbtn{transition:background .12s ease, transform .06s ease}
.btn{transition:filter .12s ease, background .12s ease, transform .06s ease}
.btn:active{transform:translateY(1px)}
@media(hover:hover){
  .tile:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(16,40,42,.15);border-color:#d8d2c5}
  .tile:hover .ico{transform:scale(1.06)}
  .item:hover{box-shadow:0 8px 22px rgba(16,40,42,.11)}
  .btn.primary:hover,.btn.ocean:hover,.btn.green:hover,.btn.amber:hover,.btn.red:hover{filter:brightness(1.05)}
  .btn.ghost:hover,.backbtn:hover{background:#faf8f3;border-color:#d8d2c5}
  .iconbtn:hover{background:rgba(255,255,255,.24)}
  .lbig:hover{border-color:var(--ocean);box-shadow:0 6px 18px rgba(13,110,117,.10)}
  .seg button:not(.on):hover{color:var(--ocean-d)}
}

/* ===== Navegación inferior (Fase 2) ===== */
.content{padding-bottom:86px}
.bnav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:920px;z-index:40;
  display:flex;gap:2px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:6px 6px max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(16,40,42,.07)}
@supports((-webkit-backdrop-filter:blur(8px)) or (backdrop-filter:blur(8px))){
  .bnav{background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:12px;color:var(--muted);font-weight:700;font-size:10.5px;line-height:1;transition:color .12s,background .12s}
.bnav button .bic{position:relative;display:grid;place-items:center;height:22px}

const TZ_EC="America/Guayaquil";
const nowISO = () => new Date().toISOString();
function hoyEC(){ try{ return new Date().toLocaleDateString("en-CA",{timeZone:TZ_EC}); }catch(e){ return new Date(Date.now()-5*3600000).toISOString().slice(0,10); } }
/* ===== v6.8 · Todas las fechas en hora de Ecuador (UTC-5) =====
   Los registros se guardan en UTC (nowISO). Cortar ese ISO a 10 caracteres
   devuelve el día UTC, así que todo lo enviado después de las 19:00 de Ecuador
   aparecía como del día siguiente: por eso algunos ILD y tickets caían en el
   día equivocado. ymdEC() es el único camino permitido para responder
   "¿de qué día calendario es esto?" y hoyEC() para "¿qué día es hoy?". */
function ymdEC(v){
  if(v==null || v==="") return "";
  const s=String(v).trim();
  /* Una fecha sin hora (input type=date, FechaTentativa, FechaSolicitud) ya es
     un día de calendario: convertirla otra vez la correría un día. */
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(isNaN(d)) return s.slice(0,10);
  try{ return d.toLocaleDateString("en-CA",{timeZone:TZ_EC}); }
  catch(e){ return new Date(d.getTime()-5*3600000).toISOString().slice(0,10); }
}
/* Hoy en Ecuador, descompuesto. Reemplaza a new Date() cuando lo que se busca
   es el año, el mes o el día actual (los selectores de mes, los días esperados). */
function hoyPartesEC(){ const p=hoyEC().split("-").map(Number); return {y:p[0],m:p[1]-1,d:p[2]}; }
function hoyDateEC(){ const p=hoyPartesEC(); return new Date(p.y,p.m,p.d); }
const anioEC = v => Number(ymdEC(v).slice(0,4));
const mesEC  = v => Number(ymdEC(v).slice(5,7))-1;
/* Suma días a un "YYYY-MM-DD" sin salirse del calendario. */
function sumaDiasYMD(ymd,n){ const p=String(ymd).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const fmtDate = s => { if(!s) return "—"; const str=String(s);
  if(/^\d{4}-\d{2}-\d{2}/.test(str)){ const p=str.slice(0,10).split("-"); const d=new Date(+p[0],+p[1]-1,+p[2]);
    if(isNaN(d)) return str; return d.toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"numeric"}); }
  const d=new Date(str); if(isNaN(d)) return str;
  return d.toLocaleDateString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"short",year:"numeric"}); };
const fmtDT = s => { if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return s;
  return d.toLocaleString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
/* Para exportar a Excel: los campos "Fecha..." mezclan dos formas (una fecha
   pura de un input type=date, ej. "2026-08-11", y una fecha con hora de
   nowISO(), ej. "2026-08-11T19:32:00.000Z"). Antes se exportaba el valor
   crudo tal cual: una columna salía en UTC (hora corrida respecto a Ecuador)
   y otra como texto ISO sin formato — cada fecha se veía "diferente". Esta
   función homologa: fecha pura → solo día (sin forzar zona horaria, para no
   correrla un día), fecha con hora → día+hora en horario de Ecuador. */
function fmtCampoExport(v){
  if(v==null || v==="") return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s);
  const d=new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleString("es-EC",{timeZone:TZ_EC,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
/* Aplica fmtCampoExport a toda columna cuyo nombre contenga "Fecha", para

function formatFechasExport(rows){
  return (rows||[]).map(r=>{ const o={...r};
    Object.keys(o).forEach(k=>{ if(/Fecha/.test(k)) o[k]=fmtCampoExport(o[k]); });
    return o; });
}

/* Identificador único, en texto.
   El esquema original (Date.now()%100000 y sumar 1) repetía la semilla cada 100
   segundos: dos equipos que abrían la app con esa diferencia generaban los mismos
   ids, y uno terminaba sobrescribiendo los registros del otro sin aviso.
   Un número tampoco alcanza: por encima de 2^53 se pierde precisión, así que solo
   quedan 3 dígitos libres por milisegundo (1000 valores) y en ráfaga colisiona.
   Con texto se combinan tres cosas y la unicidad queda garantizada:
     - el milisegundo
     - 4 caracteres al azar, fijos por dispositivo y sesión
     - un contador que avanza dentro del mismo milisegundo
   Se usa solo [a-z0-9] para que también sirva como nombre de carpeta. */
const _gidDev = Math.random().toString(36).slice(2,6).padEnd(4,"0");
let _gidT = 0, _gidN = 0;
const gid = () => {
  const t = Date.now();
  if(t === _gidT) _gidN++; else { _gidT = t; _gidN = 0; }
  return t.toString(36) + _gidDev + _gidN.toString(36);
};

function comprimirImg(dataUrl,maxPx=900,q=0.75){
  return new Promise(res=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){const s=Math.min(maxPx/w,maxPx/h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>res(dataUrl); img.src=dataUrl; });
}

let msalApp=null, graphToken=null, graphUser="";

/* Token de Graph: se renueva solo. Antes se pedía una sola vez al abrir la app y,
   si la tablet quedaba encendida varias horas, el token vencía a media jornada.
   La app seguía marcando "En línea" (eso solo mira la red del wifi) pero cada
   envío fallaba con 401 y quedaba en la cola local sin que nadie se enterara
   por qué. Ahora gfetch detecta el 401, renueva el token solo y reintenta. */
let SESSION_EXPIRED=false;
async function refreshToken(){
  try{ await msInitApp(); const accs=msalApp.getAllAccounts(); if(!accs.length){ SESSION_EXPIRED=true; return false; }
    const r=await msalApp.acquireTokenSilent({scopes:MS_SCOPES,account:accs[0]});
    graphToken=r.accessToken; SESSION_EXPIRED=false; return true;
  }catch(e){ SESSION_EXPIRED=true; return false; }
}
/* Antes cada pantalla hacía "setRows(await Store.read(...))" sin try/catch: un
   401 por token vencido dejaba la lista vacía en silencio (pantallas "en blanco"
   como el caso de Mantenimiento/Mis tareas). Este helper reintenta una vez tras
   renovar el token y, si de verdad no hay forma de traer los datos, avisa en vez
   de quedarse callado. Se usa en todas las pantallas que cargan listas. */
async function cargarConReintento(leer, setter, toastFn, nombre){
  try{ setter(await leer()); return true; }
  catch(e){
    const ok = MODE==="graph" ? await refreshToken() : false;
    if(ok){ try{ setter(await leer()); return true; }catch(e2){} }
    if(toastFn) toastFn(`No se pudo cargar ${nombre||"la información"}. Toca "Reconectar Microsoft" arriba y vuelve a intentar. (${(e&&e.message)||e})`);
    return false;
  }
}
async function gfetch(path,method="GET",body=null,raw=false,headers=null,_retry){
  const h={Authorization:`Bearer ${graphToken}`};
  if(headers) Object.assign(h,headers);
  if(body && !(body instanceof ArrayBuffer)) h["Content-Type"]="application/json";
  else if(body instanceof ArrayBuffer) h["Content-Type"]="application/octet-stream";
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),30000);
  let r; try{ r=await fetch(GBASE+path,{method,headers:h,body:body?(body instanceof ArrayBuffer?body:JSON.stringify(body)):null,signal:ctrl.signal}); }
  catch(e){ clearTimeout(to); throw new Error("conexión: "+(e.name==="AbortError"?"tiempo de espera agotado":e.message)); }
  clearTimeout(to);
  if(r.status===204 || r.status===202){ SESSION_EXPIRED=false; return null; } // 202: sendMail aceptado, sin cuerpo
  if(r.status===401 && !_retry){ const ok=await refreshToken(); if(ok) return gfetch(path,method,body,raw,headers,true); }
  if(!r.ok){ let extra=""; try{ const j=await r.json(); extra=j.error&&j.error.message?(" — "+j.error.message):""; }catch{} throw new Error(method+" "+path.split("?")[0]+": "+r.status+extra); }
  SESSION_EXPIRED=false;
  if(raw) return r.arrayBuffer();
  const txt=await r.text(); return txt ? JSON.parse(txt) : null;
}

     archivo no existe (404) y lanza el error en cualquier otro caso (sin red,
     tiempo agotado, 429, 5xx, token aún no listo...). Así quien la usa puede
     distinguir "no hay configuración" de "no se pudo leer". */
  async readStrict(t){
    let buf;
    try{ buf=await gfetch(`/drives/${APP.ms.driveId}/root:/${this.fileName(t)}:/content`,"GET",null,true); }
    catch(e){ if(/: 404/.test(e.message||"")) return null; throw e; }
    return JSON.parse(new TextDecoder().decode(buf)); },
  async write(t,arr){
    const buf=new TextEncoder().encode(JSON.stringify(arr));

};

// Descubre el nombre INTERNO real de cada columna y asegura una columna de datos multilínea
async function spEnsureCols(site,lid,t){ if(SP_COLS[t]) return;
  let cols=[]; try{ const r=await gfetch(`/sites/${site}/lists/${lid}/columns?$select=id,name,displayName,text,readOnly,hidden,indexed`); cols=r.value||[]; }catch(e){}
  const findBy=pred=>cols.find(pred);
  // 1. columna de datos: busca "Data" (interno o visible); si no, cualquier multilínea editable; si no, la crea
  let dcol = findBy(c=>c.name==="Data") || findBy(c=>norm(c.displayName)==="data")
          || findBy(c=>c.text&&c.text.allowMultipleLines&&!c.readOnly&&!c.hidden&&c.name!=="Title");
  if(!dcol){ try{ const c=await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Data",text:{allowMultipleLines:true}}); dcol=c; }catch(e){} }
  SP_DCOL[t]=dcol?dcol.name:"Data";
  // 2. Fecha / Estado opcionales: usa el nombre interno real si existe; si no, intenta crear
  const fcol=findBy(c=>norm(c.displayName)==="fecha"||c.name==="Fecha");
  const ecol=findBy(c=>norm(c.displayName)==="estado"||c.name==="Estado");
  SP_COLS[t]={d:SP_DCOL[t], f:fcol?fcol.name:null, e:ecol?ecol.name:null};
  if(!fcol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Fecha",text:{},indexed:true}); SP_COLS[t].f="Fecha"; }catch(e){} }
  if(!ecol){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns`,"POST",{name:"Estado",text:{},indexed:true}); SP_COLS[t].e="Estado"; }catch(e){} }
  /* Si la columna Fecha/Estado ya existía sin indexar (listas creadas por versiones
     anteriores de esta app), el filtro server-side de readDesde/readRango cae al
     modo "no indexado": SharePoint puede rechazarlo cuando la lista crece (umbral
     de 5000 elementos), y el código termina descargando la lista COMPLETA para
     filtrar en el navegador. Se intenta indexar una sola vez; si falla (permisos,
     lista ya muy grande para indexar en caliente, etc.) se seguía como hasta ahora. */
  if(fcol && !fcol.indexed && fcol.id){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns/${fcol.id}`,"PATCH",{indexed:true}); }catch(e){} }
  if(ecol && !ecol.indexed && ecol.id){ try{ await gfetch(`/sites/${site}/lists/${lid}/columns/${ecol.id}`,"PATCH",{indexed:true}); }catch(e){} }
}

  SP_LISTNAMES=(all.value||[]).map(l=>l.displayName);
  let hit=(all.value||[]).find(l=>l.displayName===name||l.name===name)
        ||(all.value||[]).find(l=>norm(l.displayName)===norm(name)||norm(l.name)===norm(name));
  if(hit){ SP_LIST[t]=hit.id; await spEnsureCols(site,hit.id,t); return hit.id; }
  try{ const created=await gfetch(`/sites/${site}/lists`,"POST",{displayName:name,
      columns:[{name:"Data",text:{allowMultipleLines:true}},{name:"Fecha",text:{}},{name:"Estado",text:{}}],
      list:{template:"genericList"}}); SP_LIST[t]=created.id; await spEnsureCols(site,created.id,t); return created.id;
  }catch(e){ throw new Error(`No encontré la lista "${name}". Existentes: ${SP_LISTNAMES.join(", ")||"(ninguna)"}. Crea esa lista o renómbrala.`); } }
function spMerge(t,items){ const dcol=SP_DCOL[t]||"Data"; const map=SP_MAP[t]||new Map();
  items.forEach(it=>{ const d=it.fields&&it.fields[dcol]; if(!d) return; let rec; try{rec=JSON.parse(d);}catch{return;}
    map.set(rec.id,{spId:it.id,hash:d}); }); SP_MAP[t]=map; }
async function spPages(t,query){ const site=await spSite(); const lid=await spEnsureList(t);
  let url=`/sites/${site}/lists/${lid}/items?$expand=fields&$top=500${query?("&"+query):""}`;
  const items=[]; while(url){ const page=await gfetch(url.replace(GBASE,""),"GET",null,false,PREFER_NX);
    (page.value||[]).forEach(x=>items.push(x)); url=page["@odata.nextLink"]||null; } return items; }
function spParse(t,items){ const dcol=SP_DCOL[t]||"Data";

/* Caché en memoria de la lista completa por tabla. Antes, CADA aprobación/cambio
   (ver colaAplicarCambio) volvía a descargar y parsear la lista ENTERA de SharePoint
   solo para ubicar un registro — con el histórico de meses de ILD eso significaba
   varias páginas de 500 ítems por cada botón "Aprobar", y por eso ama de llaves veía
   la app pesada y las aprobaciones se quedaban pendientes (timeout / reintento).
   Ahora se guarda la última lectura completa un rato corto: si dos acciones ocurren
   seguidas (aprobar varios ILD uno tras otro) solo la primera pega a la red. */
const SP_ITEMS={}; const SP_LIST_TTL_MS=45000;
function spCacheSet(t,items){ SP_ITEMS[t]={items,ts:Date.now()}; }
function spCacheGet(t){ const c=SP_ITEMS[t]; if(!c) return null;
  return (Date.now()-c.ts)<SP_LIST_TTL_MS ? c.items : null; }
function spCachePut(t,rec){ const c=SP_ITEMS[t]; if(!c) return;
  const i=c.items.findIndex(x=>x.id===rec.id); if(i>=0) c.items[i]=rec; else c.items=[rec,...c.items]; c.ts=Date.now(); }
const ListStore={
  async read(t,opts){ const fresh=opts&&opts.noCache;
    if(!fresh){ const cached=spCacheGet(t); if(cached) return cached; }

const Store = {
  read(t,opts){ if(MODE!=="graph") return Local.read(t); return LIST_TABLES.includes(t)?ListStore.read(t,opts):GraphStore.read(t); },
  write(t,a){ if(MODE!=="graph") return Local.write(t,a); return LIST_TABLES.includes(t)?ListStore.write(t,a):GraphStore.write(t,a); },
  /* Trae/guarda UN registro sin pasar por la lista completa (ver ListStore.readOne
     / writeOne más arriba). En modo local o para las tablas que aún viven en un
     único JSON (GraphStore) no hay ganancia posible — ahí sí hace falta el arreglo
     entero — así que se resuelve igual que antes. */
  async readOne(t,id,codigo){ if(MODE!=="graph"){ const a=Local.read(t); return a.find(x=>x.id===id)||(codigo?a.find(x=>x.Codigo===codigo):null); }
    if(LIST_TABLES.includes(t)) return ListStore.readOne(t,id,codigo);
    const a=await GraphStore.read(t); return a.find(x=>x.id===id)||(codigo?a.find(x=>x.Codigo===codigo):null); },
  async writeOne(t,rec){ if(MODE!=="graph"){ const a=Local.read(t); const i=a.findIndex(x=>x.id===rec.id);
      if(i>=0) a[i]=rec; else a.unshift(rec); Local.write(t,a); return; }
    if(LIST_TABLES.includes(t)) return ListStore.writeOne(t,rec);
    const a=await GraphStore.read(t); const i=a.findIndex(x=>x.id===rec.id);
    if(i>=0) a[i]=rec; else a.unshift(rec); await GraphStore.write(t,a); },
  async remove(t,id){ if(MODE!=="graph"){ const a=Local.read(t); Local.write(t,a.filter(x=>(x.id||x.Codigo)!==id)); return; }
    if(LIST_TABLES.includes(t)) return ListStore.remove(t,id);
    const a=await GraphStore.read(t); await GraphStore.write(t,a.filter(x=>(x.id||x.Codigo)!==id)); },
  async readDesde(t,since){ if(MODE!=="graph") return Local.read(t).filter(r=>recFecha(r)>=since);
    return LIST_TABLES.includes(t)?ListStore.readDesde(t,since):(await GraphStore.read(t)).filter(r=>recFecha(r)>=since); },
  /* Pendientes de ANTES de "antesDe" (ver ListStore.readPendientes): para que la
     "vigencia" de una bandeja no oculte una aprobación que quedó olvidada. */
  async readPendientesAntiguos(t,antesDe){ if(MODE!=="graph") return Local.read(t).filter(r=>recEstado(r)==="Pendiente"&&recFecha(r)<antesDe);
    return LIST_TABLES.includes(t)?ListStore.readPendientes(t,antesDe):(await GraphStore.read(t)).filter(r=>recEstado(r)==="Pendiente"&&recFecha(r)<antesDe); },
  async readMes(t,y,m){ const s=`${y}-${String(m+1).padStart(2,'0')}-01`; const e=m===11?`${y+1}-01-01`:`${y}-${String(m+2).padStart(2,'0')}-01`;
    if(MODE!=="graph") return Local.read(t).filter(r=>recFecha(r)>=s&&recFecha(r)<e);
    return LIST_TABLES.includes(t)?ListStore.readRango(t,s,e):(await GraphStore.read(t)).filter(r=>recFecha(r)>=s&&recFecha(r)<e); },
  async readAnio(t,y){ const s=`${y}-01-01`,e=`${y+1}-01-01`;
    if(MODE!=="graph") return Local.read(t).filter(r=>recFecha(r)>=s&&recFecha(r)<e);
    return LIST_TABLES.includes(t)?ListStore.readRango(t,s,e):(await GraphStore.read(t)).filter(r=>recFecha(r)>=s&&recFecha(r)<e); }
};

async function subirFotos(fotos,carpetaId,prefijo){
  if(MODE!=="graph") return fotos.map((d,i)=>({nombre:`${prefijo}_${i+1}.jpg`,data:d}));
  try{ await GraphStore.ensureCarpeta(carpetaId); }catch(e){}
  return Promise.all(fotos.map(async(d,i)=>{ const nombre=`${prefijo}_${i+1}.jpg`;
    try{ return await GraphStore.putFoto(d,nombre,carpetaId); }catch(e){ return {nombre,error:true}; } }));
}
async function addNotif(para,texto,ildId,codigo){
  if(!para) return;
  try{ const arr=await Store.read("Notif");
    arr.push({id:gid(),para,texto,ildId,codigo,fecha:nowISO()});
    await Store.write("Notif",arr); }catch(e){}
}

async function subirCotiz(dataUrl,carpetaId,codigo){
  const isPdf=/^data:application\/pdf/i.test(dataUrl||"");
  const nombre=`${codigo}_cotizacion.${isPdf?"pdf":"jpg"}`; const tipo=isPdf?"pdf":"img";
  if(MODE!=="graph") return {tipo,nombre,data:dataUrl};
  try{ await GraphStore.ensureCarpeta(carpetaId); }catch(e){}
  try{ const r=await GraphStore.putFoto(dataUrl,nombre,carpetaId); return {tipo,nombre,path:r.path}; }
  catch(e){ return {tipo,nombre,error:true}; }
}
async function abrirCotiz(cot){ if(!cot) return;
  try{ let url=cot.data||"";
    if(!url && cot.path && MODE==="graph"){ const buf=await gfetch(`/drives/${APP.ms.driveId}/root:/${cot.path}:/content`,"GET",null,true);
      url=URL.createObjectURL(new Blob([buf],{type:cot.tipo==="pdf"?"application/pdf":"image/jpeg"})); }
    if(url) window.open(url,"_blank"); else alert("La cotización no está disponible.");
  }catch(e){ alert("No se pudo abrir la cotización."); }
}

const MAIL_SCOPE=["https://graph.microsoft.com/Mail.Send"];
async function msInitApp(){
  if(msalApp) return;
  msalApp=new msal.PublicClientApplication({auth:{clientId:APP.ms.clientId,
    authority:`https://login.microsoftonline.com/${APP.ms.tenantId}`,redirectUri:APP.ms.redirectUri},
    cache:{cacheLocation:"localStorage"}});
  await msalApp.initialize();
}
async function setGraphUser(acc){ if(acc) graphUser=acc.username||acc.name||graphUser;
  try{ const me=await gfetch("/me"); graphUser=me.mail||me.userPrincipalName||graphUser; }catch{} }
// Al cargar: recupera token (de una redirección de vuelta o de sesión previa). No abre nada.
async function msEnsure(){
  if(typeof msal==="undefined"){ msErr="No se cargó MSAL (la red bloqueó la CDN)."; return false; }
  try{ await msInitApp();
    let resp=null; try{ resp=await msalApp.handleRedirectPromise(); }catch(e){ msErr=e.errorMessage||e.message||String(e); }
    if(resp && resp.accessToken){ graphToken=resp.accessToken; await setGraphUser(resp.account); return true; }
    const accs=msalApp.getAllAccounts();
    if(accs.length){ try{ const r=await msalApp.acquireTokenSilent({scopes:MS_SCOPES,account:accs[0]});
      graphToken=r.accessToken; await setGraphUser(accs[0]); return true; }catch(e){} }
  }catch(e){ msErr=e.errorMessage||e.message||String(e); }
  return false;
}
// Inicia sesión por redirección (debe llamarse desde un clic). Navega a Microsoft y vuelve.
async function msSignIn(){ msErr=""; await msInitApp(); await msalApp.loginRedirect({scopes:MS_SCOPES}); }
async function msSignOut(){ try{ await msInitApp(); const a=msalApp.getAllAccounts()[0];
    await msalApp.logoutRedirect({account:a, postLogoutRedirectUri:APP.ms.redirectUri}); }catch(e){ location.reload(); } }

function Icon({name,size=22,style,cls}){ const p=ICONS[name]; if(!p) return null;
  return <svg className={cls} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style} dangerouslySetInnerHTML={{__html:p}}/>; }


function Field({label,req,children,hint}){
  return <div className="field"><label>{label} {req&&<span className="req">*</span>}</label>{children}
    {hint&&<div className="hint">{hint}</div>}</div>;
}

function Modal({title,onClose,children,wide}){
  return <div className="ovl" onClick={onClose}>
    <div className={"modal"+(wide?" wide":"")} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <h3 style={{margin:0}}>{title}</h3>
        <button className="iconbtn" style={{background:"#eee",color:"#333"}} onClick={onClose}><Icon name="x" size={15}/></button>
      </div>{children}</div></div>;
}

function Login({onLogin}){
  const [step,setStep]=useState("choice"); // choice | pin | libre
  /* "Ingresar con PIN" en esta app queda restringido a Desarrollador,
     Gerencia General y Antonio Puga (único responsable de Merma) — el resto
     de jefaturas del hotel (Comercial, Mantenimiento, Ama de Llaves,
     Compras) no tiene ninguna función dentro de Inventario A&B, así que no
     aparecen aquí aunque sí tengan PIN en la app principal del hotel. */
  const pinUsers=USERS.filter(u=>u.pin && ['dev','g1','a1'].includes(u.id));
  /* Esta app (Inventario A&B) es de uso exclusivo del equipo de bodegas: la
     lista "Soy colaborador" solo muestra a quienes tienen acceso a Inventario
     (marca inv:true, o dado desde Configurar → tieneAccesoInventario), no al
     personal completo del hotel (Recepción, Mantenimiento, Ama de Llaves,
     etc.), aunque comparta el mismo padrón de usuarios que la app principal. */
  const colabs=USERS.filter(u=>u.rol==='colaborador' && tieneAccesoInventario(u)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const [name,setName]=useState(""); const [pin,setPin]=useState(""); const [err,setErr]=useState("");
  const press=d=>{ setErr(""); setPin(p=> p.length<4 ? p+d : p); };
  useEffect(()=>{ if(step==='pin'&&pin.length===4){
    const u=pinUsers.find(x=>x.nombre===name&&x.pin===pin);
    if(u){ setTimeout(()=>onLogin(u),120); } else { setErr("PIN incorrecto"); setTimeout(()=>setPin(""),450); }
  }},[pin]);
  return <div className="login">
    <div className="sun"></div><div className="wave"></div>
    <div className="lcard">
      <div className="loginlogo" style={{display:"flex",alignItems:"center",justifyContent:"center",height:64}}><span style={{fontSize:40}}>🏝️</span></div>
      <div className="ltag">Gestión operativa del hotel</div>

      {step==="choice" && <div className="lchoice">
        <button className="lbig pri" onClick={()=>{setStep("pin");setName(pinUsers[0]?.nombre||"");setPin("");setErr("");}}>
          <span className="e" style={{background:"var(--ocean)"}}><Icon name="lock" size={22}/></span>
          <span><span className="tt">Ingresar con PIN</span><span className="dd">Jefaturas · Aprobadores · Gerencia</span></span></button>
        <button className="lbig" onClick={()=>{setStep("libre");setName("");setErr("");}}>
          <span className="e" style={{background:"var(--coral)"}}><Icon name="user" size={22}/></span>
          <span><span className="tt">Soy colaborador</span><span className="dd">Sin PIN — solo elige tu nombre</span></span></button>
      </div>}

      {step==="pin" && <div>
        <select className="lsel" value={name} onChange={e=>{setName(e.target.value);setPin("");setErr("");}}>
          {pinUsers.map(u=><option key={u.id} value={u.nombre}>{u.nombre}</option>)}</select>
        <div className="ldots">{[0,1,2,3].map(i=><i key={i} className={i<pin.length?"f":""}/>)}</div>
        <div className="lpad">
          {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} onClick={()=>press(""+n)}>{n}</button>)}
          <button className="fn" onClick={()=>setPin(p=>p.slice(0,-1))}>Borrar</button>
          <button onClick={()=>press("0")}>0</button>
          <button className="fn" onClick={()=>setPin("")}>Limpiar</button>
        </div>
        <div className="lerr">{err}</div>
        <button className="lback" onClick={()=>{setStep("choice");setPin("");setErr("");}}><Icon name="chevronLeft" size={15} style={{marginRight:6}}/>Volver</button>
      </div>}

      {step==="libre" && <div>
        <select className="lsel" value={name} onChange={e=>{setName(e.target.value);setErr("");}}>
          <option value="">Selecciona tu nombre…</option>
          {colabs.map(u=><option key={u.id} value={u.nombre}>{u.nombre}</option>)}</select>
        <button className="btn primary block" onClick={()=>{ const u=colabs.find(x=>x.nombre===name);
          if(!u){setErr("Selecciona tu nombre");return;} onLogin(u); }}>Entrar</button>
        <div className="lerr">{err}</div>
        <button className="lback" onClick={()=>{setStep("choice");setErr("");}}><Icon name="chevronLeft" size={15} style={{marginRight:6}}/>Volver</button>
      </div>}
    </div>
    <div className="lfoot">{APP.versionShort}</div>
  </div>;
}

/* El histórico de agosto que antes venía incrustado aquí (INV_SEED_HISTORICO +
   invImportarHistorico) se quitó: se volvía a importar solo cada vez que alguien
   abría la app, así que borrar el historial nunca era definitivo. Ahora el
   inventario arranca vacío y solo contiene lo que se registre en la app. */

let INV_CFG = {version:1, bodegas:[], accesos:{}, accesosServicio:{}, accesosReporte:{}, accesoInventario:{}, permisos:{},
  alertas:{activo:true, correo:"", umbralMermaPct:15, umbralConsumoPct:40}};
/* Gerencia/Desarrollador y quien tenga permiso de Merma (hoy: Jefe de
   Operaciones / Antonio Puga) ven TODAS las bodegas automáticamente — la
   merma se registra a diario en cada una, así que no depende de que alguien
   con acceso a Configurar le asigne bodegas una por una. */
const inventarioBodegasDe = u => !u ? [] : ((esGD(u)||esMerma(u)) ? (INV_CFG.bodegas||[]).map(b=>b.codigo)
  : ((INV_CFG.accesos && INV_CFG.accesos[u.nombre]) || []));
/* Acceso separado para personal de SERVICIO (meseros): solo ven la pantalla
   de PAX por comida, nunca el conteo de inventario. Gerencia/Desarrollador
   también ven todas las bodegas aquí (para supervisar), igual que en accesos. */
const inventarioBodegasServicioDe = u => !u ? [] : (esGD(u) ? (INV_CFG.bodegas||[]).map(b=>b.codigo)
  : ((INV_CFG.accesosServicio && INV_CFG.accesosServicio[u.nombre]) || []));
/* Quién puede ver el Resumen Gerencial / reporte de cierre de TODAS las
   bodegas (sólo lectura: traslados, merma, consumo, promedio, PAX). Es una
   lista aparte y explícita (no "todo aprobador ve todo") porque este reporte
   expone datos de consumo de todas las bodegas de A&B — sólo debe verla la
   jefatura que la necesita (ej. Jefe de Operaciones), no cualquier cuenta de
   jefatura del hotel (Mantenimiento, Ama de Llaves, etc.). Gerencia y
   Desarrollador siempre la ven, sin necesidad de estar en esta lista. */
const esReportero = u => !!(u && INV_CFG.accesosReporte && INV_CFG.accesosReporte[u.nombre]);
/* Acceso a Inventario dado desde el panel de Configurar (Desarrollador), sin
   necesidad de tocar código: se suma al de la marca "inv:true" que ya trae
   el usuario desde el padrón general del hotel. Así, dar de alta a alguien
   nuevo en Inventario es un clic en Configurar, no un cambio de código. */
const tieneAccesoInventario = u => !!(u && (u.inv || (INV_CFG.accesoInventario && INV_CFG.accesoInventario[u.nombre])));
/* ===== Permisos de pantalla, con valores por defecto según el rol =====
   Desarrollador ve todo. Gerencia General, por defecto, SOLO ve la pestaña
   de Desviaciones (no el detalle operativo de cada bodega ni Configurar).
   Desde Configurar, el Desarrollador puede dar u quitar, persona por
   persona, el acceso a Resumen Gerencial / Desviaciones / Configurar —
   estas excepciones quedan en INV_CFG.permisos y ganan siempre al valor
   por defecto del rol. */
function permisoDefecto(u, clave){
  if(!u) return false;
  if(clave==='configurar') return esDev(u);
  if(clave==='resumen') return esDev(u) || esReportero(u);
  if(clave==='desviaciones') return esDev(u) || u.rol==='gerencia';
  if(clave==='costos') return esDev(u) || u.rol==='gerencia' || esReportero(u);
  return false;
}
function tienePermiso(u, clave){
  const p = u && INV_CFG.permisos && INV_CFG.permisos[u.nombre];
  return (p && clave in p) ? !!p[clave] : permisoDefecto(u, clave);
}
function invBodega(codigo){ return (INV_CFG.bodegas||[]).find(b=>b.codigo===codigo); }
/* Antes, si la lectura de la configuración fallaba por cualquier motivo
   (red lenta, límite de Microsoft, token aún no listo), se trataba como "no
   hay configuración" y al abrir la app se volvía a cargar el catálogo de
   ejemplo (INV_SEED_BODEGAS) ENCIMA del real — por eso las bodegas volvían
   solas a la lista vieja de productos. Ahora:
   - invCfgRead lanza error si no pudo leer, y devuelve null SOLO si el
     archivo de configuración no existe todavía.
   - invCfgSave se niega a guardar si otro dispositivo guardó una versión más
     nueva desde que esta pestaña la cargó (campo "rev"), para que una pestaña
     vieja abierta no pise los cambios. */
let INV_CFG_REV_BASE = null;
async function invCfgRead(){
  if(MODE!=="graph"){ const c=Local.read("Inventario_Config"); return (!c||Array.isArray(c))?null:c; }
  const c = await GraphStore.readStrict("Inventario_Config");
  if(!c || Array.isArray(c)) return null; return c; }
/* Todos deben trabajar con el MISMO catálogo. La configuración se leía una sola
   vez al abrir la app: quien la tuviera abierta desde temprano seguía con la
   lista vieja de productos y, al abrir un día, la "sincronizaba" con esa lista
   vieja (volvían a aparecer productos quitados o desaparecían los nuevos).
   Ahora, antes de abrir o crear un día, se trae la versión vigente. */
let INV_CFG_REFRESCADA_EN = 0;
async function invCfgRefrescar(forzar){
  if(MODE!=="graph") return true;
  if(!forzar && Date.now()-INV_CFG_REFRESCADA_EN < 20000) return INV_CFG_REV_BASE!==null;
  try{ const remota = await invCfgRead();
    if(remota && (INV_CFG_REV_BASE===null || (+remota.rev||0)!==INV_CFG_REV_BASE)) applyInvConfig(remota);
    INV_CFG_REFRESCADA_EN = Date.now(); return INV_CFG_REV_BASE!==null;
  }catch(e){ return false; } }
/* Los guardados de configuración van en fila (uno después de otro): con varios
   clics seguidos en Accesos, dos guardados a la vez se estorbaban. */
let INV_CFG_SAVE_Q = Promise.resolve();
function invCfgSave(){ const run=()=>invCfgSaveUno(); const p=INV_CFG_SAVE_Q.then(run, run); INV_CFG_SAVE_Q=p.catch(()=>{}); return p; }
async function invCfgSaveUno(){
  if(MODE==="graph"){
    const remota = await invCfgRead(); // si no se puede leer, no se guarda (lanza el error)
    const revRemota = remota ? (+remota.rev||0) : 0;
    // Tampoco se guarda si esta pestaña nunca llegó a leer la configuración real.
    if(remota && (INV_CFG_REV_BASE===null || revRemota!==INV_CFG_REV_BASE))
      throw new Error("La configuración fue cambiada desde otro dispositivo o pestaña. Recarga la app (Ctrl+Shift+R) y vuelve a hacer el cambio.");
    INV_CFG.rev = revRemota+1;
  }
  await Store.write("Inventario_Config", INV_CFG);
  INV_CFG_REV_BASE = +INV_CFG.rev||0; }
function applyInvConfig(cfg){ if(!cfg) return;
  INV_CFG_REV_BASE = +cfg.rev||0;
  if(Array.isArray(cfg.bodegas)) INV_CFG.bodegas=cfg.bodegas;
  if(cfg.costos) INV_CFG.costos=cfg.costos;
  if(cfg.accesos) INV_CFG.accesos=cfg.accesos;
  if(cfg.accesosServicio) INV_CFG.accesosServicio=cfg.accesosServicio;
  if(cfg.accesosReporte) INV_CFG.accesosReporte=cfg.accesosReporte;
  if(cfg.accesoInventario) INV_CFG.accesoInventario=cfg.accesoInventario;
  if(cfg.permisos) INV_CFG.permisos=cfg.permisos;
  if(cfg.alertas) INV_CFG.alertas={...INV_CFG.alertas, ...cfg.alertas}; }

function invComputeConsumo(it){ const ini=+it.inicial||0, tp=+it.tp||0, tn=+it.tn||0, me=+it.merma||0;
  const fin = it.final===null||it.final===""||it.final===undefined ? null : +it.final;
  if(fin===null) return null;
  return ini+tp-tn-me-fin; }
/* Lo disponible del día: inicial + traslados − merma. Mientras no se escriba la
   "Cantidad final", se muestra esto como cantidad final (igual que en el Excel:
   si no hubo consumo, lo que queda es lo que había) y el consumo sale en 0. */
function invDisponible(it){ return (+it.inicial||0)+(+it.tp||0)-(+it.tn||0)-(+it.merma||0); }
function invFinalVacio(it){ return it.final===null||it.final===""||it.final===undefined; }
/* Ordena los productos de un día según la lista de la bodega (Configurar):
   así cualquier pantalla y cualquier persona ve el mismo orden. Los "(item
   nuevo)" de traslados van al final. */
function invOrdenCatalogo(bodega, arr, get){
  get = get || (x=>x);
  const cat = ((invBodega(bodega)||{}).productos)||[];
  const pos = it => { if(it.soloDia) return 1e6; const i=cat.findIndex(p=>(p.codigo||"")===(it.codigo||"") && p.nombre===it.nombre);
    if(i>=0) return i; const j=cat.findIndex(p=>p.nombre===it.nombre); return j>=0 ? j : 5e5; };
  return arr.map((x,k)=>({x,k,p:pos(get(x))})).sort((a,b)=>a.p-b.p||a.k-b.k).map(o=>o.x);
}
function invFinalVista(it){ return invFinalVacio(it) ? invDisponible(it) : +it.final; }
function invConsumoVista(it){ return invFinalVacio(it) ? 0 : invComputeConsumo(it); }
function invFmt(n){ if(n===null||n===undefined||n==="") return "—";
  const v=+n; if(isNaN(v)) return "—"; return (Math.round(v*100)/100).toString(); }
const INV_SERVICIOS_SUGERIDAS = ["Desayuno","Almuerzo","Cena"];
const INV_BODEGAS_BEBIDAS = ["08","15"]; // Sunset Bar Bebidas, Bar Villamar
function invEsBebidas(bodega){ return !!(bodega && (bodega.esBebidas || INV_BODEGAS_BEBIDAS.includes(bodega.codigo))); }
const INV_BODEGAS_SOLO_AC = ["07"]; // Chiringuito Cocina (snacks): solo quienes almuerzan y cenan
function invSoloAlmuerzoCena(bodega){ return invEsBebidas(bodega) || !!(bodega && INV_BODEGAS_SOLO_AC.includes(bodega.codigo)); }
function invServiciosDisponibles(bodega){ return invSoloAlmuerzoCena(bodega) ? ["Almuerzo","Cena"] : INV_SERVICIOS_SUGERIDAS; }
/* Las bodegas de bebidas solo tienen Almuerzo y Cena. Antes, el selector
   mostraba "Almuerzo" pero guardaba "Desayuno" (valor inicial fuera de la
   lista). Se valida al guardar y, lo ya guardado como Desayuno en una bodega
   de bebidas, se muestra y se vuelve a guardar como Almuerzo. */
function invServicioValido(bodega, nombre){ const o=invServiciosDisponibles(bodega); return o.includes(nombre)?nombre:o[0]; }
function invNombreServicio(bodega, nombre){ return (invEsBebidas(bodega) && nombre==="Desayuno") ? "Almuerzo" : nombre; }
function invNormServicios(bodega, servicios){ return (servicios||[]).map(x=>({...x, nombre:invNombreServicio(bodega, x.nombre)})); }
function invTotalPax(rec){ return (rec.servicios||[]).reduce((s,x)=>s+(+x.adultos||0)+(+x.ninos||0),0); }
function invComputePromedio(consumo,pax){ if(consumo===null||consumo===undefined||!pax) return null; return consumo/pax; }

/* Costo del día según Gerencia General (13/10/2026):
   - Gasto del día = consumo + merma (la merma NO se descuenta: es gasto del día).
   - Hotel (todo incluido): cada bodega se divide para sus PAX (personas
     atendidas registradas en el servicio). Chiringuito solo registra almuerzo
     y cena. El costo por PAX real del día es la SUMA de los costos por PAX
     de cada bodega (lo que consume una persona en comida + snacks + bebidas).
   - La Almeja Playera (Almeja Playera Cocina y Bar Villamar) va en un
     apartado aparte: costo / tickets (ticket promedio); no se suma ni se
     promedia con el hotel. */
const INV_BODEGAS_RESTAURANTE = ["06","15"];
function invEsRestaurante(b){ return !!(b && (b.esRestaurante || INV_BODEGAS_RESTAURANTE.includes(b.codigo))); }
function invResumenCostos(datos){
  const fila = x => { const g = x.c ? x.c.consumo + x.c.merma : null, pax = x.c ? x.c.pax : 0;
    return {...x, gasto:g, pax, cpp:(g!==null && pax) ? g/pax : null}; };
  const hotel = (datos||[]).filter(x=>!invEsRestaurante(x.b)).map(fila);
  const rest = (datos||[]).filter(x=>invEsRestaurante(x.b)).map(fila);
  const sum = (a,k) => a.reduce((s,x)=>s+(x[k]||0),0);
  return {hotel, rest, totHotel:{gasto:sum(hotel,"gasto"), cpp:sum(hotel,"cpp")}, totRest:{gasto:sum(rest,"gasto"), tickets:sum(rest,"pax")}};
}
function invDinero(n){ if(n===null||n===undefined||isNaN(+n)) return "—"; const v=Math.round((+n)*100)/100; return (v<0?"-$":"$")+Math.abs(v).toFixed(2); }
/* Desviaciones: SOLO consumo negativo (la cantidad final es mayor que lo que
   había disponible). Es lo único que de verdad indica un error de conteo o de
   traslado. Merma alta y consumo atípico ya no se reportan. Se calcula siempre
   desde los productos del día, así una corrección posterior la quita sola. */
function invDesviacionesDe(rec){
  const out=[];
  for(const it of ((rec&&rec.items)||[])){
    const consumo = invComputeConsumo(it);
    // Solo cuenta si sigue siendo negativo redondeado a 2 decimales (evita "-0" por decimales).
    if(consumo===null || Math.round(consumo*100)/100 >= 0) continue;
    out.push({codigo:it.codigo, nombre:it.nombre, tipo:"consumo_negativo", consumo,
      detalle:`Consumo negativo (${invFmt(consumo)}): inicial ${invFmt(it.inicial)} + traslados ${invFmt(it.tp)} − ${invFmt(it.tn)} − merma ${invFmt(it.merma)} da ${invFmt(invDisponible(it))}, pero la cantidad final registrada es ${invFmt(it.final)}. Revisar conteo o traslados.`});
  }
  return out;
}
function invDetectarDesviaciones(rec){ return invDesviacionesDe(rec); }

async function invEnviarAlertaDesviaciones(rec, desviaciones){
  const cfg = INV_CFG.alertas||{};
  if(!cfg.activo || !cfg.correo || !desviaciones.length) return {enviado:false};
  try{
    await gfetch("/me/sendMail","POST",{message:{
      subject:`⚠️ Desviación de inventario — ${rec.bodegaNombre} — ${rec.fecha}`,
      body:{contentType:"HTML", content:invEmailDesviaciones(rec,desviaciones)},
      toRecipients:[{emailAddress:{address:cfg.correo}}]
    }, saveToSentItems:true});
    return {enviado:true};
  }catch(e){ return {enviado:false, error:e.message||String(e)}; }
}

/* ===== Reporte diario de las 10:00am =====
   A partir de las 10:00 (hora Ecuador) se manda UNA vez al día, al correo de
   Configurar → Alertas, el resumen del día anterior por bodega: si se cerró,
   quién hizo el conteo, quién registró el PAX, quién aprobó, ajustes y
   desviaciones. La app es una página web (no un servidor), así que el envío lo
   hace la primera sesión abierta después de las 10:00; para que no salga
   repetido desde dos dispositivos, primero se marca el día como enviado en la
   configuración (con el control de versión de invCfgSave) y solo quien logra
   guardar esa marca envía el correo. */
/* ¿Se registraron traslados de Zeus en la bodega ese día?
   "Sí"                 → la bodega tiene traslados aplicados (o productos con traslados +/−).
   "No"                 → ese día sí se cargaron traslados de Zeus (en otras bodegas), pero a esta no le tocó ninguno.
   "No fueron cargados" → ese día no se cargó ningún traslado de Zeus en ninguna bodega. */
function invTieneTraslados(r){ return !!r && ((Array.isArray(r.trasladosAplicados) && r.trasladosAplicados.length>0) || (r.items||[]).some(it=>(+it.tp||0)!==0 || (+it.tn||0)!==0)); }
function invEstadoTraslados(r, regsDelDia){
  if(invTieneTraslados(r)) return "Sí";
  return (regsDelDia||[]).some(invTieneTraslados) ? "No" : "No fueron cargados";
}

async function invEnviarReporteDiario(prueba){

  const cfgRemota = await invCfgRead(); if(!cfgRemota) return {enviado:false};
  applyInvConfig(cfgRemota);

  const ayer = sumaDiasYMD(hoyISO(),-1);
  const para = invDestinatarios(al.correo10!=null ? al.correo10 : "estrategia@playaparaiso.com.ec");
  if(!prueba){
    if(al.activo===false || !para.length || al.ultimoReporteDiario===ayer) return {enviado:false};
    // 1) marcar como enviado (si otro dispositivo se adelantó, invCfgSave falla y aquí se detiene)
    INV_CFG.alertas = {...al, ultimoReporteDiario:ayer};
    await invCfgSave();
  }
  // 2) armar y enviar
  const regs = invSinDuplicados((await Store.read("Inventario",{noCache:true})).filter(r=>r.fecha===ayer));
  let totalCosto = 0;
  const filas = (INV_CFG.bodegas||[]).map(b=>{
    const r = regs.find(x=>x.bodega===b.codigo);
    if(!r) return {bodega:b.nombre, estado:"Sin registro", responsable:"—", pax:"—", traslados:"—", aprobado:"—", notas:"No se tomó inventario ese día."};
    const quienesPax = [...new Set((r.servicios||[]).map(s=>s.registradoPor).filter(Boolean))].join(", ");
    return {bodega:b.nombre,
      estado: r.cerrado ? `Cerrado por ${r.cerradoPor||"—"} (${fmtDT(r.cerradoEn)})` : "Sin cerrar",
      responsable: r.responsable||"—",
      pax: `${invTotalPax(r)}${quienesPax?` — ${quienesPax}`:""}`,
      traslados: invEstadoTraslados(r, regs),
      costo: (()=>{ const c=invCostosDia(r); totalCosto+=c.consumo+c.merma; return invDinero(c.consumo+c.merma)+(c.sinCosto.length?` (${c.sinCosto.length} sin costo)`:""); })(),
      aprobado: r.aprobado===true ? `${r.aprobadoPor||"—"}` : (r.cerrado ? "Pendiente" : "—"),
      notas: [r.notaLimite||"", (r.ajustes||[]).length?`Ajustado por ${[...new Set(r.ajustes.map(a=>a.por))].join(", ")}`:"",
              invDesviacionesDe(r).length?`${invDesviacionesDe(r).length} producto(s) con consumo negativo`:""].filter(Boolean).join(" · ")||"—"};
  });
  await gfetch("/me/sendMail","POST",{message:{
    subject: prueba ? `${prueba.asunto} — resumen de gestión (10:00) del ${ayer}` : `Inventario A&B — resumen de gestión del ${ayer}`,
    body:{contentType:"HTML", content:(filas.totalCosto=invDinero(totalCosto), invEmailReporteDiario(ayer, filas))},
    toRecipients: prueba ? invDestinatarios(prueba.para) : para
  }, saveToSentItems:true});
  return {enviado:true};
}
