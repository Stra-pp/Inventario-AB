/* Acceso a Inventario dado desde el panel de Configurar (Desarrollador), sin
   necesidad de tocar código: se suma al de la marca "inv:true" que ya trae
   el usuario desde el padrón general del hotel. Así, dar de alta a alguien
   nuevo en Inventario es un clic en Configurar, no un cambio de código. */
const tieneAccesoInventario = u => !!(u && (u.inv || (INV_CFG.accesoInventario && INV_CFG.accesoInventario[u.nombre])));
/* ===== Permisos de pantalla, con valores por defecto según el rol =====
   Desarrollador ve todo. Gerencia General, por defecto, SOLO ve la pestaña
   de Desviaciones (no el detalle operativo de cada bodega ni Configurar).
   Desde Configurar, el Desarrollador puede dar u quitar, persona por
   persona, el acceso a Resumen Gerencial / Desviaciones / Configurar —
   estas excepciones quedan en INV_CFG.permisos y ganan siempre al valor
   por defecto del rol. */
function permisoDefecto(u, clave){
  if(!u) return false;
  if(clave==='configurar') return esDev(u);
  if(clave==='resumen') return esDev(u) || esReportero(u);
  if(clave==='desviaciones') return esDev(u) || u.rol==='gerencia';
  return false;
}
function tienePermiso(u, clave){
  const p = u && INV_CFG.permisos && INV_CFG.permisos[u.nombre];
  return (p && clave in p) ? !!p[clave] : permisoDefecto(u, clave);
}
function invBodega(codigo){ return (INV_CFG.bodegas||[]).find(b=>b.codigo===codigo); }
async function invCfgRead(){ let c; try{ c=await Store.read("Inventario_Config"); }catch{ c=null; }
  if(!c || Array.isArray(c)) return null; return c; }
async function invCfgSave(){ await Store.write("Inventario_Config", INV_CFG); }
function applyInvConfig(cfg){ if(!cfg) return;
  if(Array.isArray(cfg.bodegas)) INV_CFG.bodegas=cfg.bodegas;
  if(cfg.accesos) INV_CFG.accesos=cfg.accesos;
  if(cfg.accesosServicio) INV_CFG.accesosServicio=cfg.accesosServicio;
  if(cfg.accesosReporte) INV_CFG.accesosReporte=cfg.accesosReporte;
  if(cfg.accesoInventario) INV_CFG.accesoInventario=cfg.accesoInventario;
  if(cfg.permisos) INV_CFG.permisos=cfg.permisos;
  if(cfg.alertas) INV_CFG.alertas={...INV_CFG.alertas, ...cfg.alertas}; }

function invComputeConsumo(it){ const ini=+it.inicial||0, tp=+it.tp||0, tn=+it.tn||0, me=+it.merma||0;
  const fin = it.final===null||it.final===""||it.final===undefined ? null : +it.final;
  if(fin===null) return null;
  return ini+tp-tn-me-fin; }
function invFmt(n){ if(n===null||n===undefined||n==="") return "—";
  const v=+n; if(isNaN(v)) return "—"; return (Math.round(v*100)/100).toString(); }
const INV_SERVICIOS_SUGERIDAS = ["Desayuno","Almuerzo","Cena"];
const INV_BODEGAS_BEBIDAS = ["08","09","15"]; // Sunset Bar Bebidas, Deck Paraíso, Bar Villamar
function invEsBebidas(bodega){ return !!(bodega && (bodega.esBebidas || INV_BODEGAS_BEBIDAS.includes(bodega.codigo))); }
function invServiciosDisponibles(bodega){ return invEsBebidas(bodega) ? ["Almuerzo","Cena"] : INV_SERVICIOS_SUGERIDAS; }
function invTotalPax(rec){ return (rec.servicios||[]).reduce((s,x)=>s+(+x.adultos||0)+(+x.ninos||0),0); }
function invComputePromedio(consumo,pax){ if(consumo===null||consumo===undefined||!pax) return null; return consumo/pax; }

/* ===== Desviaciones y alerta a Gerencia General =====
   Al CERRAR un día se revisa cada producto contra tres señales, todas
   calculables con lo que ya se llena en el cierre (no requiere costo unitario
   ni receta estándar — eso podría afinar esto más adelante, ver nota en el
   informe):
   1) Consumo negativo: inicial+entradas-merma-final < 0 — físicamente
      imposible (implica que "quedó más de lo que debía quedar"), casi
      siempre un error de conteo/tecleo o un movimiento no registrado.
   2) Merma alta: la merma del día supera el umbral configurado (% sobre
      inicial+traslados entrantes) — para pescados/mariscos/carnes esto
      importa mucho más que en un producto no perecedero.
   3) Consumo atípico: el consumo por PAX de hoy se aleja del promedio de los
      últimos cierres reales de ese mismo producto en esa bodega, más allá del
      umbral configurado — requiere al menos 3 cierres previos con PAX>0 para
      no disparar falsos positivos con poco historial. */
function invDetectarDesviaciones(rec, historialCerrados, cfg){
  const umbralMerma = +((cfg&&cfg.umbralMermaPct)||15);
  const umbralConsumo = +((cfg&&cfg.umbralConsumoPct)||40);
  const pax = invTotalPax(rec);
  const out = [];
  for(const it of (rec.items||[])){
    const consumo = invComputeConsumo(it);
    if(consumo===null) continue; // producto sin "cantidad final" — nada que evaluar
    const entradas = (+it.inicial||0) + (+it.tp||0);
    if(consumo < -0.001){
      out.push({codigo:it.codigo, nombre:it.nombre, tipo:"consumo_negativo",
        detalle:`El cálculo da consumo negativo (${invFmt(consumo)}): con inicial ${invFmt(it.inicial)}, traslados +${invFmt(it.tp)}/−${invFmt(it.tn)} y merma ${invFmt(it.merma)}, la cantidad final (${invFmt(it.final)}) no puede ser mayor a lo que había disponible. Revisar conteo.`});
      continue;
    }
    const merma = +it.merma||0;
    if(merma>0 && entradas>0){
      const mermaPct = merma/entradas*100;
      if(mermaPct >= umbralMerma){
        out.push({codigo:it.codigo, nombre:it.nombre, tipo:"merma_alta",
          detalle:`Merma de ${invFmt(merma)} (${invFmt(mermaPct)}% de lo disponible) — supera el umbral configurado (${invFmt(umbralMerma)}%).`});
      }
    }
    if(pax>0){
      const promedioHoy = consumo/pax;
      const previos = [];
      for(const r of historialCerrados){
        const p = invTotalPax(r); if(!p) continue;
        const prevIt = (r.items||[]).find(x=>x.codigo===it.codigo);
        if(!prevIt) continue;
        const c = invComputeConsumo(prevIt); if(c===null) continue;
        previos.push(c/p);
        if(previos.length>=8) break; // suficiente con los últimos 8 cierres reales
      }
      if(previos.length>=3){
        const avg = previos.reduce((s,x)=>s+x,0)/previos.length;
        const base = Math.max(Math.abs(avg), 0.05); // evita dividir por ~0 en productos casi sin consumo
        const desvPct = Math.abs(promedioHoy-avg)/base*100;
        if(desvPct >= umbralConsumo){
          out.push({codigo:it.codigo, nombre:it.nombre, tipo:"consumo_atipico",
            detalle:`Consumo por PAX de hoy (${invFmt(promedioHoy)}) se desvía ${invFmt(desvPct)}% del promedio de los últimos ${previos.length} cierres (${invFmt(avg)}) — supera el umbral configurado (${invFmt(umbralConsumo)}%).`});
        }
      }
    }
  }
  return out;
}
function invEmailDesviaciones(rec, desviaciones){
  const filas = desviaciones.map(d=>`<tr><td style="padding:4px 8px;border-bottom:1px solid #e5e0d5"><b>${d.nombre}</b><br><span style="color:#8a8578;font-size:12px">#${d.codigo}</span></td>
    <td style="padding:4px 8px;border-bottom:1px solid #e5e0d5;font-size:13px">${d.detalle}</td></tr>`).join("");
  const html = `<div style="font-family:Arial,sans-serif;font-size:14px;color:#2a2a2a">
    <p>Se detectaron desviaciones al cerrar el inventario de <b>${rec.bodegaNombre}</b> del día <b>${rec.fecha}</b> (responsable: ${rec.responsable||"—"}).</p>
    <table style="border-collapse:collapse;width:100%;max-width:640px"><thead><tr>
      <th style="text-align:left;padding:4px 8px;border-bottom:2px solid #2a6f77">Producto</th>
      <th style="text-align:left;padding:4px 8px;border-bottom:2px solid #2a6f77">Desviación</th></tr></thead>
      <tbody>${filas}</tbody></table>
    <p style="color:#8a8578;font-size:12px;margin-top:14px">Notificación automática de Inventario A&amp;B. Los umbrales que la disparan se pueden ajustar en Configurar.</p>
  </div>`;
  return html;
}
async function invEnviarAlertaDesviaciones(rec, desviaciones){
  const cfg = INV_CFG.alertas||{};
  if(!cfg.activo || !cfg.correo || !desviaciones.length) return {enviado:false};
  try{
    await gfetch("/me/sendMail","POST",{message:{
      subject:`⚠️ Desviación de inventario — ${rec.bodegaNombre} — ${rec.fecha}`,
      body:{contentType:"HTML", content:invEmailDesviaciones(rec,desviaciones)},
      toRecipients:[{emailAddress:{address:cfg.correo}}]
    }, saveToSentItems:true});
    return {enviado:true};
  }catch(e){ return {enviado:false, error:e.message||String(e)}; }
}

async function invRegistrosDe(codigo){
  const all = await Store.read("Inventario");
  return all.filter(r=>r.bodega===codigo).sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
}
/* Abre (o recupera) el registro de HOY para una bodega. Si no existe, lo crea
   llevando el "Cantidad final" del último día CERRADO como "Inicial" de cada
   producto — la misma regla que ya usan en la Bitácora de Excel: el inventario
   final de un día es el inicial (el real consumido) del día siguiente. */
async function invAbrirHoy(codigo, user){
  const hoy = hoyISO();
  const regs = await invRegistrosDe(codigo);
  const deHoy = regs.find(r=>r.fecha===hoy);
  if(deHoy) return deHoy;
  const bod = invBodega(codigo);
  const ultimoCerrado = regs.find(r=>r.cerrado);
  const base = (bod && bod.productos) || [];
  const items = base.map(p=>{
    const prev = ultimoCerrado && (ultimoCerrado.items||[]).find(x=>x.codigo===p.codigo);
    return {codigo:p.codigo, nombre:p.nombre, unidad:p.unidad||"", inicial: prev ? (+prev.final||0) : 0, tp:0, tn:0, merma:0, final:null};
  });
  const rec = {id:gid(), bodega:codigo, bodegaNombre:bod?bod.nombre:codigo, fecha:hoy, responsable:user.nombre,
    items, servicios:[], cerrado:false, creadoPor:user.nombre, creadoEn:nowISO()};
  await Store.writeOne("Inventario", rec);
  return rec;
}

/* ===== Traslados automáticos (Zeus) =====
   La tarea programada de las 8am lee los PDF de "Traslados" del día anterior
   y llama a invAplicarTraslado por cada línea que toque una bodega de A&B.
   Bodega DESTINO del traslado → Traslados (+) [entra]. Bodega ORIGEN → Traslados (−)
   [sale]. Coincide con la fórmula: consumo = inicial + (+) − (−) − merma − final.
   Si el código de producto no existe todavía en el catálogo de esa bodega, se
   crea automáticamente marcado "nuevo" para que alguien lo revise después.
   Escribe directamente aunque el día ya esté cerrado (es un ajuste autorizado
   del sistema, no una edición manual) y si el registro del día no existe
   todavía lo crea, para no perder el movimiento. */
function invMatchBodegaZeus(nombreZeus){
  if(!nombreZeus) return null;
  const norm = s => s.toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quita tildes
    .replace(/^BODEGA\s+(DE\s+)?/,"").replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
  const n = norm(nombreZeus);
  const bod = (INV_CFG.bodegas||[]).find(b=> norm(b.nombre)===n || norm(b.zeusNombre||"")===n);
  return bod ? bod.codigo : null;
}
async function invAsegurarProducto(codigoBodega, codigo, nombre, unidad){
  const bod = invBodega(codigoBodega); if(!bod) return null;
  bod.productos = bod.productos||[];
  let p = bod.productos.find(x=>x.codigo===codigo);
  if(!p){
    p = {codigo, nombre: (nombre||codigo)+" (NUEVO — revisar)", unidad: unidad||"", nuevo:true, nuevoDesde: hoyISO()};
    bod.productos.push(p);
    await invCfgSave();
  }
  return p;
}
async function invAplicarTraslado({codigoBodega, fecha, codigo, nombre, unidad, cantidad, signo}){
  const bod = invBodega(codigoBodega); if(!bod) return {ok:false, motivo:"bodega A&B no encontrada: "+codigoBodega};
  if(!codigo) return {ok:false, motivo:"traslado sin código de producto (se registra siempre por código, nunca por nombre)"};
  await invAsegurarProducto(codigoBodega, codigo, nombre, unidad);
  const regs = await invRegistrosDe(codigoBodega);
  let rec = regs.find(r=>r.fecha===fecha);
  let registroNuevo=false;
  if(!rec){
    const base=(bod.productos||[]);
    const items=base.map(p=>({codigo:p.codigo,nombre:p.nombre,unidad:p.unidad||"",inicial:0,tp:0,tn:0,merma:0,final:null}));
    rec = {id:gid(), bodega:codigoBodega, bodegaNombre:bod.nombre, fecha, responsable:"",
      items, servicios:[], cerrado:false, creadoPor:"Traslados (auto)", creadoEn:nowISO()};
    registroNuevo=true;
  }
  const items = rec.items.slice();
  let i = items.findIndex(x=>x.codigo===codigo);
  if(i<0){ items.push({codigo, nombre: nombre||codigo, unidad: unidad||"", inicial:0, tp:0, tn:0, merma:0, final:null}); i=items.length-1; }
  const it = {...items[i]};
  const cant = Math.round((+cantidad||0)*1000)/1000;
  if(signo>0) it.tp = Math.round(((+it.tp||0)+cant)*1000)/1000;
  else it.tn = Math.round(((+it.tn||0)+cant)*1000)/1000;
  items[i] = it;
  const toSave = {...rec, items};
  await Store.writeOne("Inventario", toSave);
  return {ok:true, registroNuevo};
}
/* Aplica un lote de traslados ya extraídos de los PDF de Zeus (uno por línea
   x lado, ya separados en entradas/salidas por invClasificarTraslado más abajo).
   Devuelve un resumen para mandarle a la usuaria (aplicados, nuevos productos,
   fuera de alcance). */
async function invAplicarLoteTraslados(lote){
  const resumen = {aplicados:[], nuevosProductos:[], fueraDeAlcance:[], errores:[]};
  for(const t of lote){
    if(!t.codigoBodega){ resumen.fueraDeAlcance.push(t); continue; }
    const bod = invBodega(t.codigoBodega);
    const yaExistia = bod && (bod.productos||[]).some(p=>p.codigo===t.codigo);
    try{
      const r = await invAplicarTraslado(t);
      if(r.ok){
        resumen.aplicados.push({...t, registroNuevo:r.registroNuevo});
        if(!yaExistia) resumen.nuevosProductos.push({bodega:t.codigoBodega, codigo:t.codigo, nombre:t.nombre});
      } else resumen.errores.push({...t, motivo:r.motivo});
    }catch(e){ resumen.errores.push({...t, motivo:e.message||String(e)}); }
  }
  return resumen;
}
/* Recibe las filas crudas ya extraídas de los PDF de Zeus (una por línea de
   traslado; cantidad siempre positiva, con nombres de bodega tal cual salen
   del PDF) y las convierte en líneas con signo para invAplicarLoteTraslados:
   bodega DESTINO → (+), bodega ORIGEN → (−). Las bodegas centrales que no se
   controlan en esta app (Bodega de Alimentos, Bodega Bebidas, etc.) no
   coinciden con ninguna de las 8 bodegas configuradas → simplemente no se
   genera esa línea (no es un error). Si NINGÚN lado coincide, la fila entera
   se reporta como fuera de alcance para que la tarea programada la muestre
   en su resumen (nunca se adivina una bodega ambigua). */
function invClasificarTraslado(row){
  const codDestino = invMatchBodegaZeus(row.bodegaDestino);
  const codOrigen = invMatchBodegaZeus(row.bodegaOrigen);
  const lineas = [];
  if(codDestino) lineas.push({codigoBodega:codDestino, fecha:row.fecha, codigo:row.codigo, nombre:row.nombre,
    unidad:row.unidad, cantidad:row.cantidad, signo:1, trasladoN:row.trasladoN, origen:row.bodegaOrigen, destino:row.bodegaDestino});
  if(codOrigen) lineas.push({codigoBodega:codOrigen, fecha:row.fecha, codigo:row.codigo, nombre:row.nombre,
    unidad:row.unidad, cantidad:row.cantidad, signo:-1, trasladoN:row.trasladoN, origen:row.bodegaOrigen, destino:row.bodegaDestino});
  return {lineas, fueraDeAlcance: !codDestino && !codOrigen};
}
async function invAplicarLoteZeus(rows){
  const lote = [], sinMatch = [];
  for(const row of rows){
    if(!row.codigo){ sinMatch.push({...row, motivo:"sin código de producto (se ignora — nunca se registra por nombre)"}); continue; }
    const {lineas, fueraDeAlcance} = invClasificarTraslado(row);
    if(fueraDeAlcance){ sinMatch.push({...row, motivo:`ninguna bodega A&B coincide (origen: "${row.bodegaOrigen}", destino: "${row.bodegaDestino}")`}); continue; }
    lote.push(...lineas);
  }
  const resumen = await invAplicarLoteTraslados(lote);
  resumen.sinMatch = sinMatch;
  return resumen;
}

/* ===== Pantalla: Cierre del día =====
   modo "completo": vista de siempre (Gerencia/Desarrollador) — todas las
     columnas editables + panel de PAX, para supervisión/pruebas.
   modo "cocina": vista de cocina/bar — sólo Inventario inicial (fijo) e
     Inventario final (lo único que llenan), ordenado con lo que tiene
     inventario arriba y lo que está en cero abajo. Sin merma, sin traslados
     (eso ya lo llena solo la tarea de las 8am), sin panel de PAX (eso es de
     servicio). */
function InventarioCierre({user,toast,modo}){
  const completo = modo!=="cocina";
  /* Antonio Puga (u otro colaborador con merma:true, sin ser Gerencia/
     Desarrollador) entra en modo "completo" solo para poder ver y llenar
     Merma; Traslados los deja de solo lectura porque ya los llena la
     automatización de Zeus. */
  const soloMerma = completo && !esGD(user);
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [rec,setRec]=useState(null);
  const [cargando,setCargando]=useState(true);
  const [q,setQ]=useState("");
  const [guardando,setGuardando]=useState(false);
  const [servNombre,setServNombre]=useState(INV_SERVICIOS_SUGERIDAS[0]);
  const [servAd,setServAd]=useState(""); const [servNi,setServNi]=useState("");
  useEffect(()=>{ if(!codigo){ setCargando(false); return; }
    setCargando(true);
    invAbrirHoy(codigo,user).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario de hoy: "+(e.message||e)); setCargando(false); });
  },[codigo]);
  if(!bodegas.length) return <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
    Todavía no tienes bodegas asignadas para el inventario.<br/>Pide al Desarrollador que te las asigne en Inventario · Configurar.</div>;
  if(cargando) return <div className="empty">Cargando…</div>;
  if(!rec) return null;
  const bodegaObj = invBodega(codigo);
  function setItem(i,patch){ setRec(r=>{ const items=r.items.slice(); items[i]={...items[i],...patch}; return {...r,items}; }); }
  function agregarServicio(){ const ad=+servAd||0, ni=+servNi||0;
    if(!ad&&!ni){ toast("Ingresa al menos adultos o niños."); return; }
    setRec(r=>({...r, servicios:[...(r.servicios||[]), {id:gid(), nombre:servNombre, adultos:ad, ninos:ni}]}));
    setServAd(""); setServNi(""); }
  function quitarServicio(id){ setRec(r=>({...r, servicios:(r.servicios||[]).filter(s=>s.id!==id)})); }
  const pax = invTotalPax(rec);
  const filtrados = rec.items.map((it,i)=>({it,i})).filter(({it})=> !q.trim() ||
    (it.nombre+" "+it.codigo).toLowerCase().indexOf(q.trim().toLowerCase())>-1);
  // Cocina: lo que tiene inventario inicial arriba, lo que está en cero abajo
  // (orden estable dentro de cada grupo, no se toca el orden guardado).
  const listados = completo ? filtrados
    : filtrados.slice().sort((a,b)=> ((+b.it.inicial||0)>0?1:0) - ((+a.it.inicial||0)>0?1:0));
  async function guardar(cerrar){
    const faltantes = rec.items.filter(it=>it.final===null||it.final==="").length;
    if(cerrar && faltantes>0){ if(!window.confirm(`${faltantes} producto(s) sin "Cantidad final". ¿Cerrar de todas formas?`)) return; }
    setGuardando(true);
    try{
      // El responsable del conteo es quien está registrando ahora mismo — no
      // se pide como campo aparte, se toma directo de la sesión.
      let toSave = {...rec, responsable:user.nombre, cerrado: cerrar?true:rec.cerrado, cerradoPor: cerrar?user.nombre:rec.cerradoPor, cerradoEn: cerrar?nowISO():rec.cerradoEn};
      if(cerrar){
        // Al cerrar: se detectan desviaciones contra el historial real de la
        // bodega y, si hay alguna, se guardan en el propio registro (para que
        // Historial las muestre después) y se avisa a Gerencia General por
        // correo (si está configurado y activo en Inventario · Configurar).
        const historial = (await invRegistrosDe(codigo)).filter(r=>r.cerrado && r.id!==toSave.id);
        const desv = invDetectarDesviaciones(toSave, historial, INV_CFG.alertas);
        toSave = {...toSave, desviaciones: desv};
        if(desv.length) invEnviarAlertaDesviaciones(toSave, desv); // no bloquea el cierre si falla
      }
      await Store.writeOne("Inventario", toSave);
      setRec(toSave);
      toast(cerrar?"Inventario del día cerrado.":"Guardado.");
    }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    setGuardando(false);
  }
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div><b>{rec.bodegaNombre}</b><div className="meta">{fmtDT(rec.fecha+"T00:00:00")==="—"?rec.fecha:rec.fecha}</div></div>
        {rec.cerrado
          ? <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}><Icon name="lock" size={13} style={{marginRight:4}}/>Cerrado por {rec.cerradoPor}</span>
          : <span className="pill" style={{background:"#fff3d6",color:"#8a6512"}}>Sin cerrar</span>}
      </div>
    </div>
    {rec.cerrado
      && <div className="hint" style={{marginBottom:12}}>Ya cerraste el inventario de hoy de esta bodega. Puedes verlo en la pestaña Historial. El de mañana se abrirá solo, llevando estas cantidades finales como inicial.</div>}
    {rec.cerrado && rec.desviaciones && rec.desviaciones.length>0 &&
      <div className="banner" style={{background:"#fdeceb",borderColor:"#e8b4ae",color:"#9a3324",flexDirection:"column",alignItems:"stretch",gap:6}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}><Icon name="alert" size={15}/><b>{rec.desviaciones.length} desviación(es) detectada(s) al cerrar — se avisó a Gerencia General.</b></div>
        {rec.desviaciones.map(d=><div key={d.codigo+d.tipo} style={{fontSize:12.5,paddingLeft:21}}><b>{d.nombre}</b> (#{d.codigo}): {d.detalle}</div>)}
      </div>}
    {completo && <div className="card" style={{marginBottom:12,padding:"12px 14px"}}>
      <div style={{fontWeight:700,fontSize:13.5,marginBottom:2}}>PAX por servicio</div>
      <div className="hint" style={{marginBottom:10}}>Adultos y niños atendidos hoy en esta bodega. Se usa para calcular el consumo promedio por persona.</div>
      {(rec.servicios||[]).length===0 && <div className="hint" style={{marginBottom:8}}>Aún no se ha registrado ningún servicio hoy.</div>}
      {(rec.servicios||[]).map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,background:"#f3efe6",borderRadius:10,padding:"7px 10px",marginBottom:6,fontSize:13}}>
        <div style={{fontWeight:700,flex:"1 1 auto"}}>{s.nombre}</div>
        <div>{s.adultos} adultos</div><div>{s.ninos} niños</div>
        {!rec.cerrado && <button className="btn ghost" style={{padding:"3px 8px",fontSize:12}} onClick={()=>quitarServicio(s.id)}>✕</button>}
      </div>)}
      {!rec.cerrado && <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
        <select className="inp" style={{width:150}} value={servNombre} onChange={e=>setServNombre(e.target.value)}>
          {invServiciosDisponibles(bodegaObj).map(s=><option key={s} value={s}>{s}</option>)}</select>
        <input className="inp" type="number" min="0" placeholder="Adultos" style={{width:90}} value={servAd} onChange={e=>setServAd(e.target.value)}/>
        <input className="inp" type="number" min="0" placeholder="Niños" style={{width:90}} value={servNi} onChange={e=>setServNi(e.target.value)}/>
        <button className="btn ghost" onClick={agregarServicio}>Agregar</button>
      </div>}
      <div className="hint" style={{marginTop:10}}>Total PAX hoy: <b style={{color:"var(--ink)"}}>{pax}</b></div>
    </div>}
    <div style={{maxWidth:340,marginBottom:10}}><input type="text" className="inp" placeholder="Buscar producto o código…"
      value={q} onChange={e=>setQ(e.target.value)}/></div>
    <div style={{display:"flex",alignItems:"center",fontSize:11.5,fontWeight:700,color:"var(--muted)",padding:"0 10px",gap:6,marginBottom:4}}>
      <div style={{flex:"1 1 auto",minWidth:0}}>Producto</div>
      <div style={{width:56,textAlign:"right"}}>Inicial</div>
      {completo && <>
        <div style={{width:56,textAlign:"right"}}>Trasl.+</div>
        <div style={{width:56,textAlign:"right"}}>Trasl.−</div>
        <div style={{width:56,textAlign:"right"}}>Merma</div>
      </>}
      <div style={{width:64,textAlign:"right"}}>Cant. final</div>
      {completo && <>
        <div style={{width:64,textAlign:"right"}}>Consumo</div>
        <div style={{width:60,textAlign:"right"}}>Promedio</div>
      </>}
    </div>
    {listados.map(({it,i})=>{ const cons=invComputeConsumo(it); const prom=invComputePromedio(cons,pax);
      return <div key={it.codigo} className="item" style={{display:"flex",alignItems:"center",padding:"9px 10px",gap:6}}>
        <div style={{flex:"1 1 auto",minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.nombre}{it.nuevo && <span className="pill" style={{marginLeft:6,background:"#fbe6e6",color:"#a83232",fontSize:10.5,padding:"1px 6px"}}>NUEVO</span>}</div>
          <div className="meta">#{it.codigo}</div>
        </div>
        <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.inicial)}</div>
        {completo && (rec.cerrado ? <>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.tp)}</div>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.tn)}</div>
          <div style={{width:56,textAlign:"right",fontSize:13}}>{invFmt(it.merma)}</div>
        </> : <>
          {soloMerma
            ? <div style={{width:56,textAlign:"right",fontSize:13}} title="Los traslados los llena automáticamente Zeus.">{invFmt(it.tp)}</div>
            : <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
                value={it.tp||""} onChange={e=>setItem(i,{tp:e.target.value===""?0:+e.target.value})}/>}
          {soloMerma
            ? <div style={{width:56,textAlign:"right",fontSize:13}} title="Los traslados los llena automáticamente Zeus.">{invFmt(it.tn)}</div>
            : <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
                value={it.tn||""} onChange={e=>setItem(i,{tn:e.target.value===""?0:+e.target.value})}/>}
          <input className="inp" type="number" inputMode="decimal" style={{width:56,textAlign:"right",padding:"5px 6px"}}
            value={it.merma||""} onChange={e=>setItem(i,{merma:e.target.value===""?0:+e.target.value})}/>
        </>)}
        {rec.cerrado ? <div style={{width:64,textAlign:"right",fontSize:13,fontWeight:700}}>{invFmt(it.final)}</div>
          : <input className="inp" type="number" inputMode="decimal" style={{width:64,textAlign:"right",padding:"5px 6px",fontWeight:700}}
              value={it.final===null?"":it.final} onChange={e=>setItem(i,{final:e.target.value===""?null:+e.target.value})}/>}
        {completo && <>
          <div style={{width:64,textAlign:"right",fontSize:13,fontWeight:700,color:"var(--ocean-d)"}}>{invFmt(cons)}</div>
          <div style={{width:60,textAlign:"right",fontSize:12.5,color:"var(--muted)"}}>{prom===null?"—":invFmt(prom)}</div>
        </>}
      </div>; })}
    {!listados.length && <div className="empty">Ningún producto coincide con la búsqueda.</div>}
    {!rec.cerrado && <div className="row" style={{marginTop:14,gap:10}}>
      <button className="btn ghost block" disabled={guardando} onClick={()=>guardar(false)}><Icon name="save" size={15} style={{marginRight:6}}/>Guardar avance</button>
      <button className="btn primary block" disabled={guardando} onClick={()=>guardar(true)}><Icon name="lock" size={15} style={{marginRight:6}}/>Cerrar inventario del día</button>
    </div>}
  </div>;
}

/* ===== Pantalla: Servicio (PAX por comida) =====
   Para meseros/personal de servicio: sólo registran cuántos adultos y niños
   atendieron por Desayuno/Almuerzo/Cena — nunca ven ni tocan el conteo de
   inventario. No depende de si cocina ya cerró el día: el PAX se puede
   seguir registrando aunque el inventario de esa bodega ya esté cerrado. */
function InventarioServicio({user,toast}){
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasServicioDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [rec,setRec]=useState(null);
  const [cargando,setCargando]=useState(true);
  const [guardando,setGuardando]=useState(false);
  const bodegaObj = invBodega(codigo);
  const opciones = invServiciosDisponibles(bodegaObj);
  const [servNombre,setServNombre]=useState(opciones[0]);
  const [servAd,setServAd]=useState(""); const [servNi,setServNi]=useState("");
  useEffect(()=>{ if(!codigo){ setCargando(false); return; }
    setCargando(true);
    invAbrirHoy(codigo,user).then(r=>{ setRec(JSON.parse(JSON.stringify(r))); setCargando(false); })
      .catch(e=>{ toast("No se pudo abrir el inventario de hoy: "+(e.message||e)); setCargando(false); });
  },[codigo]);
  useEffect(()=>{ setServNombre(opciones[0]); },[codigo]);
  if(!bodegas.length) return <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
    Todavía no tienes bodegas asignadas para registrar PAX.<br/>Pide al Desarrollador que te las asigne en Inventario · Configurar.</div>;
  if(cargando) return <div className="empty">Cargando…</div>;
  if(!rec) return null;
  async function guardarServicios(servicios){
    setGuardando(true);
    try{
      const toSave = {...rec, servicios};
      await Store.writeOne("Inventario", toSave);
      setRec(toSave);
      toast("PAX guardado.");
    }catch(e){ toast("No se pudo guardar: "+(e.message||e)); }
    setGuardando(false);
  }
  function agregarServicio(){ const ad=+servAd||0, ni=+servNi||0;
    if(!ad&&!ni){ toast("Ingresa al menos adultos o niños."); return; }
    guardarServicios([...(rec.servicios||[]), {id:gid(), nombre:servNombre, adultos:ad, ninos:ni, registradoPor:user.nombre}]);
    setServAd(""); setServNi(""); }
  function quitarServicio(id){ guardarServicios((rec.servicios||[]).filter(s=>s.id!==id)); }
  const pax = invTotalPax(rec);
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div><b>{rec.bodegaNombre}</b><div className="meta">{rec.fecha}</div></div>
        {rec.cerrado && <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}><Icon name="lock" size={13} style={{marginRight:4}}/>Inventario cerrado</span>}
      </div>
    </div>
    <div className="card" style={{padding:"12px 14px"}}>
      <div style={{fontWeight:700,fontSize:13.5,marginBottom:2}}>PAX por servicio</div>
      <div className="hint" style={{marginBottom:10}}>Adultos y niños atendidos hoy en esta bodega{invEsBebidas(bodegaObj)?" (Almuerzo y Cena)":" (Desayuno, Almuerzo y Cena)"}.</div>
      {(rec.servicios||[]).length===0 && <div className="hint" style={{marginBottom:8}}>Aún no se ha registrado ningún servicio hoy.</div>}
      {(rec.servicios||[]).map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,background:"#f3efe6",borderRadius:10,padding:"7px 10px",marginBottom:6,fontSize:13}}>
        <div style={{fontWeight:700,flex:"1 1 auto"}}>{s.nombre}</div>
        <div>{s.adultos} adultos</div><div>{s.ninos} niños</div>
        <button className="btn ghost" disabled={guardando} style={{padding:"3px 8px",fontSize:12}} onClick={()=>quitarServicio(s.id)}>✕</button>
      </div>)}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
        <select className="inp" style={{width:150}} value={servNombre} onChange={e=>setServNombre(e.target.value)}>
          {opciones.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <input className="inp" type="number" min="0" placeholder="Adultos" style={{width:90}} value={servAd} onChange={e=>setServAd(e.target.value)}/>
        <input className="inp" type="number" min="0" placeholder="Niños" style={{width:90}} value={servNi} onChange={e=>setServNi(e.target.value)}/>
        <button className="btn primary" disabled={guardando} onClick={agregarServicio}>Agregar</button>
      </div>
      <div className="hint" style={{marginTop:10}}>Total PAX hoy: <b style={{color:"var(--ink)"}}>{pax}</b></div>
    </div>
  </div>;
}

/* ===== Pantalla: Historial ===== */
function InventarioHistorial({user}){
  const bodegas = (INV_CFG.bodegas||[]).filter(b=>inventarioBodegasDe(user).includes(b.codigo));
  const [codigo,setCodigo]=useState(bodegas[0]?bodegas[0].codigo:"");
  const [regs,setRegs]=useState([]);
  const [ver,setVer]=useState(null);
  const [cargando,setCargando]=useState(true);
  useEffect(()=>{ if(!codigo){ setCargando(false); return; } setCargando(true);
    invRegistrosDe(codigo).then(r=>{ setRegs(r.filter(x=>x.cerrado)); setCargando(false); }).catch(()=>setCargando(false)); },[codigo]);
  if(!bodegas.length) return <div className="empty">No tienes bodegas asignadas.</div>;
  return <div>
    {bodegas.length>1 && <Field label="Bodega"><select className="inp" value={codigo} onChange={e=>setCodigo(e.target.value)}>
      {bodegas.map(b=><option key={b.codigo} value={b.codigo}>{b.nombre}</option>)}</select></Field>}
    {cargando && <div className="empty">Cargando…</div>}
    {!cargando && !regs.length && <div className="empty"><div className="e"><Icon name="calendar" size={44}/></div>Aún no hay días cerrados para esta bodega.</div>}
    {regs.map(r=><div key={r.id} className="item" style={{cursor:"pointer"}} onClick={()=>setVer(r)}>
      <div style={{display:"flex",justifyContent:"space-between",gap:8}}><b>{r.fecha}</b>
        <div style={{display:"flex",gap:6}}>
          {r.desviaciones && r.desviaciones.length>0 &&
            <span className="pill" style={{background:"#fdeceb",color:"#9a3324"}}><Icon name="alert" size={12} style={{marginRight:3}}/>{r.desviaciones.length} desviación(es)</span>}
          <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}>Cerrado</span>
        </div>
      </div>
      <div className="meta">Responsable: {r.responsable||"—"} · cerrado por {r.cerradoPor} · {fmtDT(r.cerradoEn)}</div>
    </div>)}
    {ver && <Modal title={`${ver.bodegaNombre} · ${ver.fecha}`} onClose={()=>setVer(null)}><InventarioDetalle r={ver} user={user}/></Modal>}
  </div>;
}
/* Detalle de un día cerrado. Para Gerencia/Desarrollador/Aprobador (jefaturas
   con acceso de supervisión — "completo") muestra el reporte estructurado
   completo: traslados, merma, consumo y promedio por producto, PAX por
   servicio, filtro "solo con movimiento" (traslados/merma/consumo ≠ 0 ese
   día) e impresión/PDF vía el diálogo de impresión del navegador. Para
   colaboradores de cocina (viendo su propio historial) se mantiene la vista
   simple de siempre: sólo producto y cantidad final, sin cifras de consumo,
   igual que en la pantalla de cierre del día. */
function InventarioDetalle({r,user}){
  const [q,setQ]=useState("");
  const [soloMov,setSoloMov]=useState(false);
  const completo = esGD(user) || esReportero(user);
  const pax = invTotalPax(r);
  const tieneMovimiento = it=>{ if((+it.tp||0)!==0||(+it.tn||0)!==0||(+it.merma||0)!==0) return true;
    const c=invComputeConsumo(it); return c!==null && c!==0; };
  const base=(r.items||[]).filter(it=>!q.trim()||(it.nombre+" "+it.codigo).toLowerCase().indexOf(q.trim().toLowerCase())>-1);
  const items = (completo && soloMov) ? base.filter(tieneMovimiento) : base;
  return <div className="inv-print">
    {completo && <div className="inv-noprint" style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      <button className={"btn ghost"+(soloMov?" on":"")} onClick={()=>setSoloMov(s=>!s)}>
        {soloMov?"Ver reporte completo":"Ver solo con movimiento"}</button>
      <button className="btn ghost" onClick={()=>window.print()}><Icon name="download" size={15} style={{marginRight:6}}/>Imprimir / Guardar PDF</button>
    </div>}
    <div style={{marginBottom:10}}>
      <div style={{fontWeight:800,fontSize:16}}>{r.bodegaNombre} <span style={{fontWeight:400,color:"var(--muted)",fontSize:13}}>#{r.bodega}</span></div>
      <div className="meta">Fecha: <b>{r.fecha}</b></div>
      <div className="meta">Responsable del conteo: <b>{r.responsable||"—"}</b></div>
      <div className="meta">Cerrado por <b>{r.cerradoPor||"—"}</b> el {fmtDT(r.cerradoEn)}</div>
    </div>
    {completo && <div className="card" style={{marginBottom:12,padding:"10px 14px"}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>PAX por servicio — total del día: {pax}</div>
      {(r.servicios||[]).length===0 && <div className="hint">Sin registros de PAX ese día.</div>}
      {(r.servicios||[]).map(s=><div key={s.id} style={{display:"flex",gap:10,fontSize:13,padding:"2px 0"}}>
        <div style={{flex:"1 1 auto",fontWeight:700}}>{s.nombre}</div>
        <div>{s.adultos} adultos</div><div>{s.ninos} niños</div>
      </div>)}
    </div>}
    <input type="text" className="inp inv-noprint" placeholder="Buscar producto o código…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
    {completo && soloMov && <div className="hint" style={{marginBottom:8}}>Mostrando sólo productos con traslados, merma o consumo distinto de cero ese día.</div>}
    <div style={{display:"flex",fontSize:11,fontWeight:700,color:"var(--muted)",padding:"0 2px",marginBottom:4,borderBottom:"1px solid var(--line)"}}>
      <div style={{flex:"1 1 auto"}}>Producto</div>
      <div style={{width:56,textAlign:"right"}}>Inicial</div>
      {completo && <>
        <div style={{width:56,textAlign:"right"}}>Trasl.+</div>
        <div style={{width:56,textAlign:"right"}}>Trasl.−</div>
        <div style={{width:56,textAlign:"right"}}>Merma</div>
      </>}
      <div style={{width:56,textAlign:"right"}}>Final</div>
      {completo && <>
        <div style={{width:64,textAlign:"right"}}>Consumo</div>
        <div style={{width:60,textAlign:"right"}}>Promedio</div>
      </>}
    </div>
    <div style={{maxHeight:completo?"none":420,overflowY:completo?"visible":"auto"}}>
      {items.map(it=>{ const cons=invComputeConsumo(it); const prom=invComputePromedio(cons,pax);
        return <div key={it.codigo} style={{display:"flex",alignItems:"center",padding:"6px 2px",borderBottom:"1px solid var(--line)",fontSize:12.5}}>
          <div style={{flex:"1 1 auto",minWidth:0}}>
            <div style={{fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.nombre}{it.nuevo && <span className="pill" style={{marginLeft:6,background:"#fbe6e6",color:"#a83232",fontSize:9.5,padding:"1px 5px"}}>NUEVO</span>}</div>
            <div className="meta" style={{fontSize:10.5}}>#{it.codigo}</div>
          </div>
          <div style={{width:56,textAlign:"right"}}>{invFmt(it.inicial)}</div>
          {completo && <>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.tp)}</div>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.tn)}</div>
            <div style={{width:56,textAlign:"right"}}>{invFmt(it.merma)}</div>
          </>}
          <div style={{width:56,textAlign:"right",fontWeight:700}}>{invFmt(it.final)}</div>
          {completo && <>
            <div style={{width:64,textAlign:"right",fontWeight:700,color:"var(--ocean-d)"}}>{invFmt(cons)}</div>
            <div style={{width:60,textAlign:"right",color:"var(--muted)"}}>{prom===null?"—":invFmt(prom)}</div>
          </>}
        </div>; })}
      {!items.length && <div className="empty">{(completo&&soloMov)?"Ningún producto tuvo movimiento ese día.":"Ningún producto coincide."}</div>}
    </div>
  </div>;
}

/* ===== Pantalla: Resumen Gerencial (solo Gerencia/Desarrollador) =====
   Responde directamente a "cómo quedó el inventario del día anterior":
   una fila por bodega con el último cierre, quién lo hizo y cuándo. */
function InventarioResumen({user}){
  const [filas,setFilas]=useState(null);
  const [ver,setVer]=useState(null);
  const [selFecha,setSelFecha]=useState({}); // bodega.codigo -> fecha elegida en el filtro
  useEffect(()=>{ (async()=>{
    const bodegas=INV_CFG.bodegas||[];
    const out=[];
    for(const b of bodegas){
      const regs=await invRegistrosDe(b.codigo); // todos los días de esta bodega, más reciente primero
      const ultimo=regs.find(r=>r.cerrado)||null;
      const hoy=regs.find(r=>r.fecha===hoyISO());
      out.push({bodega:b, regs, ultimo, hoy, cerradoHoy: !!(hoy&&hoy.cerrado)});
    }
    setFilas(out);
  })(); },[]);
  if(!filas) return <div className="empty">Cargando…</div>;
  if(!filas.length) return <div className="empty">Todavía no hay bodegas configuradas. Ve a Inventario · Configurar.</div>;
  return <div>
    <p className="sub">Último cierre registrado por bodega. Usa "Ver otro día" para revisar días anteriores, o abre el de hoy aunque todavía no esté concluido.</p>
    {filas.map(f=>{ const fechaSel = selFecha[f.bodega.codigo]||"";
      const regSel = fechaSel ? f.regs.find(r=>r.fecha===fechaSel) : null;
      return <div key={f.bodega.codigo} className="item">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
          <b>{f.bodega.nombre}</b>
          {f.cerradoHoy && <span className="pill" style={{background:"#e9f7f0",color:"var(--green)"}}>Hoy ya cerró</span>}
          {!f.cerradoHoy && f.ultimo && <span className="pill" style={{background:"#fff3d6",color:"#8a6512"}}>Hoy: pendiente</span>}
          {!f.ultimo && <span className="pill" style={{background:"#fbe6e6",color:"#a83232"}}>Sin registros aún</span>}
        </div>

          </select>
          {regSel && <button className="btn ghost" style={{padding:"4px 10px",fontSize:12.5}} onClick={()=>setVer(regSel)}>Ver</button>}
        </div>}
      </div>; })}
    {ver && <Modal title={`${ver.bodegaNombre} · ${ver.fecha}`} onClose={()=>setVer(null)}><InventarioDetalle r={ver} user={user}/></Modal>}
  </div>;
}

/* ===== Pantalla: Configurar (solo Desarrollador) ===== */
/* ===== Pantalla: Desviaciones (Gerencia General y Desarrollador) =====
   Es la única pantalla operativa que ve Gerencia General por defecto: desde
   aquí ajusta el correo/umbrales de alerta (antes vivía en Configurar) y
   revisa las desviaciones ya detectadas en los cierres de todas las
   bodegas, sin necesidad de entrar al detalle de cada una. */
function InventarioDesviaciones({user,toast}){
  const [,force]=useState(0); const re=()=>force(x=>x+1);
  const [filas,setFilas]=useState(null);
  useEffect(()=>{ (async()=>{
    const bodegas=INV_CFG.bodegas||[];
    const out=[];
    for(const b of bodegas){
      const regs=await invRegistrosDe(b.codigo);
      for(const r of regs){ if(r.cerrado && r.desviaciones && r.desviaciones.length){
        out.push({bodega:b.nombre, fecha:r.fecha, responsable:r.responsable, desviaciones:r.desviaciones}); } }
    }
    out.sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0);
    setFilas(out.slice(0,60));
  })(); },[]);
  const alertas = INV_CFG.alertas || {activo:true, correo:"", umbralMermaPct:15, umbralConsumoPct:40};
  const puedeConfigurarAlertas = tienePermiso(user,'configurar') || user.rol==='gerencia';
  async function guardar(){ try{ await invCfgSave(); toast("Configuración de alertas guardada."); }
    catch(e){ toast("No se pudo guardar: "+(e.message||e)); } }
  function setAlerta(patch){ INV_CFG.alertas = {...alertas, ...patch}; re(); guardar(); }
  return <div>
    <h3 style={{marginTop:0}}>Alertas de desviación a Gerencia General</h3>
    <p className="hint" style={{marginBottom:10}}>Al cerrar un día, la app revisa cada producto: consumo negativo (imposible, casi siempre error de conteo), merma por encima del umbral, y consumo por PAX muy distinto al promedio de los últimos cierres reales de ese producto. Si hay alguna, se manda un correo automático y también queda marcado aquí.</p>
    <div className="card" style={{marginBottom:16,padding:"12px 14px"}}>
      <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,cursor: puedeConfigurarAlertas?"pointer":"default",opacity:puedeConfigurarAlertas?1:.6}}>
        <input type="checkbox" disabled={!puedeConfigurarAlertas} checked={!!alertas.activo} onChange={e=>setAlerta({activo:e.target.checked})}/>
        <span>Activar notificaciones automáticas por correo</span>
      </label>
      <Field label="Correo de Gerencia General" hint="A esta dirección se envía el aviso cuando se detecta una desviación grande.">
        <input className="inp" type="email" disabled={!puedeConfigurarAlertas} placeholder="gerencia@playaparaiso.com.ec" value={alertas.correo||""}
          onChange={e=>setAlerta({correo:e.target.value})} onBlur={guardar}/>
      </Field>
      <div className="row" style={{gap:10,marginTop:10}}>
        <Field label="Umbral de merma anómala (%)" hint="% de lo disponible (inicial + traslados) que se considera merma alta.">
          <input className="inp" type="number" min="0" max="100" disabled={!puedeConfigurarAlertas} value={alertas.umbralMermaPct}
            onChange={e=>setAlerta({umbralMermaPct:+e.target.value||0})} onBlur={guardar}/>
        </Field>
        <Field label="Umbral de desviación de consumo (%)" hint="% de diferencia vs el promedio de los últimos cierres para marcar consumo atípico.">
          <input className="inp" type="number" min="0" max="200" disabled={!puedeConfigurarAlertas} value={alertas.umbralConsumoPct}
            onChange={e=>setAlerta({umbralConsumoPct:+e.target.value||0})} onBlur={guardar}/>
        </Field>
      </div>
      <div className="hint" style={{marginTop:10}}>El correo se envía usando la cuenta de Microsoft con la que se inició sesión en este dispositivo (necesita permiso "Mail.Send", ya solicitado al iniciar sesión). Si nadie ha iniciado sesión con Microsoft en este dispositivo todavía, el envío fallará silenciosamente — la desviación se seguirá viendo aquí de todas formas.</div>
    </div>
    <h3>Desviaciones detectadas</h3>
    {filas===null && <div className="empty">Cargando…</div>}
    {filas && !filas.length && <div className="empty">Todavía no se ha detectado ninguna desviación en los cierres registrados.</div>}
    {filas && filas.map((f,i)=><div key={i} className="card" style={{marginBottom:10,padding:"12px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
        <b>{f.bodega}</b><span className="meta">{f.fecha} · {f.responsable||"—"}</span>
      </div>
      {f.desviaciones.map(d=><div key={d.codigo+d.tipo} style={{fontSize:12.5,marginTop:6,paddingLeft:4,borderLeft:"3px solid #e8b4ae"}}>
        <b>{d.nombre}</b> (#{d.codigo}): {d.detalle}</div>)}
    </div>)}
  </div>;
}

/* ===== Módulo Inventario: contenedor con pestañas ===== */
function Inventario({user,toast}){
  const esGer = user.rol==='gerencia';
  const propias = inventarioBodegasDe(user);
  const propiasServicio = inventarioBodegasServicioDe(user);
  const modoCierre = (esGD(user) || esMerma(user)) ? "completo" : "cocina";
  const showCierre = !esGer && propias.length>0;
  const showServicio = !esGer && propiasServicio.length>0 && !esGD(user); // GD ya ve todo en modo completo
  const showHistorial = !esGer && propias.length>0;
  /* Resumen Gerencial también se abre para quien esté en INV_CFG.accesosReporte
     (jefaturas puntuales, ej. Antonio Puga): necesitan ver cómo cerró
     el día cada bodega sin poder editar nada — mismo reporte de sólo lectura
     que ve Gerencia, pero explícitamente concedido por Desarrollador en
     Configurar, no a cualquier cuenta de jefatura del hotel. */
  const showResumen = tienePermiso(user,'resumen');
  /* Gerencia General, por defecto, SOLO ve la pestaña de Desviaciones — no el
     detalle operativo (Cierre/Servicio/Historial/Resumen) ni Configurar. El
     Desarrollador sigue viendo todo. Ambos pueden ajustar aquí el correo y
     los umbrales de alerta. Cualquier excepción puntual (por ejemplo, que
     Gerencia también vea el Resumen) se da desde Configurar → "Qué puede ver
     cada uno", no cambiando este valor por defecto. */
  const showDesviaciones = tienePermiso(user,'desviaciones');
  const showConf = tienePermiso(user,'configurar');
  const [tab,setTab]=useState(showCierre?"cierre":showServicio?"servicio":showResumen?"resumen":showHistorial?"historial":showDesviaciones?"desviaciones":"conf");
  const sinNada = !showCierre && !showServicio && !showHistorial && !showResumen && !showDesviaciones && !showConf;
  return <div>
    <h1 className="h1">Inventario A&B</h1>
    <p className="sub">Cierre diario de bodegas y consumo real.</p>
    {sinNada && <div className="empty"><div className="e"><Icon name="box" size={44}/></div>
      Todavía no tienes ninguna bodega asignada.<br/>Pide al Desarrollador que entre con PIN 9999 → Inventario → Configurar, y te asigne una bodega ahí.</div>}
    {!sinNada && <div className="seg">
      {showCierre && <button className={tab==="cierre"?"on":""} onClick={()=>setTab("cierre")}>Cierre del día</button>}
      {showServicio && <button className={tab==="servicio"?"on":""} onClick={()=>setTab("servicio")}>PAX / Servicio</button>}
      {showHistorial && <button className={tab==="historial"?"on":""} onClick={()=>setTab("historial")}>Historial</button>}
      {showResumen && <button className={tab==="resumen"?"on":""} onClick={()=>setTab("resumen")}><Icon name="trendup" size={15} style={{marginRight:6}}/>Resumen Gerencial</button>}
      {showDesviaciones && <button className={tab==="desviaciones"?"on":""} onClick={()=>setTab("desviaciones")}><Icon name="bell" size={15} style={{marginRight:6}}/>Desviaciones</button>}
      {showConf && <button className={tab==="conf"?"on":""} onClick={()=>setTab("conf")}>Configurar</button>}
    </div>}
    {tab==="cierre" && showCierre && <InventarioCierre user={user} toast={toast} modo={modoCierre}/>}
    {tab==="servicio" && showServicio && <InventarioServicio user={user} toast={toast}/>}
    {tab==="historial" && showHistorial && <InventarioHistorial user={user}/>}
    {tab==="resumen" && showResumen && <InventarioResumen user={user}/>}
    {tab==="desviaciones" && showDesviaciones && <InventarioDesviaciones user={user} toast={toast}/>}
    {tab==="conf" && showConf && <InventarioConfig user={user} toast={toast}/>}
  </div>;
}

  const [connected,setConnected]=useState(MODE!=="graph");
  const [checking,setChecking]=useState(MODE==="graph");
  const [cfgVer,setCfgVer]=useState(0);
  const toast=m=>{ setToastMsg(m); const dur=/no se pudo|error|❌|403|falló/i.test(m)?8000:2600; setTimeout(()=>setToastMsg(""),dur); };
  useEffect(()=>{ (async()=>{
    if(MODE==="graph"){ const ok=await msEnsure(); setConnected(ok);
      if(ok){ try{ applyInvConfig(await invCfgRead());
          /* Si el catálogo de bodegas está vacío en SharePoint, se vuelve a
             cargar SIEMPRE (no depende de una marca en localStorage de este
             navegador) — así "empezar de cero" funciona igual sin importar
             desde qué dispositivo se abra la app primero. */
          if(!(INV_CFG.bodegas&&INV_CFG.bodegas.length)){
            INV_CFG.bodegas=INV_SEED_BODEGAS; await invCfgSave(); }
          await invImportarHistorico();
        }catch(e){}
        setCfgVer(v=>v+1);
      }
    }
    setChecking(false);
  })(); },[]);
  useEffect(()=>{ if(MODE!=="graph") return;
    const t=setInterval(async()=>{ const ok=await refreshToken(); if(ok) setConnected(true); }, 20*60*1000);
    return ()=>clearInterval(t);
  },[]);
  function onLogin(u){ sessionStorage.setItem("pp_inv_user",JSON.stringify(u)); setUser(u); }
  function logout(){ sessionStorage.removeItem("pp_inv_user"); setUser(null); }
  const isFileProtocol = typeof window!=="undefined" && window.location && window.location.protocol==="file:";
  if(MODE==="graph" && isFileProtocol) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag">Este archivo se abrió directamente desde tu computadora (no desde internet).</div>
    <div className="lerr" style={{marginTop:4,whiteSpace:"normal"}}>El inicio de sesión con Microsoft no puede completarse así — necesita que el archivo esté publicado en una dirección web (https://...), no abierto como archivo descargado.</div>
    <div className="hint" style={{marginTop:14}}>Solución: sube este archivo a GitHub Pages (como se explicó en las instrucciones de instalación) y ábrelo desde esa dirección web, por ejemplo <b>https://stra-pp.github.io/...</b>. Una vez publicado ahí, el botón de "Iniciar sesión con Microsoft" funcionará normalmente.</div>
  </div></div>;
  if(MODE==="graph" && checking) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag" style={{marginBottom:0}}>Conectando con SharePoint…</div></div></div>;
  if(MODE==="graph" && !connected) return <div className="login"><div className="sun"></div><div className="lcard">
    <div className="lbrand"><span className="dot"></span>Inventario A&amp;B</div>
    <div className="ltag">Inicia sesión con tu cuenta Microsoft para usar la app. Los datos se guardan en SharePoint (Prueba7).</div>
    <button className="btn ocean block" onClick={()=>msSignIn()}><Icon name="link" size={15} style={{marginRight:6}}/>Iniciar sesión con Microsoft</button>
    {msErr && <div className="lerr" style={{marginTop:12,whiteSpace:"normal"}}>{msErr}</div>}
    <div className="hint" style={{marginTop:14,wordBreak:"break-all"}}>Si el login da error de "redirect_uri", registra esta URL exacta en Azure (App registrations · Authentication · Single-page application):<br/><b>{APP.ms.redirectUri}</b></div>
  </div></div>;
  if(!user) return <Login onLogin={onLogin}/>;
  return <div className="app">
    <TopBar user={user} onLogout={logout}/>
    <div className="content">
      <div className="banner"><Icon name="alert" size={15} style={{marginRight:6}}/>Versión independiente de prueba — todavía no está conectada a la app principal de Playa Paraíso. Los datos ya se guardan de verdad en SharePoint (Prueba7).</div>
      <Inventario key={cfgVer} user={user} toast={toast}/>
    </div>
    {toastMsg && <div className="toast">{toastMsg}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
(function(){
  function show(msg){ var r=document.getElementById("root"); if(r&&r.children.length>0)return;
    r.innerHTML='<div style="max-width:560px;margin:40px auto;padding:20px;font-family:Inter,system-ui,sans-serif;color:#1f2a2c">'+
      '<h2 style="color:#0d6e75">Inventario A&amp;B no pudo cargar</h2><p style="color:#6c7a7c">'+msg+'</p>'+
      '<p style="color:#6c7a7c;font-size:13px">Si lo ves en la vista previa, descarga el archivo y ábrelo en tu navegador o súbelo a GitHub Pages.</p></div>'; }
  window.addEventListener("error",function(e){ show("Detalle: "+(e.message||"error al cargar un recurso")); });
  window.addEventListener("load",function(){ setTimeout(function(){
    if(typeof React==="undefined") return show("No se cargó React (la red bloqueó la CDN).");
    show("La aplicación no se inició. Abre la consola (F12) para más detalle."); },1800); });
})();
</script>
</body>
</html>
