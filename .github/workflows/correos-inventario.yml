name: Correos automáticos de inventario

on:
  schedule:
    # Hora UTC. Ecuador = UTC-5 → 10:03 (correo de carga de información) y
    # 11:03 (costos a Gerencia, evaluados con corte a las 11:00).
    # Ojo: GitHub puede retrasar u omitir corridas programadas; la decisión
    # para Gerencia usa la hora real de aprobación, así que un retraso no la cambia.
    - cron: "3 15,16 * * *"
  workflow_dispatch:
    inputs:
      prueba_para:
        description: "Enviar los correos como PRUEBA solo a este correo (vacío = envío normal)"
        required: false
        default: ""

concurrency:
  group: correos-inventario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Guayaquil
    defaults:
      run:
        working-directory: automatico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Enviar correos
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          PRUEBA_PARA: ${{ github.event.inputs.prueba_para }}
        run: node enviar.js
